שהכתוב הוא אומר ויאמר אלהים יהי אור וכו׳ ולא אמר יהי מאור א״כ מבואר מזה שלא היה לאור ההוא שום כדור הנקרא מאור שממנו יצא אותו האור. כי השמש והירח לא נבראו ביום א׳ אלא עד יום ד׳. והנה מקום האור הזה היה למעלה על גבי התהום עומד אצל החשך בין כסא הכבוד ובין התהום. הרי [?] שם נעשה ההבדלה בין האור והחשך, ולא היה החשך ההוא כמו חשך של עוה״ז שהוא ע״י העדר האור אלא הוא היה בריה בפ״ע כמו בריאת האור כמ״ש יוצר אור ובורא חשך. וכן אמרו רז״ל עשרה דברים נבראו ביום א׳ ובכללם הם חשך ואור וכו׳ ולכן לא היה האור מבטל את החשך והיו האור והחשך משתמשין יחד בערבוביא כדמיון אור השמש שיש עליה חשיפות [?] עבים שפעם מאפיל ופעם מאיר וראה המאציל שאין נאה לאור וחשך להשתמש ביחד ועמד והבדיל בין זה לזה וקבע לאור ביום ולחשך קבע בלילה. ולפי שהשמים והארץ נבראו קודם שנברא האור בעוד שהיה החשך לבדו כמבואר בפסוקים וכמ״ש בדיבור הקודם לכן אמר הכתוב בתחלה ויהי ערב ואח״כ ויהי בקר. וממה שקראם הכתוב יום א׳ למדו רבותינו ז״ל שהיום הוא נמשך אחר הלילה שעבר ואינו נמשך אחר הלילה הבא שאינו כסברת אומות העולם שמתחילים היום [?] באור הבקר ומסיימין אותו בסוף הלילה שלאחריו. ולפי שמקום האור הזה היה למעלה מן התהום אצל כסא הכבוד לכן לא היה כח באור ההוא לבקוע ולעבור בין חשכת המים ולהגיע הארתו עד למטה לארץ ולכן הוצרך המאציל לברוא את ב׳ המאורות הגדולים ותלאם ברקיע כדי להאיר על הארץ כן הוא פשט הפסוקים. אבל קבלת חז״ל היתה כי אור שנברא ביום א׳ היה האדם יכול להביט בו מסוף העולם ועד סופו וראה הקב״ה שאין העולם ראוי להשתמש בו מפני הרשעים עמד וגנזו לצדיקים לעת״ל. א״כ לפי דבריהם היה כח באור ההוא לבקוע את תהום רבה ולהאיר על הארץ ועמד וגנזו דהיינו שגזר על אותו האור שלא יתפשט למטה לארץ ונשאר גנוז במקומו למעלה מן התהום ולכך הוצרך לברוא ביום ד׳ את שני המאורות הגדולים.", "[ויש רמז בהקדמת החשך לאור שהוא ענין הקדמת הקליפה לפרי ויצה״ר ליצה״ט. ועשו ליעקב. ועוה״ז לעוה״ב. ושמוש האור והחשך בערבוביא ביחד הוא ענין קליפת נוגה הכלולה מטוב ורע כנודע. והנה [?] סיום חמשה פסוקים דיום א׳ הם אותיות צמרכ״ד והוא שם קדוש וכשחל ר״ח ניסן ביום ה׳ כותבים אותו בשעת שליטת מזל צדק וזמן שליטתו היא מתחלת שעה א׳ מהיום עד סופה ומתחלת שעה ח׳ עד סופה דהיינו אחר י״ב שעה ואחר ז׳ שעה. ו רע״ה אח״כ ואמר הראני נא את כבודך שרצה לראות את השכינה מבלי זה המלבוש והשיב לו כי לא יראני האדם וחי ועוד נפרש פי׳ אחר בעזה״י בפרשת כי תשא יעו״ש. והנה מן הראוי היה שלא יהיה שום נברא בעולם להיות נוצר ונעשה בדמות הצלם והדמות שבחר לו ית׳ להתלבש בו יען כי הוא מלבוש מלכו של עולם המיוחד אליו לצאת בו מהיכלו [?] אך הוא יתברך חיבב את האדם ויצר את האדם בצלמו בצלם דמות תבניתו ע״ד שאמר הכתוב איש אשר המלך חפץ ביקרו יביאו לבוש מלכות אשר לבש בו המלך ולכן לא נברא האדם כ״א ביום הששי אחר גמר כל הברואים כולם כי בכל אותם הה׳ ימים היה חס ית׳ לברוא דמות צלמו רק ביום הששי נמלך בינו לבין [?] עצמו ואמר נעשה אדם בצלמנו כדמותנו. ועל זה המלבוש ע״ב וז״ל ואפי׳ האי תמונה לית ליה באתריה אלא כד נחית לאמלכא על בריין ולאתפשטא נהוריה עלייהו יתחזי לון לכל חד כפום מראה וחזיון ודמיון דילהון והאי איהו וביד הנביאים אדמה וכו׳ ושם האריך מאד בזה יעו״ש."]}, {"id": "s7", "n": 7, "title": "בו יבואר ענין הצלם וב׳ צללים של האדם", "paras": ["וייצר ה״א את האדם עפר מן האדמה ויפח באפיו נשמת חיים וכו׳. הנה ס״ת ויפח באפיו נשמת חיים חותם [?] וחותם זה הוא רומז לשלשה שמות אהיה א׳ במלוי יודי״ן וא׳ במלוי אלפי״ן וא׳ במלוי ההי״ן והם קס״א קמ״ג קנ״א העולים בגי׳ חותם עם הכולל. והנה אהיה דיודין הוא נקרא צלם כי צלם הוא גי׳ קס״א עם הכולל. ושני אהיה האחרונים הם נקראים צללים ולא צלמים ועל ידי הצלם וב׳ הצללים אלו האדם הוא חי בעוה״ז וזהו מש״ה אך בצלם יתהלך איש. וכן על הצללים נאמר עד שיפוח היום ונסו הצללים וכמבואר כל זה בשער הכוונות בדרוש ז׳ דסוכות דק״ו סע״ד יעו״ש. ולפי שאלו הג׳ שמות העולים גי׳ חותם הם שומרים את נשמת האדם שלא תסתלק ממנו לכן כשנפח ית׳ באדה״ר נשמת חיים חתם אותה בג׳ שמות הנז׳ הרמוזים בס״ת ויפח באפיו נשמת חיים."]}, {"id": "s8", "n": 8, "title": "בו יבואר ענין ג״ע שהוא בארץ ולא ברקיע. וגם יבואר מקום עה״ח ועה״ד טו״ר", "paras": ["ויטע ה״א גן בעדן מקדם. תחלה עשה את העדן ואח״כ עשה בעדן [?] גן ונטע בו כל מיני אילנות. ואומרו מקדם. ר״ל מקודם שברא את אדה״ר כבר נטע את הגן של העדן כמו שתרגם אנקלוס מלקדמין. ואח״כ וישם שם את האדם אשר יצר. ודע כי גן עדן וכן עץ החיים ועץ הדעת הם בארץ הזאת שהרי משם יוצא הנהר והיה לד׳ ראשים שהם פישון וגיחון וחדקל ופרת וכמ״ש רמב״ן ז״ל בפסוק כ״ב יעו״ש. ועה״ח ועץ הדעת שניהם הם באמצע הגן כמ״ש ועץ החיים בתוך הגן ותרגם אנקלוס במציעות גנתא. וכן על עה״ד אמרה חוה לנחש ומפרי העץ אשר בתוך הגן ותרגם אנקלוס די במציעות גנתא וכאלו נאמר שנעשה באמצע הגן ערוגה א׳ ובה נטועים ב׳ אילנות זו אצל זו וכמ״ש רמב״ן בפסוק ח׳ יעו״ש וכ״כ מהרח״ו ז״ל בע״ח שמ״ב באמצע פ״ג שהם כדמות ב׳ אנשים אחד קדוש והב׳ הוא אדם בליעל העומד בצדו יעו״ש."]}, {"id": "s9", "n": 9, "title": "בו יבואר תוכן דעת אדם וחוה באיזה מדרגה היה דעתם קודם אכילתם מעה״ד ובאיזה מדרגה היה דעתם אחרי אכילתם מעה״ד", "paras": ["ויקח ה״א את האדם וינחהו בג״ע לעבדה ולשמרה. מפסוק זה נוכל להבין מדרגת הדעת של אדה״ר איך היתה קודם אכילתו מעה״ד טו״ר כי מפסוק זה נראה שחכמה יתירה היה לו לאדה״ר עד שסמך ית׳ עליו וצוה עליו לעבוד את הגן דהיינו להיות פולח ובוקע בארץ ולעשות עוגות סביבות האילנות לקיבוץ המים ולבער הקוצים מן הכרם ולחרוש ולנטוע ולזמור [?] וכיוצא בזה. וכן לשמרה מדברים המזיקין לאילנות ולזרעים ולפירות ולדוש ולדרוך הזיתים והענבים ולתקן יקבים וקורות בית הבד ובורות וכלים וחביות ואוצרות ולזרות התבואה. ולבנות לו בית לשבתו. ולפעמים יצטרך לצאת גם מחוץ לגן לחזר על איזה דבר הנחוץ לו כגון לחצוב לו נחשת וברזל כדי לתקן מהם [?] כלים הנצרכים למלאכתו כי לא מצינו שנאסר לו לאדם לצאת לאיזה צורך מחוץ לגן ולחזור אח״כ לגן כי כל העולם כולו היה ברשותו. מכל זה נראה שהיה לו לאדם דעת גדולה וחכמה ותבונה להכיר בטיב [?] האילנות ובנגעיהם [?] ובגידולם כאדם הרגיל בהם משנים קדמוניות. כי לא ימסור ית׳ את גן עדנו ביד איש פתי וחסר לב שאינו יודע בין ימינו לשמאלו אם לא דקים ליה בגויה שיש לו דעת שלם ומספיק לעסק גדול כזה ויכול לעבדה ולשמרה כראוי. ועוד יש להביא ראיה שהיה אדה״ר חכם גדול ממה שמצינו שקרא שמות לבהמות ולחיות ולעוף השמים לכל א׳ וא׳ כפי הנאות והראוי לו אעפ״י שהיו מינים רבים עד אין מספר ולא עוד אלא שיש מהם שקרא לזכרים שם בפ״ע ולנקבות שם בפ״ע כגון שור ופרה תייש ועז איל ורחל אריה ולביא גמל ונאקה חמור ואתון וכל זה היה בזמן מועט בשיעור שעה א׳ בלבד כנז׳ בגמרא ולא טעה בשם א׳ לחזור ולקרוא בו מין אחר מכ״ז נראה שהיה לו חכמה גדולה ובקיאות גדולה גם בבעלי חיים למיניהם. גם יש ראיה אחרת שהיה לאדם חכמה גדולה ממה שמצינו שצוהו ית׳ שלא לאכול מעה״ד והפחידו במיתה אם יעבור על מצותו. ואם לא היה בו דעת גדולה חוץ מן הטבע איך היה מכיר מה היא המיתה ומה צער יש בה כי עדין לא מת שום נברא בעולם טרם זה ואיך הוא מפחידו במה שאינו מכיר, ומאחר שכן הוא א״כ ראוי להבין מה נתחדש להם אח״כ באכלם מעה״ד טוב ורע.", "אבל הביאור הוא כי טרם אכילתם מעה״ד לא היה להם דעת כ״א מצד הטוב בלבד כדעת צבא מרום ואינם יודעים לעשות רע כלל לא בפועל ולא במחשבה ולא בהרהור כאדם האוכל שלא יעלה על לבו לחשוב כמה לעיסות לעס ובעת לכתו בדרך לא יתן על לבו כמה פסיעות פסע. ולכן היו ערומים ולא היו מתבוששים כי אין עולה על לבם שום הרהור רע ולא היה להם שום הפרש בין אברי המשגל לבין הפנים וכפות הידים וכמ״ש רמב״ן ז״ל באות ח׳ יעו״ש. ואין לתמוה על זה כי גם בדורות הראשונים היה נמצא כזה כמו שמצינו בברכות ד״כ ברב גידל שהיה יושב בשערי הטבילה. וגם בדורות אלו ימצא כמה אנשים טהורי לב שאפי׳ אם רואים נשים יפיפיות או פרוצות חשופי חזה וזרועות אינם באים לידי הרהור כלל אם אין אותן הנשים מתגרים בהם כי צדיק מעצמו רשע מחבירו. באופן כשברא הקב״ה את האדם נתן בו דעת ותבונה מצד הטוב בלבד והוא הנקרא יצה״ט וז״ש בקהלת סי׳ ז׳ אשר עשה האלהים את האדם ישר וכמבואר בזו׳ ויחי דרכ״א ע״ב יעו״ש עד שבא הנחש וערבב את העולם כמו שנפרש אח״כ בעזה״י."]}, {"id": "s10", "n": 10, "title": "בו יבואר סגולת אכילת עה״ד וביאור כי ביום אכלו ממנו מות ימות", "paras": ["ומעץ הדעת טו״ר לא תאכל ממנו. תרגם אנקלוס ומאילן דאכלין פירוהי חכמין בין טב לביש. מבואר מדבריו שאין האילן הוא עצמו כלול מטו״ר אלא פירותיו הם מסוגלים להאוכל אותם לתת לו דעת להבחין בין טוב לרע. ומאחר שנותן לו דעת להבחין בין טוב לרע א״כ אפשר שלפעמים יבחור ברע ולא בטוב ולכן צוהו ית׳ שלא יאכל ממנו פן ימשך אחר הרע. וא״כ לפי דעת התרגום הקב״ה פירש לאדה״ר סגולת האילן וא״ל שהוא [?] עץ הדעת טו״ר ואח״כ צוה עליו שלא יאכל ממנו כדי שלא יחשוב אדה״ר שהאילן הוא ממית כמו סם המות אלא המיתה היא מסיבת עוברו על מאמרו ית׳. ואומרו כי ביום אכלך ממנו מות תמות. אינו ר״ל שביום ההוא ימות אבל הכוונה שביום ההוא יהיה מחוייב מיתה בידי שמים והוא ימית אותו בזמן שירצה כדרך חייבי כרת ומיתה בידי שמים שהכוונה בהם שימותו בחטאם טרם בא יומם וכמוהו והיה ביום צאתך ועברת את נחל קדרון ידוע תדע כי מות תמות שאין הכוונה שימות בו ביום אלא ר״ל יהיה מחויב מיתה למלך והוא ימית אותו בעת שירצה וכמ״ש רמב״ן ז״ל בפסוק יז׳ יעו״ש ולכן האריך ית׳ לאדה״ר תתק״ל שנים כדי שירבה בנים ובנות ליישב העולם ואח״כ המיתו."]}, {"id": "s11", "n": 11, "title": "בו יבואר צורך בריאת חוה וצורך קריאת שמות לבעלי חיים", "paras": ["ויאמר ה״א לא טוב היות האדם לבדו אעשה לו עזר כנגדו. מפשט הפסוק מבואר כי תחלה היה ברצונו ית׳ להיות האדם לבדו בלא עזר כנגדו. ואח״כ חזר ונמלך לעשות עזר כנגדו. וצריך להבין בתחלה מאי סבר ולבסוף מאי סבר. ועוד למה נשתנה האדם מכל הנבראים כולם שכולם נבראו זכר ונקבה והוא לא נברא רק זכר בלבד. ואגב אורחין נמי יש להתעורר כי מאחר שנברא האדם יחידי א״כ בודאי אינו מוליד ומאחר שאינו מוליד א״כ למה בראו זכר ולא בראו נקבה דמאי אכפת לן אם יהיה איש או אשה דדא ודא אחת היא. אמנם הענין הוא כי תחלה אמר ית׳ נעשה אדם בצלמנו כדמותנו ולכן נברא האדם יחידי זכר בלא נקבה כדמיון צלמו ית׳ שהוא יחידי ואין לו שני ואם יברא לו עזר יהיה דבר זה נוגע בכבודו ית׳. ולפיכך נברא זכר ולא נקבה וגם אינו מוליד ואינו מת עולמית ומשליטו [?] בכל העולם כולו כדרך שהוא ית׳ שולט בעליונים ובתחתונים רק שאדה״ר אינו שולט בעליונים כמש״ה ותחסרהו מעט מאלהים וכו׳ תמשילהו במעשי ידיך כל שתה תחת רגליו וכו׳ וכאשר צוהו ית׳ על אכילת עה״ד ואמר לו כי ביום אכלו ממנו מות ימות. גזרה זו של המיתה גרמה לברוא עזר כנגדו. כי חשש ית׳ פן באורך הזמן יאכל האדם מעה״ד ויהיה גורם מיתה לעצמו וא״כ יהיה העולם חסר בריה א׳ מהנבראים בששת ימי בראשית. כי אחר שנכנס שבת בראשית אז שבת ית׳ מכל מלאכה ולא יסף עוד לברוא יש מאין ולכן בעוד שלא נגמר יום הששי אמר ית׳ כי מאחר שקנסתי מיתה על אדה״ר אם יעבור על דברי ויאכל מעה״ד א״כ מעתה לא טוב היות האדם לבדו אעשה לו עזר כנגדו כדי להוליד זרע אחריו לקיום המין. ולכן אחר פסוק כי ביום אכלו ממנו מות ימות סמך לו פסוק ויאמר ה״א לא טוב היות האדם לבדו וכו׳. ומאחר שמטעם פן יאכל האדם מעה״ד נבראת חוה מעתה לא יהיה נמשך מזה דבר אי כבוד בחקו [?] ית׳ על אומרו נעשה אדם בצלמנו כדמותנו יען שכבר נברא האדם יחידי.", "ולפי דרכינו נשית לב על שני פסוקים של קריאת שמות הבהמות והחיות שהם פסוק ויצר ה״א מן האדמה וכו׳ ופסוק ויקרא האדם וכו׳ שהם נכנסין באמצע ענין עשיית העזר. כי אחר שכתב לא טוב היות האדם לבדו אעשה לו עזר כנגדו ראוי לסיים ויפל ה״א תרדמה וכו׳ ומה ענין קריאת השמות להכנס פה בין הדבקים. אבל הענין הוא כי כאשר ראה ית׳ שלא טוב היות האדם לבדו ורצה לעשות עזר כנגדו כל ענין זה היה במחשבה לבד ואדה״ר לא ידע מזה מאומה. וצפה הקב״ה שאם יפיל על האדם תרדמה ויקח א׳ מצלעותיו ויברא אח״כ חוה יהיה אדה״ר עומד ומתמיה ואומר בלבו לא ידעתי על מה עשה ה׳ ככה לברוא לי נקבה להיות שותף עמי במעשה בראשית חלק כחלק כי מה עשיתי ומה מצא בי עול. ויהיה לו שנאה גדולה עם אשתו. ומי כהחכם ומי יודע פשר דבר כמוהו ית׳ שרצה שאדה״ר יקבל את חוה בסבר פנים יפות ויאהב אותה כנפשו ויתן שבח והודאה לשמו ית׳ על שברא לו עזר כנגדו לכן מה עשה השי״ת אחרי אומרו אעשה לו עזר כנגדו. קרא את אדה״ר והעמידו בשער הגן והביא לפניו את כל בעלי חיים שמחוץ לגן והעבירם לפניו כת אחר כת ומין אחר מין כדי לראות מה יקרא להם שמות כדי שעי״כ בלבבו יבין ובעיניו יראה שכל מין ומין מן הבעלי חיים הם זכר ונקבה. כי לא היה די להעביר לפניו את הזכרים לבדם [?] יען כי יש כמה מינים שהזכרים נקראים בשם א׳ ונקבותיהם בשם אחר כגון שור ופרה תייש ועז איל ורחל חמור ואתון גמל ונאקה אריה ולביא ועי״כ יהיה חושב בלבו ואומר עוד מעט ותבוא גם נקבה שלי בתוך הבאים אלא שעדין היא מחוץ לגן כי גם אני הייתי בתחלה מחוץ לגן ועתידה היא ליכנס כדי לקרוא לה שם כדרך שקראתי שמות לכל בעלי חיים. וכאשר קרא שמות לכל בעלי חיים והיה בודק בהם לא מצא בהם עזר כנגדו. פי׳ כי לכל א׳ מבעלי חיים מצא אדה״ר עזר כנגדו של הזכר ההוא. דהיינו שהעזר הוא עשוי בדמות אבריו של הזכר ובצלמו ובדמותו באין שום הפרש כלל וזהו כנגדו. רק לאדם לא מצא עזר כנגדו וכדמותו שהיא עשויה בקומה זקופה ובחיתוך אברים כמוהו כי אפי׳ הנחש קודם שנתקלל היה הולך על ארבע רגלים כשאר חיות כי לא היה בקומה זקופה רק האדם לבדו על כי הוא נעשה בצלם דמות קונו. ואחר שכבר ראה האדם וידע שכל מין צריך שיהיה זכר ונקבה ונהיה [?] לו חשק ותאוה להיות גם אליו עזר אז ויפל וכו׳ ולקח את הצלע אל מחוץ לגן ושם בנאו [?] לאשה כמו שעשה גם את האדם מחוץ לגן. ולזה אמר הכתוב ויביאה אל האדם כי גם היא נוצרה מחוץ לגן וכאשר נתעורר האדם מתרדמתו ראה והנה אשה באה לקראתו ליכנס לגן. ולזה אמר זאת הפעם וכו׳ פי׳ זאת הפעם מן הבאים לקרא להם שמות היא עצם מעצמי ובשר מבשרי כלומר זו עשויה כעין עצמי ובשרי והיא כנגדי ממש ואינה כמו הנכנסין בתחלה לפני שלא מצאתי בהם כנגדי כעין עצמי ובשרי. (א״נ זאת הפעם ר״ל זאת הצלע והוא מלשון ונתתה על ארבע פעמותיו שר״ל על ארבע צלעותיו) ואמר לזאת יקרא אשה. לפי שהיה סובר שעדין הוא עומד לקרוא שמות אלא שנתנמנם קצת באמצע קריאת השמות."]}, {"id": "s12", "n": 12, "title": "בו יבואר ענין הנחש איך נכנס לגן", "paras": ["והנחש היה ערום וכו׳ ויאמר אל האשה וכו׳. אעפ״י שבזמן שנצטוה אדה״ר על אכילת עה״ד עדין היתה חוה צלע ולא נפרדה ממנו. מ״מ גם הצלע הוא היה נכלל בצווי כי הוא חלק א׳ מחלקי גופו וכל גופו הוא בכלל הצווי ואם היה אוכל ומת גם הצלע היה מת עמו. אמנם צריך להבין מי הכניס נחש זה לגן ואיך היה לו רשות ליכנס לגן כי השי״ת לא הכניס כי אם האדם. ואין לומר כי בזמן קריאת השמות שהיתה קודם הפלת התרדמה ולקיחת הצלע נכנס לגן ונשאר בו זה אינו כי ענין צווי אכילת עה״ד קדם לקריאת השמות ומדברי הנחש שאמר לחוה כי יודע אלהים וכו׳ והייתם כאלהים יודעי טו״ר מבואר שהיה הנחש עומד ושומע מה שידבר ה״א עם אדה״ר ומצוה אותו על עה״ד וא״כ היאך נכנס לגן. ונלע״ד כי כשנכנס אדם לגן וצוהו לעבדה ולשמרה קרא אדה״ר את הנחש כדי לעמוד לפניו לשרתו ולעזור אותו בעבודת הגן. ובחר בנחש יותר מכל בעלי חיים לפי שהיה יודע לדבר כבני אדם וערום יותר מהשועל ובעל כח וגבורה יותר מן הארי כמ״ש בסנהדרין דנ״ט ע״ב חבל על שמש גדול וכו׳ ולכן היה לו רשות ליכנס ולעמוד לשרת לפני אדם וכאשר נבראה חוה הלך גם אצל חוה לשרתה ובגשתה אצל עה״ד פיתה אותה לאכול מטעם [?] שנכתוב בסמוך."]}, {"id": "s13", "n": 13, "title": "בו יבואר טעם שפתה הנחש לחוה וגם למה לא פיתה לאדה״ר", "paras": ["ומפרי העץ אשר בתוך הגן אמר אלהים לא תאכלו ממנו ולא תגעו בו פן תמותון. מתשובת חוה לנחש שאמרה ומפרי העץ אשר בתוך הגן וכו׳ ולא אמרה לו ומפרי עץ הדעת טו״ר אמר אלהים לא תאכלו ממנו וכו׳ מבואר מזה שלא היתה יודעת חוה שהעץ מסוגל להאוכל ממנו להיות לו דעת טו״ר. כי אדה״ר בצוותו את חוה על אכילת עץ הדעת לא ביאר לה הענין באר היטב רק א״ל בקיצור כי מפרי העץ הזה אמר אלהים לא תאכלו ממנו פן תמותון. והיא סבורה [?] כי זה העץ הוא סם המות ולזה הזהירם ית׳ ממנו וכמ״ש רמב״ן בפסוק ו׳ יעו״ש ולזה הוסיפה לפי דעתה ואמרה ולא תגעו בו מחשש אולי ימצא איזה סריכיה ביד הנוגע ותדבק שם הסם [?] בדם הסריכה ועי״ז ימות כמו האוכל באין הפרש. ובא הנחש והעמידה על האמת כי זקן הוא ממנה לימים ואמר לה לא מות תמותון באכילתו כי אינו סם המות. ואם תשאלי א״כ למה אמר אלהים לא תאכלו ממנו הטעם הוא כי יודע אלהים כי ביום אכלכם ממנו ונפקחו עיניכם והייתם כאלהים יודעי טו״ר. ולפי שרוצה [?] אלהים שיהיה לו יתרון עליכם ותהיו משועבדים תחת ידו לזה הזהיר אתכם שלא תאכלו ממנו פן תהיו כאלהים יודעי טו״ר ולפי שהנחש היה ערום לא פירש לה שסיבת המיתה היא קנס על עברם על מצות ה׳ כדי שתסבור חוה שאין מיתה בדבר זה מאחר שאינו סם המות ומפי עליון יצאו דברים אשר לא כן ח״ו ועי״ז יתחזק לבה לאכול מפרי העץ ומטעם זה לא הלך הנחש אצל אדה״ר לפתות אותו יען כי אדה״ר הוא יודע שאין העץ סם המות אלא המיתה היא מסיבת עוברם על מצות ה׳. והנה מן הראוי היה לחוה להיות חוקרת את הנחש על זה כי אולי מהתל הוא בה ותסכן עצמה באכילתה מעץ סם המות הזה ולא תהיה כאלהים. והיה לה לשאול את פיהו מאיפה נודע לך שאילן זה אינו סם המות והאוכל מפרותיו יהיה לו דעת אלהים קדושים. ולא יתכן לנחש להשיב שהוא אכל מפרותיו כי הנחש הוא מין חיה ולא הותר לו לאכול כ״א ירק עשב בלבד כי מטעם זה אמרה [?] לו חוה אכול אתה תחלה מעץ הדעת ואראה אם כנים דבריך. ואם יאמר לה שהוא היה עומד אצל אדה״ר בשעה שצוהו ה׳ שלא יאכל מעץ הדעת ומשם ידע את כל אלה אז היה להשיב לנחש א״כ מוטב לילך אצל בעלי ומשם אבין אמתות הענין. והיא לא עשתה כן אלא האמינה לדבריו והיה מה שהיה. אמנם הנחש רוח אחרת היתה אתו כי אמר בלבו כי טוב להגיד לחוה את ענין עה״ד שהוא פוקח עורים [?] ומשכיל את האדם כי אולי תפותה ותאכל ותפתה גם את בעלה וביום אחד ימותו שניהם וימסור ה׳ בידי את גן עדנו בראותו אותי כי אני פקח וערום וזריז מכל החיות ואהיה אני לבדי בעל הגן. וגם יצא אצא לחפשי מתחת יד עבודת האדם אשר אמר אלהים ורדו בדגת הים ובעוף השמים ובכל חיה הרומשת על הארץ. גם ארויח שלא אהיה אוכל עוד ירק עשב כשאר החיות. כי אין משורת הדין לעבוד את הגן ולא לאכול ממנו משום לא תחסום וא״כ אהיה אוכל ומתענג בפירות הגן. גם אזכה לאכול מעץ החיים ועי״כ אהיה חי אנכי לעולם כן חשב הנחש בלבבו שאל״כ למה לו לפתות את חוה ולמה העלים ממנה ולא הגיד לה ג״כ שאם תאכל מעה״ד תתחייב מיתה בידי שמים."]}, {"id": "s14", "n": 14, "title": "בו יבואר מהו ונפקחו עיניכם ומהו פי׳ [?] סחטה ענבים", "paras": ["ותרא האשה כי טוב העץ למאכל. פי׳ ואינו ממית באכילתו כמו שהיתה סוברת. וכי תאוה הוא לעינים. כמ״ש ונפקחו עיניכם להיות מרגישים בחסרונות ובפגימות [?] של האדם. ונחמד העץ להשכיל. כמ״ש והייתם כאלהים יודעי טו״ר. ותקח מפריו ותאכל ותתן גם לאישה עמה ויאכל. אומרו עמה יתכן כי לא היה רוצה אדה״ר לאכול כי חשש אולי שהנחש וחוה הערימו סוד ביניהם להאכיל את אדה״ר מעה״ד כדי שימות וישא הנחש את חוה לכן לא רצה לאכול עד שתאכל חוה לפניו וזה אומרו ותתן גם לאישה עמה ויאכל. והנה יש מאן דאמר כי עה״ד גפן היה וחוה סחטה ענבים ונתנה לו. ואעפ״י שעדין לא היה נמצא שום כלי לסחוט בו הענבים אפשר שסחטה בתוך קליפת אבטיח וכיוצא. אמנם מ״ש אח״כ ויאכל קשה שראוי לומר וישתה וכן אמר אח״כ היא נתנה לי מן העץ ואוכל ולכן נלע״ד לפרש שסחטה את הענבים בקרקע כדי להוציא את יינם ונתנה לו ענבים סחוטים לאכול. כי לא היה רוצה אדה״ר לאכול מסיבת צוויו ית׳ וחוה א״ל מלתא בטעמא כי עיקר צווי ה׳ אינו כ״א על היין היוצא מהגפן ועליו הוא מקפיד פן ישתכר ולא יעבוד את הגן כראוי ולכן בהסיר את היין ממנו אין שום איסור בזה ולכן סחטה את הענבים ונתנה לו לאכול כדי שיזכה גם הוא להיות פקח כמוה כי לפי דעתה אין בזה מיתה כלל."]}, {"id": "s15", "n": 15, "title": "בו יבואר מה פירוש יצה״ט ויצה״ר ומה פירוש הזוהמא שהטיל נחש בחוה", "paras": ["ותפקחנה עיני שניהם וידעו כי ערומים הם. לענין החכמה הכתוב מדבר כי הלא גם הסומא יודע שהוא ערום כמ״ש רש״י ז״ל. וידעו כי ערומים הם. פי׳ שידעו שיש בושת וכלמה באדם הערום כי היה להם דעת כלול מטו״ר והם הנקראים בדברי רז״ל יצה״ט ויצה״ר. ר״ל ציור מחשבה טובה וציור מחשבה רעה. כי יצר עניינו ציור כמו ויצר את שני העמודים נחשת (מלכים א׳ סי׳ ז׳ פסוק טו׳) וכן וכל יצר מחשבות לבו רק רע כל היום ר״ל ציור מחשבות לבו. וכן כי ידעתי את יצרו. וכן וכל יצר מחשבות הוא מבין (דברי הימים א׳ סי׳ כח׳ פסוק ט׳) וכן ליצר מחשבות לבב עמך (שם כט׳ פסוק יט׳) הכל הוא ציור המחשבה אם טוב ואם רע. ואפשר כי זה היצה״ר הוא ענין הזוהמא שהטיל הנחש בחוה כי ע״י עצתו הנבערה גרם להטיל זוהמא רעה שהוא היצה״ר בחוה כי הוא לא פיתה כ״א לחוה בלבד ולא לאדם."]}, {"id": "s16", "n": 16, "title": "בו יבואר סדר התוכחות על עון שלא יבהל המוכיח את הנוכח", "paras": ["וישמעו את קול ה״א מתהלך בגן. מרוב ענותנותו של הקב״ה עשה עצמו כביכול כמטייל בגן לשאוף רוח היום. כי יומי ניסן היו לסברת רבי יהושע ויומי תשרי היו לסברת רבי אליעזר. ולשני הסברות אותן הימים הם יפים ונעימים לטיול. ואומרו לרוח היום. ר״ל לרוח המצויה בכל יום והיא רוח צפונית המנשבת בנחת וברוח צח. ומה גם שהיה בשעה עשירית מהיום שכבר פנה חום היום כי בשעה עשירית סרחו. ולא נגלה עליהם ברוח גדולה וחזק מפרק הרים ומשבר סלעים כמנהג כאשר ה׳ עובר כמ״ש רמב״ן ז״ל כדי שלא להבעית האדם ואשתו ויסתתמו טענותיהם מאימת השכינה ולא ידעו מה להשיב על תוכחתם כי חפץ חסד הוא."]}, {"id": "s17", "n": 17, "title": "בו יבואר שאלת ה״א אל האדם באומרו אליו איכה", "paras": ["ויקרא ה״א אל האדם ויאמר לו איכה. יודע היה היכן הוא אלא כדי ליכנס עמו בדברים שלא יהיה נבהל להשיב אמר לו כן. וכן בקין הוא אומר אי הבל אחיך וכן בבלעם א״ל מי האנשים האלה עמך כדי ליכנס עמהם בדברים וכן ביחזקיהו בשלוחי מרודך בלאדן. (רש״י ז״ל)."]}, {"id": "s18", "n": 18, "title": "בו יבואר התנצלות אדם וחוה על תוכחתם", "paras": ["ויאמר האדם האשה אשר נתתה עמדי. פי׳ האשה אשר אתה בכבודך ובעצמך נתת עמדי להיות לי לעזר. היא נתנה לי מן העץ. והייתי חושב שכל מה שתאמר אלי הוא לעזר ולהועיל והאכילה גם היא מכללות העזר (רמב״ן פסוק יב׳ [?]). ותאמר האשה הנחש השיאני ואוכל. כי אמר אלי לא מות תמותון וגם נהיה כאלהים יודעי טו״ר ולא אמר לי שיש בו מיתה כ״א [?] מצד עונש העבירה כי לא סיים הענין לפני ובשגגה אכלתי."]}, {"id": "s19", "n": 19, "title": "בו יבואר קללת הנחש ומה גרם [?] רעות אל יצורי עולם בעצתו הנבערה הזאת", "paras": ["ויאמר ה״א אל הנחש כי עשית זאת. פי׳ כי עשית זאת התקלה לחוה להודיעה על דבר שלא שאלה מאתך וגם נתת מכשול לפני עור שלא סיימת ענין המיתה לפניה. לפיכך ארור אתה מכל הבהמה ומכל חית השדה. ויש לתמוה וכי הבהמות וחיות השדה ארורים הם כדי שאפשר לומר שיהיה מקולל יותר מהם. אך הענין הוא כי כל בעלי חיים מתחלת ברייתם הם נבראו זכר ונקבה אשר זה מורה שסופם למות שלכן נבראו זו״נ כדי לחיות זרע על פני כל הארץ ולא יכרת המין ההוא מן העולם. חוץ מהאדם העשוי בצלם ודמות קונו שנברא יחידי שאינו מעותד למות כל ימי עולם. וא״כ הבהמות והחיות הם ארורים בענין זה שאינם חיים חיי עולם. והנחש אשר גם הוא מין חיה נתקלל יותר מהם שעל גחונו ילך ועפר יאכל כל ימי חייו. וטעם שבחר לו ה׳ לקללו באלו הקללות. לפי שהקב״ה מדתו מדה כנגד מדה. ולפי שהיתה כוונת הנחש להחטיא את אדם וחוה כדי שימותו והוא יהיה עובד את הגן גזר עליו שעל גחונו ילך כדי שלא יצלח עוד למלאכה. ותחת אשר נתאוה לאכול את פירות הגן ולא ירק עשב גזר עליו ועפר יאכל כל ימי חייו ולא ירק עשב כבתחלה. ולא רצה ה׳ להמיתו לגמרי ולבטלו מן העולם לפי שקשה בעיניו ית׳ לבטל בריה א׳ מאשר ברא בששת ימי בראשית. וגם כדי שיהיה הנחש נשאר וניכר [?] לדורות הבאים לחרפות ולדראון עולם כמ״ש דוד הע״ה אל תהרגם פן ישכחו עמי וכו׳ וכענין מחתות הנחשת של קרח ועדתו שרקעום צפוי למזבח זכרון לבני ישראל. וליקח [?] הדורות מוסר מן הנחש שלא יהיה האדם משגה ישרים בדרך רע. צא ולמד שכמה רעות נמשך מעצתו של נחש הארור כי מסיבת עצתו גרם מיתה לאדם ולאשתו שהיו בצלם אלהים וגרם מיתה לכל הדורות הבאים אחריהם עד סוף העולם להיות יורדי דומה. ונטרדו מן הגן ונשאר הגן בלא עבודה ושמירה. ולא עוד אלא שנגזר על האדם בעצבון ובזיעת אפים יאכל לחם וקוץ ודרדר תצמיח לו ויאכל את עשב השדה כמו הבהמות. ונוסף לחוה שבעצב תלד בנים וגרם להיות יצר לב האדם רע מנעוריו וכל יצר מחשבות לבו רק רע כל היום לעבוד ע״ז ולשפוך דם ולגזול ולחמוס ולגנוב ולנאוף וכיוצא בזה עד שמזה נמשך פורענות לכל העולם כולו כמו דור אנוש שעבדו ע״ז ועלה ים אוקיינוס והציף שלישו של עולם ואח״כ היה דור המבול ודור הפלגה ודור סדום ועמורה שכולם היו מכעיסין ובאים. ואח״כ היה גלות מצרים בחומר ובלבנים וכל המלחמות הנעשים בעולם. וחורבן הבית והריגת הצדיקים והחסידים ואורך הגלות המר והנמהר הזה וחולאים ומכאובים וחסרון כיס וחרב ורעה ורעב ודבר וכיוצא בזה לאין מספר. ואלמלא פיתויו ועצתו של נחש היה כל העולם כולו שאנן ושליו שוקט ובוטח אין פרץ ואין צוחה. אין בכי ואין אנחה. אין מלך ואין שרים. אין שופט ואין שוטר. אין מושל ואין נוגש. ועד עכשיו היינו יושבים בג״ע עובדים ופולחים בגן ביחד באין ריב ומדון. ואין קנאה ושנאה. כולנו נחשבים כאברי אדם א׳ שלא יתכן שיפול ריב ומדון בין אבר לאבר. ואם יזדמן אח״כ איזה איש או אשה מאנשי הגן שיאכל מעץ הדעת הוא לבדו היה מת ואין זרעו מתים כי כל אדם האוכל הבוסר תקהינה שיניו כי דווקא דבר הנעשה בששת ימי בראשית שהם ששת ימי הבריאה של כללות העולם כולו הוא יהיה קיים עד סוף כל העולם ואינו משתנה כלל כמו שמצינו בענין אדה״ר שנברא מהול כמ״ש בפ״ב באבות דרבי נתן על פסוק כי בצלם אלהים עשה את האדם יעו״ש וכאשר היה האדם מושך בערלתו כמ״ש בסנהדרין דל״ח נעשה ערלה לכל באי עולם. וכן הנחש שניטל ממנו כח הדיבור ונקצצו ידיו ורגליו נעשה ענין זה לכל הנחשים הנולדים ממנו אח״כ עד סוף העולם. ולא היה מוליד נחשים שיש להם ידים ורגלים כמו אדם הקטע יד המוליד בנים שלימים והטעם כי כל מה שנעשה בששת ימי בראשית הוא יהיה קיים לעד לעולם בלא שינוי כלל כמ״ש בקהלת סי׳ ג׳ ידעתי כי כל אשר יעשה האלהים הוא יהיה לעולם עליו אין להוסיף וממנו אין לגרוע וכו׳. וממוצא דבר תבין שאלמלא היו אדה״ר וחוה לוקחים מעה״ד בערב שבת ואוכלים אותו בליל שבת או אח״כ. אז היו הם לבדם מתים ואין זרעם מתים אחריהם וכיוצא בזה אתה דן בענין הנחש אלמלא נקצצו ידיו אחר כניסת שבת לא היו הנחשים הנולדים ממנו לוקין בחטאו.", "ודע כי מי שטבעו ומדתו היא רעה אפילו אם תעשה עמו טובה הוא יגמלך רעה כמ״ש משל הקדמוני מרשעים יצא רשע. כי כן טבע המכונה שלו שאינה מוציאה כי אם דברים רעים. כי הלא תראה מדרך הטבע כי אם תאכיל את העזים גרעיני תמרים של שמרי שכר שהם גרועים ביותר מכל מאכל בהמות. הלא בסוף יטילו אותם גללים. ואם תאכיל אותם תפוחים ושקדים שהם חשובים מכל מאכל. לסוף יטילו אותם גללים באין שום הפרש מגרעיני התמרים. כי כן היא טבע המכונה שלהם שאינה מוציאה רק גללים. ולכן לפי שהנחש מדתו היא רעה משום הכי אעפ״י שנתקלל ונאלם פיו ולשונו ועל גחונו הולך ועפר הוא אוכל עכ״ז לא עזב מדתו הרעה כמ״ש שלמה הע״ה מעות לא יוכל לתקון. ועדין עצתו הנבערה שהיא הזוהמא שהטיל בחוה היא מרקדת בינינו כי שמעתי שגם בזמן הזה יש אנשים גדולים אנשי לבב נפתים ונמשכין אחרי הנחש ומלמדים עליו זכות ואומרים שאלמלא הוא שנתן עצה לחוה לאכול מעה״ד אז היו בני האדם כפראים נבערים מדעת שאינם מבחינים בין טוב לרע וכבהמות נדמו. ולפי דבריהם עושים דעת הנחש גדולה ח״ו מדעת קונו. כי הוא לא יצר את האדם בחכמה. ולא עוד אלא שצוה עליו שלא לאכול מעה״ד כדי שלא יהיה לו חכמה ודעת וישאר בער כל ימי חייו עד שבא הנחש וריחם עליהם בעצתו לאכול מעה״ד. וכל הקללות שקלל ה׳ את הנחש לא בדין היו ח״ו. ולא ידעו ולא יבינו כי טרם אכילת אדה״ר מעה״ד היה לו דעת גדולה ורחבה מני ים כמו שכתבנו למעלה בפסוק ויקח ה״א את האדם וכו׳ ולא היתה דעתו כלולה מטו״ר רק מטוב בלבד כסולת נקיה שאין בה סובין כלל כדעת צבא מרום משרתי עליון ששים ושמחים לעשות רצון קונם ואפשר שהיתה דעתו גדולה גם ממלאכי השרת שהרי מלאכי השרת היו משמשין לפניו וצולין לו בשר כמ״ש בסנהדרין דנ״ט ע״ב. ולא היה אדה״ר צריך לדעת רע כלל. מאחר שגם תולדותיו כמוהו שאינם יודעים לעשות רע. וכולם דומין למלאכים כמ״ש אני אמרתי אלהים אתם ובני עליון כולכם. ואותן בני אדם המלמדים זכות על הנחש אינם מרגישים כי כמו שהסתיר הנחש את המיתה מן חוה והכחידה תחת לשונו כן הוא עושה [?] עתה גם להם. כי מסתיר מנגד עיניהם את יום המיתה שגרם בעצתו ואת כל הרעות שנתהוו בעולם מסבתו. ואם איש הוא יתקן תחלה את גחונו שהולך עליו ואת אלמות פיו ולשונו ואת העפר אשר הוא לוחך. ושמעתי שאותם האנשים הם אומרים כי הם ישראל גמורים ולא יצאו ח״ו מהכלל. ואינם עושים מאומה רע רק שהם משתוקקים ליכנס בחכמת האמת לדעת מסתרי עולם העליון ולכן הם מקבלים לקח מפי ההודים עובדי הנחש כי גם להודים עובדי הנחש יש להם יד ושם בנסתר. ובית הסתרים היא גלויה ופתוחה לפניהם ומה בידינו לעשות הן [?] אין חכמי ישראל מוסרים חכמה זו לכל אדם כי אם לצנועים בלבד. ועל כן לפי אותו הלקח שאנו מקבלים מן [...] הכתובים באותם הספרים אנחנו נחוצים לנהוג כמו ההודים וגם כפי הסודות שאנחנו מקבלים שכר טוב במזומן בעוה״ז מדי חדש בחדשו חק נתן ולא יעבור וכו׳ ע״כ שמעתי. ואוי ואבוי לאזנים שככה הם שומעות. איך לא ידעו ולא יבינו כי מי הוא זה ואי זה הוא שמסר רזי תורה וסתריה להודים מאחר שהם מודים שאין חכמי ישראל מוסרים רזי תורה כ״א לצנועים בלבד. וגם איך הם סומכים על דעתם בדבר סכנה כזה כמו שסמכה חוה על דברי הנחש מבלי חקירה ודרישה ושאלת פי חכמים בענין גדול ונשגב כזה. וזה דומה לאשה טמאה שאין בעלה קרב אליה עד שתטבול. ולפי קלות דעתה היא חושבת כי די לה בטהרתה ממקור דמיה בלבד ואין מן הצורך לטבול כלל. וכשרואה שאין בעלה נזקק לה היא נותנת את אהבתה לזרים ומצטדקת ואומרת כי אנוסה היא מאחר שאין בעלה רוצה להזקק לה רק לאחר הטבילה. אבל איש הזר הזה הוא איש טוב ואינו מקפיד על הטבילה כלל. והוא קרוב יקרב אלי אפילו בלא טבילה. כן ענין אותם האנשים שהם רוצים ללמוד סתרי תורה מפי החכמים בעוד טומאתם בם ולא יכירו ולא ידעו איזה דבר אסור ואיזה דבר מותר ועושים כמה עבירות ביד רמה ורוצים ללמוד חכמת האמת קודם שיטהרו מעונם. וכאשר רואים שאין חכמי ישראל נזקקין להם הם פונים אל אלהים אחרים ללמוד מהם חכמת הקבלה מפני שאין ההודים מקפידים על האיסורים שבתורה רק הם נזהרים לפי דבריהם בדברים שבין אדם לחבירו. אך כל אדם יקשה על אשת כסילות הנז׳ דלמה יקשה בעיניה לטבול יותר מהזנות. וכמו כן תקשה לאותם האנשים למה יקשה בעיניהם לשוב בתשובה ולתקן מעשיהם הרעים כדי שיהיו ראוים ללמוד חכמת האמת מפי החכמים מגידי אמת יותר מלימוד חכמת הנסתר מספרי ההודים.", "לכן נראה שאין שמיעה זו אמת אלא דיבה רעה הוא שהוציאו עליהם. וכשאני לעצמי ברי לי בלא ספק שאין אלו האנשים מאמינים בכל לבם ובכל נפשם באמונה החדשה הזאת של הנחש כמו שנראה לעינים. וחס [?] להו לזרעא דאברהם לומר כן עליהם כי שורש הדם של אברהם אע״ה שהאמין בה׳ עודינו נטוע בעורקים ובגידין של בניו אחריו כל ימי עולם. ואינם עושים כן אלא לפנים. ורובם ככולם הם עושים למען בציע בצע לקבל שכר טוב בעמלם ולהתפרנס בכבוד ולא בבזוי ולא מפני שהם מאמינים באמונה החדשה הזאת. וכדי לחפות על מעשיהם אשר לא טובים הם מתנצלים ואומרים כי אמונה החדשה ההיא היא רמוזה בתורה וכתורה הם עושים ואינם יוצאים מכללות ישראל בזאת. ומביאים כמה ראיות וגמטריאות ורמזים מן התורה שאין להם לא שורש ולא ענף ומהפכים דברי אלהים חיים למינות כדי לחפות על קלונם. לכן אליכם אישים אקרא וקולי אל בני אדם. אל נא אחי תרעו כי לא טובה השמועה אשר אני שומע עליכם. שובו שובו נא אחי ורעי שובו [?] איש מדרכו הרעה ולא תעשו עוד מסחור להשתכר ולהרויח במכירת עבודת ה׳ ותורתו ובחליפתם באמונה אחרת כי גם ה׳ נשבע לישראל שלא יחליף אותנו באומה אחרת. שובו שובו נא בית ישראל והיטיבו דרכיכם ומעלליכם. ויפה שעה א׳ בתשובה ומע״ט בעוה״ז מכל חיי העוה״ב. צא ולמד ממה שכתבנו [?] בעזה״י לקמן ביחזקאל סי׳ ל״ז בענין הרוחות ושם יראה האדם כמה וכמה מיני צער ויסורים וכמה מיני גלגולים הנעשה לאדם אחר זמן פטירתו מעוה״ז על עוברו על מצות ה׳ אלהיו אשר תסמר שערות האדם. אשר על כן כל אדם שיש לו מוח בקדקדו ילך בו [?] אצל החכם להורות לו דרכי התשובה (וכבר סדרתים לקמן ביחזקאל סי׳ ל״ז דף [...] בדיבור המתחיל וממה שכתבתי וכו׳ יעו״ש) בטרם יחשכו כוכבי נשפו וישוב אל ה׳ וירחמהו ואל אלהינו כי ירבה לסלוח:"]}, {"id": "s20", "n": 20, "title": "בו יבואר אם יש שער לשדים או לא", "paras": ["אל האשה אמר הרבה ארבה עצבונך והרונך וגו׳. הנה בעירובין ד״ק ע״ב אמרינן עשר קללות נתקללה חוה וחדא מינייהו ומגדלת שער כלילית ופירש רש״י ז״ל לילית שד יעו״ש. וקשה דהא אמרינן במדרש רות ע״פ ויהי בחצי הלילה ויחרד האיש וילפת והנה אשה שוכבת מרגלותיו. התחיל ממשמש בשערה אמר רוחות אין להם שער אמר לה מי את וכו׳. וזהו היפך ממ״ש בעירובין הנז׳. ועי׳ בספר חסדים שכתב ששדין הזכרים יש להם שער ולנקבות אין להם שער יעו״ש. ונ״ל שבקושיא זו נתקשה רש״י ז״ל בעירובין הנז׳ ולכן פירש לילית שד כלו׳ זכר ולא נקבה. וסי׳ הן עשו אחי אי״ש שעי״ר.", "וכבר בא מעשה לידי שבאה אלי אשה א׳ מעיר כרכוך בחדש אדר דשנת התרפ״ו כדי להושיעה ולהצילה מן השד המזדווג עמה. ואמרה לי כי בעת שיבא השד אליה תבוא גם אמו עמו. כי אין אמו עוזבת אותו כלל. ושניהם הם נגלים לנגד עיניה כשאר האדם אפילו ביום ואפילו [...] כן אדוני כי לזכרים יש שער ולנקבות אין שער כלל. וזהו כמ״ש בספר חסדים הנ״ל. ומכאן תוכחת מגולה לנשים שנהגו לגלח שערות ראשם לגמרי ועושים את עצמם כלילית:"]}, {"id": "s21", "n": 21, "title": "בו יבואר טעם תוספת הקללות שקלל ית׳ את אדם וחוה", "paras": ["ולאדם אמר כי שמעת לקול אשתך. הנה כשהוכיח ית׳ לחוה לא אמר לה כמו שאמר לאד״הר כי שמעת לקול הנחש ותאכלי [?] מן העץ וכו׳ אלא אמר לה מה זאת עשית וכו׳ יען כי הנחש לא אמר לה בפירוש לאכול רק הדיח אותה בחלק שפתיו וכמו שאמרה חוה עצמה הנחש השיאני ואוכל. אבל אד״הר הלך בעצת אשתו ולכן אמר לו כי שמעת לקול אשתך וכו׳. אמנם יש לתמוה כי הלא לא גזר ה׳ על אד״הר בעוברו על מאמרו כ״א מיתה בלבד. ואיך עתה הוסיף עליו עוד כמה מיני קללות, ארורה האדמה, בעצבון תאכלנה, וקוץ ודרדר תצמיח, ואכלת את עשב השדה, בזעת אפך תאכל לחם. וכל אלו הקללות הם תוספת מרובה על עיקר עונש המיתה הבאה אחריהם. גם את חוה הוסיף לה תוספת מרובה עיקר [?] שהרבה את עצבונה והריונה וצער הלידה וכו׳. ומהיכן צמחו כל אלו הקללות ומה הוא עיקר סיבתן.", "ונלע״ד והוא כ״א היה אד״הר מעצמו הוא בא ואוכל מעה״ד מבלי נתינת אשתו אז לא היה מתחייב כ״א מיתה בלבד כמו שגזר עליו ית׳. אמנם כאשר מצד א אתברי עלמא. למגנא כתיב בה ואיש איש מבני ישראל וגו׳ ואל בני ישראל תדבר לאמר וגו׳ כי לי בני ישראל עבדים וגו׳ אן אינון בני ישראל וגו׳ יעו״ש. מבואר מזה שכל הנוסח הכתוב בתורה שבידינו היה [...].", "ואפשר עוד לתרץ קושיא הנז׳ באופן היותר נאות. והוא כי אעפ״י שאם לא היה אד״הר חוטא ולא היה נטרד מהגן בלי ספק היה מוליד בנים ובנות בגן שהרי קודם שאכל מעה״ד כבר ברא לו ה׳ את חוה ויברך אותם פרו ורבו וגו׳ וא״כ לא יבצר שלא יהיה א׳ מזרעו אשר בגן יתאוה לאכול מעה״ד כמו שאירע לאד״הר ויהיה גורם מיתה לעצמו. כי אי אפשר לאלפים ולרבבות בני אדם המתהלכין בגן וחיים חיי עולם שלא ישלח א׳ מהם את ידו ואכל מעה״ד כי צווי האכילה לא נאמרה לאד״הר בלבד אלא גם לזרעו אחריו כמו שבע מצות. ועל זה אמרה התורה אדם כי ימות באהל. וראיתי סמך גדול לתירוץ זה ממ״ש האר״י ז״ל בש׳ הגלגולים הקדמה ל״ג בענין שריפת נדב ואביהוא שכתב שם וז״ל ואמנם אלו לא חטאו ישראל במעשה העגל היתה זוהמת הנחש נפסקת לגמרי כנודע ואעפ״י שנדב ואביהוא היו חוטאים במעשה הקטורת היה מספיק להם שימותו בלבד. אבל כיון שחטאו ישראל בעגל גרמו להחזיר דיבוק זוהמת הנחש בנפש האדם ואז נשרפו נדב ואביהוא ולא הספיק להם למות מבלי שריפה וכו׳ יעו״ש. מבואר מזה שאלו לא היו ישראל חוטאים והיתה זוהמת הנחש נפסקת לגמרי והמיתה בטלה מן העולם עכ״ז היו נדב ואביהוא מתים מפני חטא הקטרת אלא שלא היו מתים במיתה חמורה שהיא שריפה. א״כ הוא הדין אם לא היה אד״הר חוטא בעה״ד מ״מ האוכל ממנו מות יומת ועל אופן זה אמרה תורה אדם כי ימות [...].", "ואפשר [?] עוד לתרץ והוא כי אעפ״י שלא יהיה מיתה בעולם. זהו דווקא מיתה טבעית אבל מיתה שאינה טבעית כגון שיפול מן האילן או מן הגג וכן שנטבע בנהר או מוכה חרב וכיוצא בזה הם שייכים אפי׳ בגן דאיך יתכן שיחתכו את ראשו ולא ימות. ותדע שכן הוא שהרי מצינו שהרגו הערב רב את חור מפני שלא רצה לעשות להם עגל אעפ״י שעדין לא חזרה זוהמת הנחש כ״א לאחר שעשו את העגל ועל אופן זה אמרה תורה אדם כי ימות באהל:"]}, {"id": "s23", "n": 23, "title": "בו יבואר טעם עשרה דברים שנבראו בין השמשות", "paras": ["ויגרש את האדם. ארז״ל בסנהדרין דל״ח כי בשעה י״ב נטרד האדם מהגן. ונלע״ד שבזה יבואר טעם מ״ש בפרק ה׳ דאבות עשרה דברים נבראו בע״ש בין השמשות. דלכאורה יפלא דלמה עיכב ה׳ את בריאתם עד זמן בין השמשות פי שהוא היה עובד אדמה רצה לכפר כעסו של מקום שקלל את האדמה בעבור האדם כמש״ה ארורה האדמה בעבורך וגו׳ וקוץ ודרדר תצמיח לך וכו׳. ונראה שהפירות שהביא מנחה הם היו ממיני פרי העץ כי סתם [?] פרי הנז׳ בתנ״ך הוא פרי העץ כי הירקות והזרעונים אינם נקראים בשם פירות רק בדברי רז״ל אשר שמו חילוק בברכתם. ולא הביא קין מנחה מכל מיני פירות האילנות אלא ממין א׳ בלבד וגם לא הביא מביכורי הפירות כי היה חס עליהם לשורפם באש. ולזה דקדק הכתוב ואמר מפרי האדמה ולא מביכורי פירות האדמה:"]}, {"id": "s27", "n": 27, "title": "בו יבואר קרבן הבל", "paras": ["והבל הביא גם הוא מבכורות צאנו ומחלבהן. כדי שישלח ה׳ ברכה והצלחה בצאן מרעיתו. ואומרו מבכורות צאנו בלשון רבים לומר שהביא מב׳ המינים מן הכבשים ומן העזים. וגם הם מהבכורות של הצאן ולא מן הפשוטים וגם היו מחלביהם ר״ל מן השמנים שבהם כיאות למלך הכביר לפיכך שעה ה׳ אל מנחתו שירדה אש מן השמים ואכלה את מנחתו:"]}, {"id": "s28", "n": 28, "title": "בו יבואר ענין חרון האף של קין", "paras": ["[...] להוכיחו על חרון אף שכובש פניו בקרקע"]}, {"id": "s29", "n": 29, "title": "בו יבואר כוונת הפסוק הלא אם תטיב שאת", "paras": ["הלא אם תטיב שאת וכו׳. פי׳ למה חרה לך על שלא נשאתי לך פנים לקבל את מנחתך. הלא אתה הוא הגורם למאוס בקרבנך על כי לא היה קרבנך מהודר כיאות למלך [...]. והלא אם תטיב שוב את מעשיך. שאת. פי׳ אשא לך פנים כמו שנשאתי פנים להבל אחיך. ואם לא תטיב אלא תקלקל עוד את מעשיך בחרון אפך (ורמז לו על שעתיד להרוג את הבל אחיו) לא נשיאות הפנים בלבד אתה מפסיד אלא שגם לפתח חטאת רובץ. פי׳ לפתח עבודת האדמה שאתה מפתח ומשדד אדמתך. שם חטאת עון הריגת הבל הוא רובץ לקלקל את עבודת האדמה היפך ממה שהיית מקוה שע״י הקרבן תוציא את האדמה מהקללה אשר קללתי אותה בעבור האדם. ואליך תשוקתו של החטאת והעון להכשילך [?] גם אותך בפירות ובתבואת האדמה. ורמז לו על מ״ש לו אחרי הריגת הבל כי תעבוד את האדמה לא תוסף תת כחה לך. ואתה תמשל בו. רמז על הבחירה שאם יבחר לו לילך בדרך הטוב והיושר אחר שחטא [?] הוא יהיה מושל על יצרו:"]}, {"id": "s30", "n": 30, "title": "בו יבואר היאך הרג קין להבל", "paras": ["ויאמר קין אל הבל אחיו ויהי בהיותם בשדה וכו׳. בלשון קצר דיבר הכתוב ושיעורו ויאמר קין אל הבל אחיו לך ונצא השדה ויהי בהיותם בשדה וכוונתו היתה להפרישו ממקום אביו ואמו כדי שלא יצילוהו מן המיתה. ויהי בהיותם בשדה ויקם קין אל הבל אחיו ויהרגהו. נראה שבתחלה היו שניהם יושבים ואח״כ קם קין ממקומו למקום הבל אחיו היושב לבטח אתו ויהרגהו. כי לא היה הבל נשמר ממנו. ואעפ״י שלא היה עדין חרב בעולם אפשר שהרגו באבן חלמיש או בבקעת [?] של עץ על ראשו והמיתו כי גם שאר מיני מיתות נקראים בדרך כלל בשם הרג כענין והיה כל מוצאי יהרגני ולא היה בעולם כ״א חיות רעות שטורפים אותו וכן הוא אומר ויהרוג ה׳ כל בכור בארץ מצרים:"]}, {"id": "s31", "n": 31, "title": "בו יבואר ענין שת שנאמר בו ויולד בדמותו כצלמו", "paras": ["ויחי אדם ק״ל שנה ויולד בדמותו כצלמו ויקרא את שמו שת. נראה כי קין והבל היה תואר פניהם כדמות פני חוה ועל כן היא קראה להם שמות ולא אדם. אבל שת שהיה דומה בתואר פניו לצלם ודמות אד״הר על כן גם אד״הר קרא לו שם וזהו ויקרא את שמו שת. ועוד נ״ל לפי שבפסוק הקודם אמר ביום ברוא אלהים אדם בדמות אלהים עשה אותו. והיה אפשר לומר כי רק אד״הר שהיה יציר כפים הוא לבדו היה בצלם הכבוד אבל תולדותיו לא היו באותו הצלם לכך הוצרך לפרש בשת אשר ממנו הושתת העולם שהיה בצלם ודמות אביו יציר כפיו [?].", "ועוד נראה לפרש והוא היותר נכון לענ״ד והוא כי אברי חוה היו דקים וקטנים מאברי אד״הר. וכן אורך גופה היה קטן מאורך גוף אד״הר ולא היה אורכה כי אם עד כתף של אד״הר או עד החזה שלו לסברת חכמי האמת וכמו שנראה מטבע הבריאה [?] שעל הרוב אברי הנקבה הם דקים וקטנים מאברי הזכר. והטעם כי עיקר בריאת חוה אינה כי אם מאחד מצלעי אד״הר ואין הצלע מספיק להיעשות ממנו אשה גדולה כשיעור כל גוף אד״הר ממש. כי לא נזכר בפסוק שטפל ה׳ עם הצלע ההוא עפר מן האדמה ומכללות [?] שניהם נבראת חוה. ויען [?] שהיה אד״הר גבוה בקומתו ובחוזק אבריו וחוה גרועה ממנו. לכן לפעמים היתה יולדה בנים או בנות הדומים אליה ולפעמים יולדה ילדים ממוצעים הכלולים משניהם. ולפעמים יולדת ילדים גבוהים וחזקים הדומים לאד״הר. והנה קין והבל היו אבריהם דקים דומים אליה ולכן תלה הכתוב תולדות קין והבל בחוה כמ״ש ותהר ותלד את קין וכו׳ ותוסף ללדת את אחיו את הבל וכו׳. אבל שת היה דומה בגודלו ואבריו לאדה״ר ולכן תלה הכתוב תולדת שת באד״הר וזה אומרו בדמותו כצלמו וזהו הנכון בפשט הכתוב.", "וכן מה שהוליד אד״הר אח״כ בנים ובנות גם הם היו ג׳ מינים או ארוכים וגדולים כמוהו או דקים וקטנים כמו חוה ממוצעים ולא חש הכתוב להאריך בהם לפי שבא המבול ושטף את כלם ולא נשאר מהם כ״א נח ובניו שהם היו מזרע שת. וכמו כן אם היה האיש מן הקצרים ולקח אשה מן הארוכים היו מולידים ג״כ ג׳ מינים. כי לפעמים מולידים ילדים ארוכים ולפעמים ילדים ממוצעים ולפעמים דקים וקצרים. אבל אם היו האיש והאשה דקים אינם מולידים כ״א דקים בלבד ואם היו האיש והאשה שניהם ארוכים אינם מולידים כ״א בנים ארוכים וכמ״ש בש״ס בכורות דמ״ה ע״ב אמר ריש לקיש גבוה לא ישא גבוהית שמא יצא מהם תורן (פי׳ שמא יולידו ארוכים כתורן הספינה) ננס לא ישא ננסת שמא יצא מהם אצבעי (פי׳ קצר כאורך האצבע) ולקמן בעזה״י נכתוב עוד בזה:"]}, {"id": "s32", "n": 32, "title": "בו יבואר שלאחר שנקנסה מיתה על אדה״ר ונתקיימה גזרתו ית׳ א״כ מן הראוי הוא לחזור ולהשיבו אל הגן כבתחלה", "paras": ["ויהיו כל ימי אדם אשר חי תתק״ל שנה וימות. ואחר שמת ונתקיימה בו גזירתו ית׳ א״כ לא נשאר לו לה׳ על אד״הר שום עונש כלום וראוי להחזירו לגן כבתחלה. ולכן החזיר ה׳ את נשמת אד״הר לג״ע למקומו הראשון ושם הלביש את נשמתו בגוף אחר זך וקדוש הנעשה מקרקע ג״ע והוא ממש כדמות הגוף של עוה״ז שהיה מן העפר. וגוף הגשמי שלו שהיה בתחלה מן עפר עוה״ז הניחו בקבר בעוה״ז והשיבו אל העפר אשר לוקח משם. וענין זה הוא נוהג גם בזרעו אחריו כי גם הם אלו לא חטא אד״הר היו ראוים להוולד בג״ע ולכן גם הם אחרי פטירתם הולכים לג״ע ושם מתלבשים בגוף אחר דוגמת גופם של עוה״ז.", "ואם ימצא איזה נשמה מהם שעברה על מצות ה׳ אשר צוה אותנו ביד מרע״ה כגון לנאוף ולגנוב ולהדליק החשמל בשבת וליתן בריבית וכיוצא בשאר המצות כולם אז אין נשמתו נכנסת לג״ע יען כי אפילו אם היה בג״ע ועשה עבירות האלו היה הקב״ה מוציאו מג״ע כמו שהוציא את אד״הר משם וא״כ איך אפשר שעתה יחזור ליכנס לג״ע. ולכן נשארת נשמתו ערומה בלא שום גוף כלל והם הנקראים בסבא דמשפטים בשם נשמות ערטלאין והם הולכים מדחי אל דחי ביד מלאכי חבלה והם המתגלגלים בצמחים ובחיות רעות ובשרצים ובבהמות טמאות ובבהמות טהורות כפי עונש חטאם אשר חטאו בעוה״ז ואחר השלום ימי חטאם [?] הם נכנסים לגיהנם ונדונים שם י״ב חודש ואח״כ חוזרין ובאים לעוה״ז כדי להשלים המצות הנצרכים להם ואח״כ אם זכו הם נכנסין לג״ע. וכל זה אם לא עשו תשובה בהיותם בחיים אבל אם עשו תשובה אז נמחל להם בדברים שבין אדם למקום כי אין דבר שעומד בפני התשובה. אבל בדברים שבין אדם לחבירו אינו נמחל לו עד שירצה את חבירו. ואם יעזור ה׳ נאריך עוד בזה לקמן בסוף אות פ״א בד״ה עוד בשנת התרע״ע [?] וגו׳ יעו״ש:"]}, {"id": "s33", "n": 33, "title": "בו יבואר מה ענין ריבוי הבנות שזכר הכתוב", "paras": ["ויהי כי החל האדם לרוב ע״פ האדמה ובנות ילדו להם. פי׳ ומריבוי הבנים והבנות א״כ היה אפשר להם להשיג כל א׳ מבוקשו אם רוצים ליקח ארוכה לארוך או קצרה לארוך או ארוכה לקצר וכיוצא בזה היו יכולים ליקח כרצונם משא״כ אם היו הבנים והבנות מועטים היו מוכרחים לישא אותם. והודיענו הכתוב ענין זה כדי לסמוך לזה פסוק ויראו בני האלהים וגו׳ וכמו שנפרש בעז״ה:"]}, {"id": "s34", "n": 34, "title": "בו יבואר מי הם הנקראים בני האלהים", "paras": ["ויראו בני האלהים את בנות האדם. לבני האדם הארוכים והחזקים כמו אד״הר ושת בנו כמש״ל באות ל״א קורא אותם בני האלהים כי כאשר ירצה הכתוב להגדיל איזה דבר סומכו למלת אלהים כמו ותרגז הארץ ותהי לחרדת אלהים. וכן ונינוה היתה עיר גדולה לאלהים. וכן מושב אלהים ישבתי בלב ימים. וכן שלהבת יה. מאפליה. וענפיה ארזי אל. ואומרו כי טובות הנה. ר״ל אם טובות הנה. כמו כי יקרא קן צפור. כמו כי תבנה בית חדש. ור״ל אם טובות והגונות להם כגון שגם אותם הבנות הם ארוכים וחזקים כמו בני האלהים. אז ויקחו להם נשים. ר״ל לקחו אותן לנשים כדי שיולידו בנים חזקים כדוגמתם. מכל אשר בחרו. כי יש מהם בוחרים ליקח מזרע קין אם אותם הנשים הם חזקים וגדולים כמותם לפי שקין היה בכור אעפ״י שלא היה גבוה וחזק. ויש בוחרים ליקח מזרע שת לפי שהיה דומה בחזקו וגובהו לאד״הר ויש שבוחרים ליקח משאר בנות אד״הר עצמו אשר הוליד אח״כ אם אינם קצרים כחוה:"]}, {"id": "s35", "n": 35, "title": "בו יבואר מי הם הנפילים ומי הם הגבורים אנשי השם", "paras": ["הנפילים היו בארץ בימים ההם. פסוק זה מדבר בשני זמנים על קודם שהחל האדם לרוב על פני האדמה ועל אחר שרבו ולקחו להם נשים מכל אשר בחרו ועל ב׳ זמנים הנז׳ הוא אומר הנפילים היו בארץ. כן נראה ממה שסיים הפסוק וגם אחרי כן אשר יבואו וכו׳. ומרע״ה הכותב בזמנו את התורה הוא אומר הנפלים שראו המרגלים בארץ כנען כמ״ש ושם ראינו את הנפילים וכו׳ הם היו בארץ ההיא בימים הקדמונים ההם. ר״ל שהיו קודם שהחל האדם לרוב ע״פ האדמה. וגם היו אח״כ אשר יבואו בני האלהים אל בנות האדם וילדו להם עוד נפילים אחרים חדשים מלבד הנפילים הראשונים.", "וביאור הענין הוא כי הנה מקודם שהחל האדם לרוב ע״פ האדמה היו מוכרחים להשיא אשה חזקה [...] וגבורים וגם בנים חלשים כמ״ש באות ל״א יעו״ש. לא הוצרך מרע״ה להודיענו כי אם על הנפילים הנזכרים במרגלים שהם היו בימים הקדמונים ההם. ואומרו המה הגבורים. תיבת המה הגבורים הוא קאי בין על הנפילים הראשונים אשר היו בארץ קודם שהחל האדם לרוב ע״פ האדמה ובין על הנפילים הנולדים אחרי כן אחרי אשר יבואו בני האלהים. ומרע״ה הוא דקאמר המה הגבורים הנמצאים בזמנינו אשר מעולם ר״ל אשר היו מתחלה בדורות הראשונים. אנשי השם הנודעים בשמות כגון אחימן ששי ותלמי ילידי הענק. והאימים והענקים והנפילים והעוים והרפאים והזמזומים. ואין לתמוה איך היו נמצאים בדור מרע״ה והלא בא המבול ושטף את הכל כי יתכן שאשת נח היתה מבני האלהים כי לפי דעת רז״ל היא היתה נעמה אחות תובל קין הנודעת בדור ההוא ברוב יפיה ובגודלה ובחוזק אבריה ולפי שהיתה מן בני האלהים הולידה לאחד מבני נח כמו הנפילים. או נשי בני נח היו מבני האלהים והולידו מקצתם גבורים הנז׳ או עוג שפלט מן המבול הוא ילדם:"]}, {"id": "s36", "n": 36, "title": "בו יבואר כוונת פסוק לא ידון רוחי באדם לעולם", "paras": ["ויאמר ה׳ לא ידון רוחי באדם לעולם. לפי שבדור אנוש אז הוחלו בני האדם לקרוא את הע״ז בשם ה׳ והיו מכעיסין ובאים. ובכל אותם הימים היה ה׳ דן בעצמו ר״ל נושא ונותן בלבבו בענין האדם אם להאריך אפו עמהם אולי ישובו או אם לאבדם. ופעם היה מסכים לאבדם ופעם היה חוזר ומתמלא רחמים על מעשה ידיו ונמנע מלאבדם. ועל ענין זה אמר לא ידון רוחי באדם לעולם והוא מלשון ויהי כל העם נדון (שמואל ב׳ י״ט) שר״ל היו דנים ומתווכחים זה עם זה זה אומר ככה וזה אומר בהיפך. ואמר ה׳ עד מתי יהיה רוחי נדון בקרבי על האדם אם להאריך להם עד שישובו או אם לאבדם. מכאן ואילך לא ידון עוד רוחי בקרבי תמיד לעולם אלא זמן אתן להם ק״כ שנה אולי ישובו לפי שגם האדם הוא בשר כשאר בהמות וחיות ולכן מן הראוי להאריך כעסי עוד עמהם כענין ויזכור כי בשר המה וכו׳. ולכן אתן להם זמן ק״כ שנה ואם לא ישובו אביא עליהם את מי המבול. ותכף ומיד צוה לנח לעשות לו תיבה כדי שישאלוהו אנשי דורו מה ענין התיבה הזאת והוא יגיד להם גזירת המקום ב״ה ואולי ישובו מחטאם (עי׳ רמב״ן):"]}, {"id": "s37", "n": 37, "title": "בו יבואר פסוק וינחם ה׳ וכו׳ שהוא היפך פסוק כי לא אדם הוא להנחם", "paras": ["וינחם ה׳ כי עשה את האדם בארץ. וקשה והא בשמואל א׳ כתוב היפך מזה כי לא אדם הוא להנחם. אבל הביאור הוא כי האדם הוא יתנחם מכמה סיבות. כגון אם אמר ראובן לשמעון שיתן לו בר״ח ניסן מתנה אלף כסף. אפשר שיחזור בו אח״כ מאותה מתנה מכמה סיבות. אחד כי אפשר שקלקל שמעון את מעשיו ועי״כ נבאש ריחו בעיני ראובן. או שראובן עצמו חזר בו הגלגל והעני ולא השיגה ידו לקיים דברו. או אפשר ששמעון עלה על במותי ההצלחה ואז ראובן משך את ידו מהמתנה ההיא. והנה בכל אלו הסיבות יכול ראובן להצטדק ולהתנצל על אשר איננו מקיים את הבטחתו כדי שלא יהיה נקרא מחוסר אמנה. אמנם לפעמים באין שום סיבה מאלו הסיבות ועכ״ז חוזר בו ראובן מן המתנה. ואם תשאל את טעם חזרתו תען לשונו ובן אדם ויתנחם.", "אבל מדת הקב״ה אינה כן כי אין נחמה לפניו מצד עצמו רק מצד המקבל בלבד. דהיינו אם גזר על האדם טובה והאדם הרע אח״כ את מעשיו הרי זה מקפח את הטובה שנגזרה עליו כמ״ש רז״ל ע״פ ויירא יעקב מאד ויצר לו שהיה מתירא שמא יגרום החטא. כי הקב״ה מתנחם אפי׳ על הטובה כמ״ש (ירמיה סי׳ י״ח) ונחמתי על הטובה וכו׳. ואין נחמה זו מצדו ית׳ רק מצד המקבל והוא כענין הרופא שנתן סמים לחולה שאם ראה אח״כ כי חליו הכביד עליו הוא משנה את הסמים. ובלא ספק שאין הרופא ניחם על סמים הראשונים מצד עצמו אלא מצד החולה. וכ״ש שינחם הקב״ה על הרעה. אבל בג׳ סיבות הנשארים הנז״ל שהיא מצד הנותן אין נחמה לפניו ית׳. ומה שאמר שאול המלך ע״ה חטאתי ועכ״ז לא חזרה אליו המלוכה הטעם הוא כי כבר זכה בה דוד המע״ה ודוד לא חטא לה׳ כדי שיהיה ראוי ליטול את המלוכה ולהשיבה לשאול ולכן אמר לו שמואל כי לא אדם הוא להנחם:"]}]}, {"title": "פרשת נח", "chapters": [{"id": "s38", "n": 38, "title": "בו יבואר למה הפיץ ה׳ לבוני המגדל על פני כל הארץ", "paras": ["ויאמרו איש אל רעהו הבה נלבנה לבנים וכו׳. לא היה דעתם של דור הפלגה כ״א להיות מחוברים ביחד במקום א׳ כי הגיד הכתוב דעתם [...] ולא סיפר עליהם מאומה רע (רמב״ן מהמפרשים). ויאמרו הבה נבנה עיר ומגדל וראשו בשמים וכו׳ כלו׳ מגדל גבוה במאד מאד שיהיה נראה למקום רחוק כדי שאם ילך מי מהם למקום רחוק כמו האכרים והרועים וכיוצא לא יתעו מן הדרך כי עיניהם מרחוק יביטו את המגדל הפורח באויר וידעו את הדרך לשוב אל העיר ולא יהיו נפוצים. ולא היתה דעתו ית׳ נוחה בזה פן תשאר הארץ שממה ומשמה ותרב חית השדה והוא לא תהו בראה אלא לשבת יצרה. אולי יעמוד מלך קשה ורע מעללים כמו [...] וישמיד את רוב אנשיו [?]. או אם יהיה דבר ורעב או ארבה ועי״כ ימותו רובם כי אין מקום אחר [...] שמה ולכן הפיצם ע״פ כל [...] כדי שיהיה מקום [...] הארץ ויבנו ערים ויטעו כרמים. ומאן דבאיש ליה בהאי מתא להוי אזיל למתא אחריתי:"]}]}, {"title": "פרשת לך לך", "chapters": [{"id": "s39", "n": 39, "title": "בו יבואר למה כשצחק אברהם לא הקפיד ה׳ וכשצחקה שרה הקפיד", "paras": ["ויפל אברהם על פניו ויצחק וכו׳. מהמשך הכתוב שלאחריו שאמר לו ישמעאל יחיה לפניך. נראה שהיה אברהם כמסתפק בדברי הקב״ה ואמר בלבו הלבן ק׳ יולד וכו׳ ולזה צחק כי היה חושב בלבו כי לנס גדול כזה צריך [...] ואני איני ראוי לכך ולכן לא הודה ושבח לה׳ על בשורה זו רק התפלל [...] כלו׳ ולא תסתפק בזה כי אתה ראוי לנס כזה. ואח״כ השיב לו גם על ישמעאל ואמר לו ולישמעאל שמעתיך וכו׳. ולכן לא הקפיד ה׳ על מה שצחק אברהם והקפיד על מה שצחקה שרה לפי שסברה שמן הנמנע הוא להיות ענין זה כלל:"]}]}, {"title": "פרשת וירא", "chapters": [{"id": "s40", "n": 40, "title": "בו יבואר ענין מה שהגיש אברהם חמאה ובשר לשלושה האנשים", "paras": ["ויקח חמאה וחלב ובן הבקר אשר עשה וכו׳. מה שהוצרכו רז״ל לומר קמא קמא אייתי לגבייהו ואכול שלא האכילם בשר בחלב זה הוא לסברת רבא דאמר [...] כמבואר בחולין [...]"]}, {"id": "s41", "n": 41, "title": "בו יבואר ענין ב׳ בנות לוט איך נתעברו מביאה א׳", "paras": ["ואיש אין בארץ לבוא עלינו וגו׳. הנה ארז״ל אין אשה מתעברת מביאה ראשונה ולכן [?] אמרו שבנות לוט שלטו בעצמם והוציאו ערותם לחוץ פי׳ שמיעכו באצבע בבית הרחם והוציאו את דם הבתולים לחוץ [...] ונתעברו מביאה א׳. וראיתי בגליון כת״י של ח״ר שמעון אהרן אגסי ז״ל (המחבר ספר בני אהרן על שער הגלגולים) שהקשה מי גילה סוד זה לרז״ל כי אולי לוט בעל ושנה ועי״כ נתעברו ומסיק בצ״ע. ונ״ל ליישב והוא כי בלא ספק שבנות לוט שסיכנו את עצמם לעשות תועבה גדולה כזו לא ירצו להתעכב אצל אביהם עד שיבעול וישנה פן יפיג יינו מעליו וירגיש בהם ויהיו נתפשים כגנב והם רוצים להשמט ולברוח מאצלו תכף ומיד אחר הבעילה ולכן הוצרכו לעשות תחבולה לשלוט בעצמם. ואחר כמה שנים אמרתי לפני ח״ר שמעון ז״ל את הקושיא שלו שהיה עודנו בחיים האם יוכל עכשיו לתרץ אותה ותכף ומיד תירץ אותה כתירוץ הנז׳:"]}, {"id": "s42", "n": 42, "title": "בו יבואר אם תיבת אחרי הוא מופלג או אם תיבת אחר הוא מופלג", "paras": ["ויהי אחר הדברים האלה והאלהים נסה את אברהם. ארז״ל (בסנהדרין דפ״ט) מאי אחר אחר דבריו של שטן שהיה מקטרג ואומר מכל הסעודה שעשה אברהם לא הקריב לפניך פר א׳ או איל א׳. א״ל הקב״ה כלום עשה זה אלא בשביל בנו אלו הייתי אומר לו זבח אותו לפני לא היה מעכב וכו׳. וכן הוא בזוהר בראשית דיו״ד ע״ב עיי״ש. וקשה והא הסעודה היתה ביום המילה כמ״ש רז״ל ביום הגמל ביום ה״ג מ״ל או לפחות כפשטיה דקרא שהסעודה היתה ביום שנגמל משדי אמו ואז היה בן ב׳ שנים. והנה בזמן העקידה היה בן ל״ז שנים כנז׳ בזוהר בראשית דקי״ט ע״ב וגם מן הפסוק מבואר שהיה יצחק גדול בשנים שאם היה קטן איך היה בו כח לשאת את עצי העולה עד הר המוריה ואיך יש לו דעת לשאול את אביו ואיה השה לעולה. וא״כ למה נתעכב השטן לקטרג על הסעודה עד אחר ל״ה שנים. וי״ל כי בודאי השטן קטרג ביום הסעודה רק שהקב״ה דחה את העקידה עד זמן מרובה כדי לנסות גם את יצחק אם גם הוא לא יבעט באביו. וכמבואר בזו׳ וירא דקי״ט ע״ב יעו״ש.", "ולפי תירוץ זה צ״ל כי מ״ש בעקידה ויהי אחר הדברים האלה וכו׳ ולא אמר אחרי הדברים האלה צ״ל שכל אחר הוא מופלג ואחרי הוא סמוך וכן נראה מפי׳ רש״י ז״ל בסוף הפרשה על פסוק ויהי אחרי הדברים האלה ויוגד לאברהם לאמר וכו׳ וז״ל בשובו מהר המוריה היה אברהם מהרהר ואומר אלו היה בני שחוט כבר הייתי הולך בלא בנים היה לי להשיאו אשה מבנות ענר אשכול וממרא בשרו הקב״ה שנולדה רבקה בת זוגו וכו׳. ויל״ע למה שפי׳ רש״י בפ׳ ראה ע״פ אחרי דרך מבוא השמש וכו׳ וז״ל כל מקום שנאמר אחרי מופלג הוא יעו״ש. ואפשר שהם מדרשים חלוקים:"]}, {"id": "s43", "n": 43, "title": "בו יבואר איה הברכה שהבטיח הקב״ה להרבות זרעו של אברהם", "paras": ["כי ברך אברכך והרבה ארבה את זרעך ככוכבי השמים. שאול שאל האיש איה היא הברכה והשבועה שנשבע הקב״ה להרבות זרעו של אברהם והלא אומה״ע מספרם יותר כמה פעמים מישראל. אמרתי לו וכי אין אתה מודה שלא היה אברהם לבדו בעולם אלא היה בדורו כמה אלפים ורבבות בני אדם. א״ל הן. אמרתי לו אם עכשיו זרע אברהם לבדו הנודעים לנו הם י״ז מליון מלבד מה שהמירו דתם ונטבעו בדת הנוצרים ובדת הישמעאלים שנתוספו על מניין האומות ומלבד אשר הורגים בהם המלכים בכל דור ודור ע״פ עלילות הדם. א״כ מהראוי היה שגם כל א׳ וא׳ מבני דורו של אברהם יהיה כל א׳ וא׳ מהם י״ז מליון כזרעו של אברהם. ואיה הם המליונים של אותם הרבבות שהיו בדורו של אברהם שאם היו כל א׳ וא׳ מהם פרה ורבה כמו זרע אברהם בלא ספק לא תכיל אותם אלף [?] עולמות. ואם אתה רואה שאומה״ע הם יותר מישראל זהו בצירוף כולם ולא בזרע א׳ מהם בלבד ועל זה אמר מרע״ה ג״כ כי אתם המעט מכל העמים שהוא בצירוף כולם:"]}]}, {"title": "פרשת תולדות", "chapters": [{"id": "s44", "n": 44, "title": "בו יבואר למה ברך אותו בשם שדי ולא בשם אחר", "paras": ["ואל שדי יברך אותך ויפרך וירבך. טעם שברך אותו בשם שדי לפי ששם שדי הוא מסוגל לפריה ורביה. כי מלוי של שדי הם אותיות ינלתו״ד שהם גי׳ פרו ורבו ולכן גם בפ׳ וישלח ברך ה׳ את יעקב בשם שדי וא״ל אני אל שדי פרה ורבה. גם סוף המילוי של שם שדי הם אותיות נד״ת והוא מסוגל לטהר הנדה מטומאתה. גם נדת הוא גי׳ חות״ם שהוא סותם וחותם את הרחם שלא תפיל האשה את פרי בטנה. ונלע״ד כי כאשר תחליף אות ד׳ של ינלתו״ד באות נו״ן של אותיות דטלנ״ת יהיה המלוי יתלונ״ן. וז״ש בצל שדי יתלונן, כי המילוי שהוא הצל של שם שדי הוא יתלונן:"]}]}, {"title": "פרשת וישלח", "chapters": [{"id": "s45", "n": 45, "title": "בו יבואר טעם הניקוד המנוקד על תיבת וישקהו", "paras": ["ויפל על צוארו וישקהו. מצאתי בספר א׳ קטן הכמות שכתב שתיבת וישקהו הוא ר״ת למפרע ויאמר הכי קרא שמו יעקב ויעקבני עכ״ל. ונ״ל כי בודאי כשנגש עשו אצל יעקב לנושקו בלא ספק שבאותה שעה זכור זכר עשו את אשר עשה לו יעקב שלקח בכורתו וברכתו. ולכן נקוד על תיבת וישקהו לומר שהוא ר״ת למפרע. כי זכר למפרע את הבכורה והברכה:"]}]}, {"title": "פרשת וישב", "chapters": [{"id": "s46", "n": 46, "title": "בו יבואר טעם למה לא שלח יוסף ממצרים אגרת לאביו", "paras": ["ויפקדהו [?] על ביתו וכל יש לו נתן בידו. אין לתמוה כי מאחר שזכה יוסף להיות פקיד על בית פוטיפר למה לא שלח מכתב לאביו להודיעו שהוא במצרים לפי שחשב יוסף שאביו כבר נפטר מצערו על יוסף. והעד על זה שהרי כמה פעמים שאל יוסף את אחיו העוד אביכם חי. ולא עוד אלא שגם אחר שנתוודע לאחיו חזר ושאל העוד אבי חי. מכל זה נראה שלא היה יוסף סובר שעוד אביו חי ולכן לא שלח לו מכתב כי אמר למי אני שולח מכתב או לאבי שאינו בחיים. או לאחי שונאי נפשי [?]:"]}]}, {"title": "פרשת מקץ", "chapters": [{"id": "s47", "n": 47, "title": "בו יבואר ענין החלומות והחילוק שבין חלום הבא ע״י מלאך ובין ע״י שד", "paras": ["ויהי בבקר ותפעם רוחו. משמע מזה שלא נפעמה רוחו בחלום בעת היותו ישן רק בבוקר כשנתעורר מן השינה התבונן בחלום שראה בלילה ונפעמה רוחו בקרבו. וכיוצא בזה אתה מוצא בחלום שחלם נבוכדנצר שבו נאמר ותתפעם רוחו ושנתו נהיתה עליו. כי נתעורר משנתו אחרי ראיית החלום ההוא ונפעמה רוחו בקרבו ולא היה יכול לחזור ולישן עוד. כי כן הוא דרך חלום האמתי הבא על ידי מלאך שאין רוחו נפעמת בשינה בעת ראיית החלום אלא אח״כ שיקיץ משינתו. והטעם הוא לפי שאין רצון הבורא להבהיל את האדם ולצער אותו בשינה רק להודיעו על מה שנגזר עליו או על אחרים כדי שיתנו את לבם לתקן את עוותתם. וא״כ מה בצע להבהיל אותו בשינה. וזהו דומה לנבואת ישעיה שאמר לחזקיה מלך יהודה כי מת הוא ולא יחיה וארז״ל כי מת הוא בעוה״ז ולא יחיה לעוה״ב. א״ל אמאי. אמר ליה משום דלא עסק בפריה ורביה. אמר ליה א״כ [?] הב לי ברתך. א״ל ישעיה כבר נגזרה הגזירה. א״ל יחזקיה בן אמוץ כלה נבואתך וצא כך מקובלני מבית אבי אבא (דוד המע״ה) אפי׳ חרב מונחת על צוארו של אדם אל ימנע עצמו מן הרחמים. שאם כבר נגזרה הגזירה ואין עוד תקוה למה זה שלחך ה׳ אלי וכי יש לך בשורה טובה לבשרני. כן ענין חלום הרע שמראין לאדם ע״י מלאך שאם אי אפשר לבטל הגזירה ע״י תפלה ותענית וצדקה ולהתחרט על מעשיו הרעים א״כ למה מראין לו החלום ההוא וכמ״ש רז״ל על פסוק והאלהים עשה שייראו מלפניו זה חלום רע כדי שייראו מלפניו. וא״כ למה יצער אותו בעת מראות החלום.", "והכלל בזה הוא כי חלום הבא ע״י מלאך הוא יהיה מסודר ולא יהיה מעורבב [?] מענינים שונים [...]. גם אינו [...] ומבוהל [?] בעת ראיית החלום ולא עוד אלא שרואה את עצמו כמו בהקיץ ממש. ואם [?] כל התנאים האלו הם נמצאים באותו חלום ידוע תדע כי אותו חלום הוא אמת [?] והוא בא ע״י מלאך שהוא א׳ מששים בנבואה. אבל חלום הבא ע״י שד דרך [?] אחרת יש לו כי הוא עומד אצל האדם [...] בעודו ישן שינה קלה ולוחש באזנו דברים מבהילים [...] דברים מענין לענין. ואותם הדברים הם מצטיירים במוח האדם ונבהל מהם ולבו דופק מאד ומתעורר מרוב הפחד. ואותם השדים נשארים עומדים שם והם שמחים ומשחקים עליו על בלבולו [?] וכאשר חוזר לישן חוזרים לבלבלו [?] וכן עושים כמה פעמים. ואין האדם ניצול מהם עד שיחזור ויקרא ק״ש. או עד שיעשה אופן אחר והוא כי כאשר יתעורר יאמר נוסח [?] טמא טמא ברח לך מכאן. ויאמר נוסח זה ג׳ פעמים ואז ילך לו השד מעמו [?] [...]. ואם יש לו איזה שונא יאמר טמא טמא ברח לך מכאן ולך אצל פלוני בן פלוני והבהילהו [?]. ואז הוא עושה ככל דבר תצוה עליו. ואם תרצה לנסות דבר זה תלחוש באזני ילד קטן בעודו ישן שינה קלה ותאמר לו קניתי לך תפוחים ואגוזים והנם מונחים בקופסא אצלך. וכאשר יקיץ משינתו הוא שואל על התפוחים והאגוזים איה הם וכמ״ש בספר חסידים סימן קל״ה וסימן תמ״א [?].", "ולכן רוב חלומות המבהילים והרעים אינם באים כ״א בעוד שהאדם ישן שינה קלה כגון בתחלת השינה או בסופה בעת שהתחיל להקיץ שאז אפשר למוח להרגיש בציור הדברים ולא בזמן שהוא נרדם בשינה. ודע כי אם אפילו קורא האדם ק״ש על מטתו קודם שישכב. אם אח״כ נתעורר משינתו לקול בכיית ילד קטן או לכסות את גופו וכיוצא בזה ואח״כ הוא חוזר לישן אז יכולים [?] השדים לשלוט עליו להבהילו ולהפחידו בחזיונות רעות. אלא צריך לחזור ולקרוא ק״ש פעם ב׳ או לפחות פסוק ראשון וברוך שם וכו׳ וכמבואר בשער הפסוקים בשיר השירים על פסוק אני ישנה וכו׳ יעו״ש. גם דע אם איש או אשה מחובר עמהם שד או שדה למשכב דודים הנה הם פורצים גדר הק״ש כדי למלא תאוותם ולא יועיל בהם ק״ש פשוטה אלא צריך כוונת הלב מלה במלה וכולי האי ואולי.", "גם חדשות אני מגיד כי השדים הם למדו את הדברים שבני אדם מקפידין מהם אם רואים אותם בחלום כגון הרואה שנפלו שיניו או מחזיר כפרות עליו או בהמה שחוטה לפניו או שהוא שרוי בתענית או לובש שחורים או הולך יחף וכיוצא בזה. ואין לו לאדם לחוש לחלומות אלו אלא א״כ רואה שנידוהו [?] בחלום או שקראוהו בשמו לעלות לס״ת. ואם גם לזה אינו חושש תבוא עליו ברכה. גם לפעמים מראים השדים לאדם דברים רעים. ואם האדם הוא פתי ומאמין לחלום ההוא אז הם טורחים לעשות הרע ההוא בפועל ממש כדי להטעות את החולם ההוא ולהאמין בחלומותיו או לפחות כששומעים קול הכרוז שברקיע שמכריז על איזה רעה שלא תבוא הם מודיעין אליו בחלום כדי שיאמין בחלומותיו. אמנם צריך אותו אדם לדעת שאם הוא מתענה על חלומות כאלו או עושה כפרות או פדיון נפש ואינו שואל את פי חכם היודע להפריש [?] בין החלום שע״י מלאך ובין החלום שע״י שד ידוע ידע שהוא מעותד מכאן והלאה לחלומות קשים ורעים ומרים מאלו כי השדים הם שמחים על שלא היה יגיעם לריק עם זה האדם. וכל אלו השדים הם נקראים שדין נוכראין לימודי הרע.", "ויש שדים אחרים הנקראים שדין יהודאין ומנהג אחר יש להם כי הם עושים עצמם כנביאים הראשונים וכתנאים ויש שעושים עצמם כדייני ישראל וכתלמידי חכמים המפורסמים שנפטרו מן העוה״ז בעלי זקן גדולה ועטרה בראשיהם או כצדיקים וחסידים. ולפעמים אומרים שהם אברהם יצחק ויעקב. או אליהו הנביא וכיוצא בזה. וצריך האדם לשאול את פיהם אם הם אבות העולם ממש או אם שמותם כשמות האבות וכן ישאל לאליהו. וצריך לדקדק בתשובת דבריהם שאם ישיבו דבר שאינו מבורר נוטה לכאן ולכאן ידוע תדע שהם שדים. וגדולה מזו הם עושים כי יכולים להראות להאדם דמות רקיע ודמות כסא הכבוד וצבא מרום וכיוצא בזה והם נזהרים מאד שלא להבהיל את האדם. ואדרבא הם מצווים אותו להזהר ללמוד בכל יום כך וכך שיעור זוהר ותהלים. ובלילה יעמוד לומר תיקון חצות. ולפעמים גוזרים עליו שיטבול כמה פעמים ביום ויחליף שמלותיו ויזהר פן יגע באשתו ואח״כ מוסיפין עליו סגופין ותעניות ואם לא עשה כן הם מכין אותו ומצווים עליו במפגיע שלא יגלה מראות וחזיונות אלו לבני אדם (כדי שלא יכירו שהם שדים) עד שמעט מעט נמשכת ונקשרת מחשבתו בהם. וכמעט נעשה כמשוגע ולבסוף גורמים לו חולי הכפיה רח״ל. ואלו השדים הם באים בתחלה בחלום ואח״כ באים אפי׳ בהקיץ. ולפעמים תהיה תחלת ביאתם בהקיץ.", "וכמה פעמים הביאו אלי אנשים ובנים ובנות שרואים מראות בהקיץ ואין הפנאי מסכים להאריך בהם רק אספר אחת מהם לדוגמא. בשנת התרע״א בחודש תמוז אחר תפלת מנחת שבת הביאו לפני ילד א׳ בן י״א שנה מ״מ [?] שהיה אומר שהוא מדבר עם אליהו הנביא פה אל פה ומראה ולא בחידות וכל זמן שירצה לדבר עמו הוא קורא אותו ותכף הוא בא רק שיהיה במקום מיוחד בפני עצמו ואין אדם אחר עומד אצלו. אמרתי לו הכנס לחדר זה ושאל אותו האם באמת אתה אליהו הנביא וכן עשה והשיב לו הן באמת אני אליהו ולמה מסתפק יהודה בזה (עלי אני הכותב הוא אומר). אמרתי לילד אין זה כי אם שד יהודי ששמו אליהו ואינו אליהו הנביא ואתה ניזוק משדין יהודאין. בא ואתפלל על ראשך תפלת הנזיקין ועי״כ יברח לו אליהו מעליך. אמר לי הילד בודאי הוא אליהו הנביא ואתה עשה כל מה שאתה יכול לעשות ונראה דבר מי יקום. ואחר שהתפללתי עליו שנים וג׳ פעמים הלך הילד לחדר לנסות אם יבוא אליהו. והנה אליהו תכף בא כמנהגו [?]. ואני הייתי תמיה על דבר זה. ולקחתי את הילד והלכתי אצל ח״ר שמעון אהרן אגסי ז״ל שהיה עדין בחיים כדי לבודקו. ואחר שבדק אותו אמר כי זה הוא אליהו הנביא ואינו שד ואני הייתי חולק עליו ואמרתי לו שהוא שד והסכמנו לילך כולנו אחר תפלת מוצאי שבת אצל ה״ר יעקב בן ה״ר יוסף חיים ז״ל כדי לבדוק אותו ואחר שבדק אותו בכמה דברים גם הוא אמר בודאי כי אליהו הנביא ז״ל בלא ספק. ואני הייתי חולק על שניהם ודוחה דבריהם ובקשתי מהם לתת לי רשות לבודקו פעם אחרת. אמרתי לילד לך אמור לאליהו שיתרגם לך פסוק הנזכר בירמיה סי׳ יוד כדנה תאמרון להום אלהיא די שמיא וארקא לא עבדו יאבדו מארעא ומן תחות שמיא אלה. ואם יתרגם פסוק זה בלשון ערבי אזי אפשר להסתפק ולומר אולי שהוא אליהו הנביא ואינו שד לפי שהשדים הם יודעים לשון ארמית שהרי גם למדברים בלשון ארמית מראין להם חלומות רעים ולוחשים באזניהם לשון ארמית. אלא שפסוק זה המדבר בגנותם אינם רוצים לשמעו ולתרגמו בלשון אחרת. וכאשר שאל הילד את אליהו לתרגם לו פסוק זה. א״ל אליהו איני יכול להתעכב פה כי אני רוצה ללכת מפה לכתוב זכיותיהם של ישראל ואני נחוץ ללכת. וכאשר השיב לי הילד תשובה זו. אמרתי לו חזור ואמור לו שתרגום הפסוק שאני שואל ממך הוא הכרח גדול על שהוא מבחן להיות בטוחים שאתה הוא אליהו. והשיב לו אליהו כבר אמרתי לך שאני נחוץ לילך. אמרתי לילד אמור לאליהו הלא כמה דברים דברת וכמה זמן עמדת פה ויותר נקל הוא תרגום הפסוק מאריכות דברים אלו. ועתה אין החכמים נוחה דעתם עד שתתרגם הפסוק. וכשאמר הילד דברים אלו לאליהו קצף ונשבע חי השם אם עוד אראה אליך הואיל ואין אתם מאמינים בי שאני אליהו ותכף הלך ולא חזר עוד להראות אל הילד. ויהי אחרי לכת אליהו ויאמרו חכמים הנז׳ אלי נראה לדעתינו כי זה הוא אליהו הנביא באמת שכן דרכו להשבע חי השם. וכבר ארז״ל גמירי שאין השדים מוציאין שם שמים לבטלה. ואני אמרתי להם שזהו שד והוא לא הוציא שם שמים לבטלה כי נשבע וקיים שבועתו שברח לו ולא נראה עוד וא״כ אין כאן שם שמים לבטלה. ולא עוד אלא דמעיקרא ליכא הכא שם שמים כלל יען שלא אמר חי ה׳ באותיות הוי״ה או באותיות אדנות אלא אמר חי השם באותיות ה׳ ש׳ ם׳ ואין זה אלא כגונב דעת הבריות. והודו חכמים הנז׳ לדברי.", "ונחזור אל הענין והוא כי עד עתה דברנו בענין ההפרש שבין החלום הבא ע״י מלאך ובין החלום הבא ע״י שדין יהודאין ושדין נוכראין. ומעתה נחזור לדבר במהות החלומות עצמם ובפתרונם וזה החלי בעזרת צורי וגואלי:", "דע כי החלום יבא ברמז דק מאד והוא מכמה סיבות. א׳ לפי שהוא לזמן רחוק אחר שנים רבות. והב׳ כשהוא בא להוכיח את האדם על איזה חטא אשר חטא. והג׳ הוא בדבר הנוגע בין איש לאשתו. ואביא לך דוגמא על כל א׳ מהם. והוא כי סיבה א׳ היא נודעת כמו חלום יוסף שחלם לאחיו וכחלום הצלם של נבוכדנצר ובחלומות דניאל שכולם באו ברמז דק לפי שכפי[?] דקות הרמז כך היא ריחוק זמן קיומם.", "וסיבה הב׳ שאמרנו שהוא בא להוכיח על איזה חטא. והוא כי פעם אחת בא איש א׳ וא״ל שראה בחלומו שקושר תפילין של יד בראשו ותפלין של ראש בזרועו. ואמרתי לו שבא על אשתו שלא כדרכה ולפי שנשמתו גדולה הוכיחו אותו על ככה כדי שיזהר מכאן ולהלאה. עוד פעם אחת בא איש א׳ ואמר לי ג׳ פעמים ראיתי שירך שמאלי יוצאים ממנה תולעים ולא ידעתי מה החלום הזה. אמרתי לו ששכב ג״פ עם ישמעאלית ולכן הראו לו בחלום תולעים בירך שלו כי משם מתחלת העבירה דכתיב בתת ה׳ את ירכך נפלת והנכרים הם בסטרא דשמאלא דישראל כי יצחק וישמעאל הם אחים זל״ז. והוא הודה בזה ועשה תשובה. עוד פעם א׳ היתה אשה מדברת עם כל אדם בין עם איש יהודי או איש נכרי והיא פרוצה במעשיה ואמרו לבעלה בחלום כי אשתו היא אשת כהן גדול ואמרתי להם שר״ל שאינו מיטמא לה בעלה (כלו׳ שזנתה) אמנם לא שמעתי אח״כ אם אמת היה הדבר או לאו.", "וסיבה הג׳ שאמרנו שהוא בדבר הנוגע בין איש לאשתו. והוא כי פעם א׳ היה תלמיד אחד לומד כל לילות השבוע עם הישיבות פעם בישיבה זו ופעם בישיבה זו כפי הישיבה הקבועה ללמוד באותה הלילה ואינו לן בביתו כי אם בליל שבת בלבד ולפי שבכל הלילות הוא מנדד שינה מעיניו לכן תרדמה גדולה נופלת עליו בליל השבת ופעם א׳ ראה בליל שבת בחלום שאיש א׳ אומר אליו צדיק על שולחן יבוא. ולא היה מבין מה פירוש דבריו. וחזר אותו האיש ואמר חן חן לאיש המבין. ותכף הבין שכוונתו על מצות עונה.", "גם יום א׳ אירע שת״ח א׳ ראה בליל שבת כאלו אותה הלילה היא ליל חג השבועות. והוא היה לומד עם בני משפחתו ביחד והביא תשעה פתילות והציגם בשלשה כלי חרס. כל ג׳ פתילות בכלי חרס א׳ ונתן בכלים ההם שמן שומשמין והדליקם. והוא היה תמיה שאיך הוא הדליק בכלי חרס שאינם מאירים מגבן ולא הדליק בעששיות של זכוכית. והוא היה מסתכל ומתבונן בהם וראה שכל זמן שהיו הפתילות גבוהים משפתי הכלים היו מאירים חוצה לצדדי הבית וכאשר הודלקו ראשי הפתילות והוכפלו למטה אצל השמן לא היו מאירים כי אם כנגדם למעלה כנגד הרקיע בלבד ונתעורר מן החלום. ולפי שהיו לאותו הת״ח ד׳ בנים ונפקד א׳ מהם ונשארו לו ג׳ נתפעל ונבהל מאד מן החלום ההוא כי היה חושש על ג׳ בניו הנשארים ונתענה ביום השבת. ואחר עבור שעה שמינית מהיום פגע אותי בדרך בלא מתכוין וסיפר לי את חלומו ואמר שהוא יושב בתענית עליו. ופרשתי לו את החלום פירוש פשוט ולא נחה דעתו בפירוש ההוא. והפציר בי לפרשו אליו פירוש האמתי. ואמרתי לו אם אפרש לך את החלום על פי אמתותו אולי תכחש אלי ותאמר לא היה דבר זה. אכן תן לי דיבור שתודה על האמת ואני אפרש אותו אליך. ויען ויאמר אני מקבל עלי להודות על האמת ולא אכחש מאומה ויעבור עלי מה. אמרתי לו כי בליל שבת זו אתה היית ישן במטה בפני עצמך ואשתך במטה בפני עצמה. ונתעוררת בלילה ג׳ פעמים לקום לקיים מצות עונה והיה לך תאוה וסוף דבר נמנעת ולא קיימת מצות עונה לכך הראו אליך את החלום הזה. והשיב לי ויאמר לי כי כן היה המעשה ממש בלא שום חסרון ויתרון. אך אמור לי מאיזה רמז של החלום פירשת כן. אמרתי לו כי ג׳ פתילות של הנר הם תלתא שלהובין דרחימו הנמשכין מתרין ירכין וצדיק והדלקת אותם ג״פ אבל היו בכלי חרס ולא היו מאירים כראוי וכאלו הם דעוכים. וכלל זה יהיה בידיך כי רוב החלומות הבאים ע״י מלאך הם מתבארים על פי הסוד יען כי המלאך רוחני ולכן עושים הרמז עפ״י דרכם ובפרט בענין כזה שהוא בין איש לאשתו מראין לו לאדם ברמז גדול. ולפי שהקפידו על שלא קיימת מצות עונה לכן הראו לך חלום הנז׳. אמר לי ניחמתני תבורך מפי עליון:", "והואיל ואתא לידן ענין החלומות ופתרונם אכתוב קצת חלומות ששאלו ממני לבאר להם פתרונם. כי אולי יוכל הלומד לפתור גם הוא מקצת חלומות.", "פעם א׳ נכנסתי אצל רופא א׳ הנקרא יחזקאל עזרא בן משה אל עיני והוא רופא עינים אמנם הוא יודע לעשות שמן מרקחת לרפואת חולי העצמות הכואבים מבפנים לבשר. ואין דבר זה יודעים כל הרופאים שבדור ההוא. ושמן זה הוא עומד לו ביוקר הרבה מאד. ובעת בואי אליו אמר לי שראה בחלום את אביו משה שזה היה לו שלושים שנה משנפטר ולא ראהו בחלום רק אמש בלילה. והיה אביו אומר לו בבקשה ממך בני שתלווה אותי עד עיר בצרה בלבד ותעשה עמי טובה זו ואיני מבקש ממך דבר אחר חוץ מזה ע״כ החלום. ורופא הנז׳ היתה נפשו עגומה עליו מאד לדעת את פתרון החלום ההוא. וקודם שאבוא לפרש את החלום אגיד לפני הקורא את מעשה האיש משה הנז׳ ואת מנהגו. כי אני מכיר בטוב את האיש ההוא ואת מעשהו. והוא כי האיש משה היה עניו מאד זקן ונשוא פנים וחזרן על המצות. והיה דרכו בקודש לילך בכל יום בג׳ בתי כנסיות הסמוכים זל״ז במקום א׳ פעם נכנס בזו ופעם נכנס בזו כדי לענות קדיש וברכו וקדושה ואמן ותמיד הוא הולך ובא מזו לזו וכשרואה איזה זקן בא ממרחק הוא ממהר לישב כדי לקום מפניו בעת גשתו אליו. ואחר גמר התפלה היה מקבץ את כל החנוונים זה אחר זה בבה״כ כדי להניח ציצית ותפילין ולקרוא ק״ש. וקנה להם כמה ציציות ותפלינות מכיסו ומממונו והקדיש אותם להיות מצוי להם תמיד ציצית ותפלין. כך הוא מנהגו בכל יום ויום.", "ומעתה נבוא לפרש את החלום שחלם בנו רופא הנז׳. אמרתי לרופא כי אביו חזר להתגלגל באיש א׳ על איזה חיסור מצוה והאיש ההוא הוא חולה או בעיניו או בעצמותיו והוא איש עני ואין ידו משגת ליתן שכר הרופא. ועתיד הוא לבוא אצלך היום או מחר ובא אביך לבקש ממך שלא תגעור באיש ההוא ותעסוק עמו בחנם כי אביך הוא. ואין דבר זה נמשך לימים רבים רק לג׳ או ד׳ ימים כשיעור מהלך מכאן ועד עיר בצרה ואח״כ יפטר אותו האיש. ובזה תכיר את האיש ההוא כי מסתמא גם הוא רגיל להלביש ציצית ותפלין לאחרים. וכאשר יבוא ענין זה לידך שלח אחרי כדי לראות נפלאות אל דעות. וכאשר הלכתי מאצל הרופא [...] ליום[?] היה שלוחו אחרי וא״ל [...] עליו והוא חולה ברגליו. וכאשר הלכתי אצל הרופא ראיתי את האיש ההוא והוא עני[?] מאד. ואמר לי כי היה מלאכתו לעשות שמן שומשמין והיו לו כמה פועלים[?] תחת ידו ועכשיו בעו״הר אכלו זרים יגיעו ולא נשאר לו מאומה. ולא זו אלא שחלה את רגליו שאינו יכול לילך מכאב עצמות רגליו. אמרתי לו זה היה מסיבת שלא היית לובש ציצית ותפלין. אמר לי אני נזהר בציצית ובתפלין ולא עוד אלא שגם לפועלים קניתי תפלינות ולא הייתי מניחם[?] לעסוק במלאכתי עד שיניחו תפלין. ובעת הסעודה אני מצוה אותם [...] גם ברכת המזון אעפ״י שיש לי הפסד. ולא ידעתי למה עשה ה׳ עמי [...]. ואז הרופא עשה כאשר צוה אביו עליו. ואמר לחולה אל תירא אני [...] בעבורך עד מקום שידי מגעת. וגם נתן לו מעות לפרנס את בניו ואחר ג׳ ימים נפטר אותו החולה. והיה הרופא בצער גדול ונשא קל וחומר בעצמו ואמר אם לאבי שהיה חסיד גדול ובעל מעשים כך מנתה[?] לו אם כן מה אדבר[?] ומה אומר על רוב פשעי וחטאתי. וישב לו בתענית כמה ימים והיה [...] לפני הקב״ה ונעשה צדיק גמור עד בא חליפתו:", "עוד פעם א׳ היה איש א׳ חסיד שמתענה בכל ימות החול וכאשר היה סועד ביום השבת היה לו [...] וגמר בדעתו להתענות גם ביום השבת אם [...] לו מעלת הרבנים הי״ו. וקודם ששאל על תענית של השבת ראה בחלום ששני אנשים הגישו אליו ב׳ קערות אחת יש בה פירות העץ והב׳ פירות אדמה ואמרו אכול והוא לא רצה לאכול כי נדמה לו שהוא שרוי בתענית כמנהגו. והם האנשים הפצירו בו עד בוש והוא לא רצה לאכול בשום אופן ואח״כ כעסו האנשים ואמר אחד לחבירו קום קח את הקערות מלפניו כי אין זה רוצה בתחיית המתים. ע״כ היה החלום ההוא. וכאשר הקיץ משינתו היה ירא וחרד מן החלום ההוא כי היה חושש שאינו קם בתחיית המתים. ושלח שליח לשאול את פתרון החלום כי לא היה רוצה להכיר בו שהוא המתענה. ואמרתי לשואל כי יש כמה נשמות בני אדם המגולגלים במים ובמלח ובלחם ובפירות ובבשר ובעופות וע״י שיברך האדם עליהם בעת אוכלו אותם אז תתתקן הנפש ההיא[?] והולכת להשלים דינה בגיהנם ואם לא ברך עליהם ואכלם בלא ברכה אז יש צער[?] גדול לאותה הנפש שלא זכתה להתתקן. ולכן גם אותו האדם שאכל אותן בלא ברכה כשנפטר מן העולם ותתחייב נפשו להתגלגל במאכל. יזמין הבורא ביד מי שאוכל בלא ברכה כדי שלא יזכה להתתקן ועושה עמו כמו לנשמות. כי הקב״ה מודד לאדם מדה כנגד מדה. וזה סוד מ״ש הכתוב כי לא על הלחם לבדו יחיה האדם וכו׳ פירוש כי לא ע״י אכילת הלחם לבדו בלא ברכה יחיה האדם המגולגל בלחם ההוא ויתקן. אלא על כל מוצא פי ה׳ שהיא הברכה שמברכין עליו יחיה האדם המגולגל בלחם ההוא. ואותו האיש אשר חלם החלום הזה [...] והוא מתענה כל ימות השבוע שלא על שום תיקון עבירה ידועה [...] גורם לכמה ניצוצות קדושה ולכמה נשמות המגולגלים במאכל שהם נשארים מבלי תיקון. והגידו לו מן השמים שאין צריך עוד להתענות ומעתה קום אכול[?] כדי להחיות את המתים המגולגלים באותו המאכל. ולפי שלא רצה לאכול אמרו שאין זה רוצה בתחיית המתים. ולזה דקדקו לומר לו שאין זה רוצה וכו׳ ולא אמרו שאין זה הוא קם בתחיית המתים. ובזה נ״ל לפרש כוונת הכתוב ויאהב קללה ותבואהו ולא חפץ בברכה ותרחק ממנו שהכתוב מדבר על הרשע שאוכל בלא ברכה שהוא מזיק לעצמו ומזיק לנשמות שבמאכל וזהו ולא חפץ בברכה. ולכן מה עושה הקב״ה מזמין לידו מאכל שאין בו נשמות מגולגלים. כי הנשמות הם מתפללים ובוכים לפני הקב״ה שלא יזמין אותם לאכילת אותו אדם פן יקלקל אותם יותר וזהו ולא חפץ בברכה ותרחק ממנו. ולפי שבירור הנשמות וניצוצות הקדושה הוא נעשה ע״י שם ב״ן[?] לכן נרמז שם זה[?] הכא בר״ת[?] ולא חפץ בברכה ותרחק ממנו:", "פעם אחרת היה בעירינו מכת דבר רח״ל והיה ת״ח א׳ הנקרא יחזקאל הפרסי והוא לומד בישיבה שלנו ויש לו אב ואם ואח ואחות. ובלילה הוכתה אמו בדבר ובבקר מתה. ובאותם הימים לא היו נוהגים ז׳ ימי אבלות. ובלילה הב׳ ראה אותו ת״ח בחלום שעין הימין של אביו היא עקורה. ובא אלי ביום ההוא מרעיד כי היה ירא מאד על נפשו פן ימות גם הוא לפי שהוא היה בן בכור ות״ח וא״כ בלא ספק הוא עין הימין של אביו. ואמרתי לו כי פירוש החלום הוא מורה על התפילין של אביך של הראש שיש בו פיסול ויכולני לומר שהפיסול הוא בפרשה שניה שהיא והיה כי יביאך וכו׳ כי כן הוא לפי סודם של דברים שפרשה ב׳ היא רומזת לה׳ חסדים של הדעת שהם חמשה הויו״ת העולים בגי׳ ק״ל כמספר עין. ויכולני עוד לומר שהפיסול הוא בשטה[?] א׳ לפי ששם כתוב ולאבותיך. והשיב לי אותו הת״ח כי בחודש העבר כבר בדק אבי את התפלין שלו. אמרתי לו מוכרח הוא שיש בו פיסול ותכף הלך והביא התפלין של הראש והתרתי את התפירה ומשכתי מתוכו פרשה ב׳ בלבד והראיתי לכל בני הישיבה שאיך אות הכ״ף של תיבת ולאבותיך קרוע הגג שלו ונחלק לב׳ אותיות ן׳[?] פשוטה ונקודה אצלו. ושמח שמחה גדולה שהפיסול הוא רומז באביו ממש והיה פתרון זה לפלא בעיני כל בית המדרש:", "גם פעם א׳ באה אשה הרה שראתה בחלום איך בעלה הלך לבית הקברות והוציא משם את אחיו המת והביאו לבית. והיא היתה מתקוטטת עמו להוציאו מן הבית. והוא לא היה חושש לה והעלהו לגג וקברו שמה. ואמרתי לה האם יודעת את כמה מדרגות יש מן החצר עד הגג. ואמרה שאינה יודעת מניינם אמרתי לה לפי דעתי הם ט׳ מדרגות. אמרה לי לא אדוני יש יותר [...] שהם י״ב מדרגות. אמרתי לה א״כ לא אפרש לך החלום עד שתלכי ותמני את המדרגות ותשובי אלי וכאשר שבה צחקה ואמרה שהם ט׳ מדרגות כאשר אמרת אמרתי לה זה פתרונו כי את הרה מבן זכר והוא מגולגל מנשמת את שמו בשם דודו ומבשרים אותך שתשלימי ט׳ חודשי עיבור שהם ט׳ מדרגות הנז׳ ולא תפילי את העובר. ואח״כ יחיה ולא יפטר כדודו אלא יהיה קבור עמכם בבית ולא יחזור לבית הקברות. וכן היה כי אחר ששלמו ימי הריונה המליטה זכר ויקראו אותו בשם דודו. ובאה אח״כ לבית המדרש ונתנה לי תודה רבה:", "עוד פעם אחת באה אלי אשה זקנה ואמרה כי ראתה בחלום שהוציאה ס״ת מן ההיכל להוליכו אל התיבה לקרות בו בציבור ובאה אשה אחרת וחטפתו מידה. אמרתי לה זה פתרונו שיתנו לה ילד א׳ להגישו למילה אצל כסא אליהו הנביא ותבא אשה אחרת ותחטוף את הילד ממך והיא תזכה בו להגישו למילה. והשיבה לי כי דבר זה כבר נתקיים בה משני שבועות שעברו. (כלו׳ וכי מראין לאדם חלום על דבר שעבר) מה פתרון הוא זה. אמרתי לה ואת אימתי ראית את החלום. אמרה לי זה חודש ימים. אמרתי לה א״כ קדם החלום למעשה ואין זה בכלל שאין מראין לאדם דבר שעבר. ומה בידי לעשות אם את לא באת לשאול פתרון החלום אלא עד אחר שנתקיים. ודע[?] כי הכלל הוא בזה כי ס״ת הוא מורה על בן זכר. ולכן אם רואה האדם שקנה ס״ת או שהביאו[?] לו ס״ת. פירושו שתתעבר אשתו בבן זכר. ואם נפל ס״ת מידו תפיל אשתו. ואם נקרע ימות הולד. וזה הפתרון הוא בדוק ומנוסה.", "גם יש חלומות אחרים הבאים בעירבוב אין להם סדר ואין בהם פחד ובהלה. חלומות אלו הם באים מציור מחשבת המוח כי אין המוח שוקט ונח מן המחשבות אפי׳ בזמן השינה. ואלו החלומות לא מעלין ולא מורידין ואינם מורים לא על טובה ולא על רעה ואין לחוש להם הן אלה קצות דרכי החלומות וישמע חכם ויוסף לקח:"]}]}, {"title": "פרשת שמות", "chapters": [{"id": "s48", "n": 48, "title": "בו יבואר טעם למה אמר משה לפרעה נלכה נא דרך שלושת ימים וכו׳ מאחר שבאמת היתה כוונתו להוציאם לחירות עולם", "paras": ["נלכה נא דרך שלשת ימים במדבר ונזבחה לה׳ אלהינו וכו׳. קשה כי מאחר שרצון הקב״ה היה להוציאם ממצרים לחרות עולם א״כ למה זה צוה למשה ולאהרן לומר לפרעה נלכה נא דרך שלושת ימים והי׳ מן הראוי[?] לומר לו שישלח[?] אותם לחפשי לגמרי ואם יסרב יביא עליו מכות עד שיאמר [...]. [...] ויהפך לבו ולב עבדיו לרדוף אחריהם שכל הרודפים הם זכרים [...] להשליך גם את הזכרים [...] עליהם להשליך את הזכרים במים [...]. אמנם ביאור הענין הוא כי הקב״ה אמר לאברהם ועבדום וענו אותם וגו׳ [...] גזרו עליהם [...] ולטבעם[?] בים סוף מדה כנגד מדה כמ״ש כי בדבר אשר זדו עליהם וכמ״ש רש״י ז״ל:"]}, {"id": "s49", "n": 49, "title": "בו יבואר ענין מטה משה ומטה אהרן וישוב הפסוקים שנראים סותרים זה את זה", "paras": ["ויאמר אליו ה׳ מזה בידך ויאמר מטה. מבואר מזה שהמטה היתה מכבר ביד משה ועליה הוא שסיים אח״כ הכתוב ואת המטה הזה תקח בידך אשר תעשה בו את האותות. אמנם צריך להבין על איזה אותות אומר לו הקב״ה אשר תעשה בו את האותות. אם על האותות שעשה לעיני זקני בני ישראל והלא לזה לא היה צריך מטה רק אות הנחש בלבד ואם על אות התנין שהיה לפני פרעה והא הוא היה על ידי מטה אהרן כמ״ש ואמרת לאהרן קח את מטך והשלך לפני פרעה יהי לתנין כי גם לאהרן היה מטה בפ״ע. ולא זה הוא אות הנחש שעשה לפני זקני ישראל כי הנחש לחוד והתנין לחוד. וי״ל כי מכת היאור שנהפך לדם היא היתה ע״י מטה משה כמ״ש בפ׳ וארא סי׳ ז׳ והמטה אשר נהפך לנחש תקח בידך וגו׳ ואמרת אל פרעה וכו׳ הנה אנכי מכה במטה אשר בידי על המים אשר ביאור ונהפכו לדם נמצא שמכת היאור היתה ע״י מטה משה ולא ע״י מטה אהרן כי מטה משה הוא אשר נהפך לנחש בין בסנה ובין לעיני זקני ישראל ולא מטה אהרן. וכן בפ׳ בשלח אמר ומטך אשר הכית בו את היאור וכו׳ נמצא שהכאת היאור היתה ע״י מטה משה. ומה שכתוב בפ׳ וארא אמור אל אהרן קח מטך ונטה ידך על מימי מצרים וכו׳ אפ״ל שהכוונה היא על שאר היאורים והאגמים של מצרים שהם היו ע״י מטה אהרן. גם אותות הברד והארבה הם היו ע״י מטה משה כמבואר בפסוקים. ועל ד׳ אותות אלו שהם נחש יאור ברד ארבה אמר הכתוב אשר תעשה בו את האותות ולא על כל העשר מכות:"]}]}, {"title": "פרשת בשלח", "chapters": [{"id": "s50", "n": 50, "title": "בו יבואר פירוש יחוד קבה״ו וכו׳ מי הוא הנקרא קב״ה ומי הוא הנקרא שכינתיה. ומה פירוש זה היחוד שאנחנו אומרים", "paras": ["ויאמר כי יד על כס יה מלחמה לה׳ בעמלק. הנה אמרו רז״ל אין ה׳ שלם ואין הכסא שלם עד שימחה שמו של עמלק וכו׳ וכן הוא אומר האויב תמו חרבות לנצח וערים נתשת אבד זכרם המה. זה עמלק וסמיך ליה וה׳ לעולם ישב. זה ה׳ שלם. כונן למשפט כסאו. זה הכסא שלם. ונלע״ד כי עיקר הקפידא היא על שלימות שם הויה ב״ה כי כאשר ישתלם שם הויה ב״ה ממילא גם הכסא יהיה שלם. כי מטעם זה נאמר בסיום הפסוק מלחמה לה׳ בעמלק ולא אמר מלחמה לה׳ ולכסאו בעמלק. כי העיקר הוא שלימות ה׳ וכאשר ישתלם השם ממילא גם הכסא יהיה שלם.", "והואיל ואתא לידן נפרש ענין לשם יחוד קבה״ו וכו׳ שנהגו הראשונים לאומרו קודם כל מצוה ומצוה. והוא כי אנחנו מתפללים לפני ה׳ שע״י קיום אותה המצוה ישתלם שם הוי״ה ב״ה ויתייחדו ב׳ אותיות י״ה עם ב׳ אותיות ו״ה החסרים מן שם הויה במלחמת עמלק ויהיה ה׳ שלם. ומדאגה פן יהיו עונותינו מבדילים בינינו לבין המקום ב״ה כמ״ש כי אם עונותיכם היו מבדילים ביניכם לבין אלהיכם וכו׳ ולא תעלה תפלתינו שאנחנו מתפללים על חיבור שם י״ה בו״ה כנז״ל לכן אנחנו מקדימין לומר לשם יחוד קבה״ו וכו׳.", "וביאור הענין הוא כי הנה נודע כי גוף כדור השמש הוא קבוע ברקיע ואורו הוא זורח למטה בארץ ומאיר לארץ ולדרים עליה. ואם יהיה יום מעונן אז יהיה הענן מפסיק בין כדור השמש לבין אור זריחתו שעל הארץ ומאפיל לארץ ולדרים עליה. כדמיון הזה ממש כן[?] הקב״ה כי הקב״ה נקרא שמש כמ״ש כי שמש ומגן ה׳ צבאות. והוא רוכב שמים כמ״ש רוכב שמים בעזרך וכו׳ וזריחת אורו הוא בארץ מתחת כי מלא כל הארץ כבודו. ואותה הזריחה של אורו שבארץ קוראים אותה רז״ל בשם שכינה על שם שהיא שוכנת למטה בין ישראל כמ״ש כי אני ה׳ שוכן בתוך בני ישראל. וכן ועשו לי מקדש ושכנתי בתוכם. וכמו שהעננים הם מפסיקין בין השמש שברקיע לבין זריחתה שבארץ. כן העונות הם מפסיקין בין הקב״ה ובין השכינה שבארץ. כי העונות הם נמשלים לעננים כמ״ש מחיתי כעב פשעיך וכענן חטאתיך. ולכן אנחנו מקדימין לומר לשם יחוד קב״ה ושכינתיה. דהיינו שיסתלקו ענני העונות המפסיקים בין הקב״ה ובין אור פניו הנקרא שכינה כמ״ש ה׳ באור פניך יהלכון ויתייחד אור פניו השוכן אתנו עם עיקר אורו שלמעלה ויהיה הכל קשר א׳ מעולם העליון עד הארץ מתחת מבלי שום עבים ועננים כדי שעי״כ תעלה תפלתינו שאנחנו מתפללים על יחוד י״ה בו״ה שהיתה על שבועת עמלק ימ״ש[?]. ולכן אין אנחנו זוכרים גם הכסא בשם יחוד הנז׳ כי הכסא ממילא הוא משתלם כדאמרן. ואחר כותבי את זאת ראיתי שכן כתב בזו׳ ויצא ד״קנט ע״ב וז״ל אלא הכי אוליפנא שמשא כד נהיר איהו בשמיא ותוקפיה וחיליה איהו שלטא על ארעא בכל אתר כגוונא דא מלא כל הארץ כבודו וכו׳ יעו״ש הרי שהזוהר כלל כל דברינו אלה בדברים קצרים מאד:"]}]}, {"title": "פרשת יתרו", "chapters": [{"id": "s51", "n": 51, "title": "בו יבואר רמז החילוק שבין האוכל משרץ המים לאוכל משרץ הארץ ולאוכל משרץ העוף", "paras": ["לא תעשה לך פסל וכל תמונה אשר בשמים ממעל ואשר בארץ מתחת ואשר במים מתחת לארץ. פשוט הוא כי השמים הוא ממעל והארץ היא מתחת והמים הם מתחת לארץ וא״כ ראוי לומר אשר בשמים ואשר בארץ ואשר במים. ונלע״ד שבא לרמוז על מאי דאמרינן במסכת מכות דט״ז שהאוכל משרץ המים לוקה ארבע. והאוכל משרץ הארץ לוקה חמש. והאוכל משרץ העוף לוקה שש יעו״ש. וז״ש אשר בשמים. ר״ל האוכל משרץ העוף אשר יעוף בשמים הוא לוקה. ממעל כלומר במדרגה היותר עליונה מכולם. שהיא שש. ואשר בארץ ר״ל והאוכל משרץ הארץ. מתחת. כלומר לוקה פחות א׳ משרץ העוף. והם חמש. ואשר במים מתחת לארץ. כלו׳ לוקה פחות א׳ משרץ הארץ והם ארבע:"]}]}, {"title": "פרשת משפטים", "chapters": [{"id": "s52", "n": 52, "title": "בו יבואר אם לא זכה האדם להבנות מאשתו ורצה לישא אשה אחרת עליה ואשתו מוחה בידו ומעכבתו לישא אשה אחרת מה דינה בעוה״ב", "paras": ["בגפו יבא בגפו יצא. פי׳ אם בגפו יבוא לעולם העליון שלא רצה לישא אשה כדי לקיים מצות פריה ורביה. אז בגפו יצא מעולם העליון ואין נשמתו נכנסת לג״ע אלא צריך לחזור לבוא בגלגול וגופו הראשון אינו קם בתחיית המתים כמ״ש ישעיהו הנביא ליחזקיה כי מת הוא ולא יחיה וארז״ל מת הוא בעוה״ז ולא יחיה לעוה״ב. אבל אם בעל אשה הוא וטרח לקיים מצות פו״ר ולא עלה בידו ורצה לישא אשה אחרת ועיכבה אשתו עליו ולא הניחתו לישא אשה. אז ויצאה אשתו עמו מעולם העליון. ונ״ל שגופה הא׳ בטל לגמרי ואינה עומדת בתחיית המתים כאלו גם היא מחוייבת בפו״ר כדין ההורג את חבירו. והוא קם בתחיית המתים ברוחא דשבק באשתו כי אנוס הוא:"]}, {"id": "s53", "n": 53, "title": "בו יבואר ענין סמיכות הביכורים לאיסור בשר בחלב", "paras": ["ראשית בכורי אדמתך תביא בית ה׳ אלהיך לא תבשל גדי בחלב אמו. רבים תמהו דמה קישור יש להביכורים עם איסור בשר בחלב. ושמעתי ע״ז מעשה שפעם א׳ הביא כהן הנוצרים ביכורים חשובים מנחה למלך בטרם הגיע זמן הביכורים ההם בחדש אחד. והמלך תמה מאד על זה איך האילן הקדים לבכר טרם בוא הזמן. והמלך שאל את פי הכהן אם אילן זה דרכו להקדים פירותיו בכל שנה ושנה. והכהן השיבו לא כן אדוני המלך רק חכמתי עמדה לי להשקות לאילן מין משקה אשר עי״כ יקדים את פירותיו. ובעת ההיא היה הרב הראשי יושב אצל המלך. ורצה אותו הכהן[?] לבזות את הרב ואמר למלך הנה בני ישראל הם מתפארים ואומרים שהם נקראים עם חכם ונבון האם יוכל לדעת את החכמה הגדולה הזאת. והרב הראשי נצטער מאד ונצנצה בו רוח הקודש ואמר למלך כי הוא השקה את האילן מרק של בשר בחלב ודבר זה הוא כתוב בתורה דכתיב ראשית בכורי אדמתך וגו׳ לא תבשל גדי בחלב אמו. ר״ל אעפ״י שצויתיך[?] להביא ראשית ביכורי אדמתך צריך להזהר שלא תבשל גדי בחלב אמו להשקות את האילנות כדי להקדים לבכר. ואלו הביכורים שהביא הכהן הנוצרי דורון לאדוני המלך הם אסורים וכוונתו להעביר אותך על דין התורה כדי שתהיה מתועב ושנוא בעיני המקום ב״ה. ועוד שמנהג העולם שבני אדם הם מביאים ביכורים לכהן והוא עשה בהיפך שהוא כהן הנוצרים והביא ביכורים לאדם שאינו כהן. אין זה כ״א להכשילך לפני המקום ב״ה. ויחר אף המלך מאד וצוה לתלות את הכהן ההוא על אותו האילן ואח״כ עקר גם את האילן ממקומו:"]}]}, {"title": "פרשת תרומה", "chapters": [{"id": "s54", "n": 54, "title": "בו יבואר ענין צמצום שכינתו ית׳ בין ב׳ הכרובים", "paras": ["ונועדתי לך שם ודברתי אתך מעל הכפרת מבין שני הכרובים. אעפ״י שהקב״ה הוא מלא את השמים ואת הארץ כמ״ש בירמיה סי׳ כ״ג. מפני אהבת ישראל צמצם אורו בין ב׳ הכרובים. כי האור אעפ״י שהוא גדול מאד יוכל להתצמצם. שהרי אם תניח כף ידך סביבות החשמל יחשך כל אור הבית וכל אור הבית יתצמצם בתוך כף ידך. ובזה השיבותי לשואלי דבר ששאל על פיוט אמרו רבותינו וכו׳ הנזכר בהגדה דליל פסח שנזכר שם כי כשירד הקב״ה למצרים ירדו עמו תשעת אלפים רבבות מלאכים. ותמה ואמר והלא תשעת אלפים רבבות הם סך עצום העולים תשעים מליון והמלאך הוא שלישו של עולם ואיך ארץ מצרים החזיקה צ׳ מליון מלאכים. אמרתי לו חדא שאין גודל המלאך שלישו של עולם אלא הוא מעופף שלישו של עולם בעפיפה אחת ואח״כ הוא עומד לנוח ואח״כ חוזר ועף שליש הב׳ ואח״כ חוזר ועף שליש השלישי וכמ״ש בברכות ד״ד תאנא מיכאל באחת גבריאל בשתים אליהו בארבע וכו׳. ועל מה ששאלת איך ארץ מצרים החזיקה צ׳ מליון הנה האור אינו תופס מקום שהרי אם תדליק נר א׳ בחדר יתמלא כל החדר כולו אורה עד אפס מקום פנוי וכאשר תחזור ותדליק עוד כמה נרות אצלו יכול החדר לקבל את אור כולם אעפ״י שכבר נתמלא החדר מאור הא׳. אות ק״לב דלקמן שייך פה:"]}]}, {"title": "פרשת כי תשא", "chapters": [{"id": "s55", "n": 55, "title": "בו יבואר טעם שמותר לחלל את השבת החמור שהוא בסקילה אצל פיקוח נפש. ולא הותר איסור אשת איש הקל שהיא בחנק אצל פיקוח נפש", "paras": ["ושמרתם את השבת כי קודש היא לכם מחלליה מות יומת כי כל העושה בה מלאכה ונכרתה הנפש ההיא מקרב עמיה. שאול שאל האיש למה איסור שבת החמור נדחה אצל פיקוח נפש לפי שהכתוב הוא אומר אלה המצות אשר יעשה אותם האדם וחי בהם ולא שימות בהם. א״כ למה לא התירו אשת איש הקל למי שחלה ונטה למות מרוב חשקו בה. אמרתי לו יש הפרש בין חילול שבת לאיסור אשת איש. כי חילול שבת אינו נעשה ע״י החולה עצמו רק אחרים מחללים עליו את השבת כגון לשחוט ולבשל ולשחוק לו סמנים וכיוצא בזה. משא״כ איסור אשת איש שהוא נעשה ע״י הנואף עצמו זהו אסור לגמרי. אין הכי נמי אם היה מספיק להיות נבעלת לאישה עצמו לנגד עיניו והוא מתרפא מחליו שזהו נעשה ע״י אחרים בודאי היה זה מותר. אבל רז״ל יודעים שאין מספיק זה לנואף כי כל שכן שמתגבר יצרו עליו ולכן אסרוהו לגמרי:"]}, {"id": "s56", "n": 56, "title": "בו יבואר פי׳ פנים אל פנים. ודמיון. ותמונה. ופי׳ אספקלריא המאירה ואספקלריא שאינה מאירה ומראה בניקוד קמץ ומראה בניקוד סגול", "paras": ["ודבר ה׳ אל משה פנים אל פנים כאשר ידבר איש אל רעהו. קשה א״כ למה שאל משה מה׳ הראני נא את כבודך. מאחר שהיה מדבר עמו פנים אל פנים והנה לכאורה יש לתרץ בפשיטות והוא כי אעפ״י שהיה ה׳ מדבר עם משה פב״פ מ״מ משה עצמו לא היה רואה כלום. שהרי גם במעמד הר סיני נאמר על ישראל פנים בפנים דבר ה׳ עמכם בהר מתוך האש. ועכ״ז נאמר שם ותמונה אינכם רואים זולתי קול. או אפשר לומר כי אעפ״י שהיה ה׳ מדבר עם משה פב״פ הנה משה עצמו היה מסתיר פניו ולא היה מביט בפני השכינה ולכן היה מתפלל ליתן לו רשות להראות את כבוד ה׳. אמנם אין ב׳ תירוצים הנז׳ ניתנין להיאמר יען כי בפרשת בהעלותך נאמר ותמונת ה׳ יביט וכו׳ ומאחר שהיה מביט בתמונת ה׳ א״כ למה שאל הראני נא את כבודך. אמנם עיקר התירוץ לזה הוא שיש הפרש בין לשון תמונה לבין לשון כבודך. והוא כי תמונה הוא כאדם הרואה באישון לילה ואפילה דבר מה העומד בקרן זוית שכנגדו ומסיבת חשכת הלילה אינו יכול להכירו ולבררו על נכון אם היא חבית או בן אדם זהו נקרא תמונה וכמ״ש באיוב (סי׳ ד׳) ורוח על פני יחלף תסמר שערת בשרי יעמד ולא אכיר מראהו תמונה לנגד עיני וכו׳. כן מרע״ה לא היה צופה ומביט כי אם בתמונת ה׳ בלבד וזהו ותמונת ה׳ יביט. וגדלה מעלתו על כל ישראל שאפילו מעמד הר סיני הנכבד נאמר בהם ותמונה אינכם רואים זולתי קול. ולכן כשראה עת רצון שאל מה׳ הראני נא את כבודך שרצה לראות בבירור את השכינה כמו שהיא. והשיב לו הקב״ה כי לא יראני האדם וחי. ועיין עוד לעיל [...] ואתא לידן נפרש ג״כ מהו אספקל
