ריא המאירה ואספקלריא שאינה מאירה וזה יובן במה שאמר הפסוק אם יהיה נביאכם ה׳ במראה אליו אתודע וכו׳ לא כן עבדי משה וכו׳ ומראה ולא בחידות וכו׳. כי יש הפרש בין מראה בניקוד קמץ ובין מראה בניקוד סגול כי מראה בניקוד קמץ היא הזכוכית המצופה מאחוריה בכסף חי שבו רואים[?] הנשים את פניהם שאין האדם יכול לראות את הדבר שבאחוריה כי הצפוי היא מעכב עליו ולכן אין קובעין אותה בחלונות שבחדר כי היא מעכבת את האור מליכנס לחדר וע״כ היא נקראת אספקלריא שאינה מאירה. אבל מראה היא הזכוכית שמשימים בחלונות שאינה מצופה מאחוריה כדי שלא לעכב את האור מלהכנס ולכן נקראת אספקלריא המאירה. והנה מרע״ה היה רואה את [...] הזאת בהפסק פרגוד בינו לבין השכינה ואותו הפרגוד היה כדמיון זכוכית שאינה מצופה מאחריה וזכה להביט בתמונת ה׳ בהפסק הפרגוד ההוא ששם עומדת השכינה ממש. ושאר הנביאים היו רואים את דמיון התמונה בזכוכית המצופה שבאמת אין בזכוכית ההיא כלום רק היא מעתקת את דמות התמונה שבעולם העליון ואותו ההעתק הוא דמות התמונה העליונה. והיא נקראת דמות[?] ולא תמונה וכמ״ש וביד הנביאים אדמה. והיינו אמר יחזקאל ודמות החיות וכו׳ דמות הכסא וכו׳ דקרי ליה בשם דמות ולא בשם תמונה. וכן דכתיב מי תדמיוני ואשוה וכו׳ ומה דמות תערכו לו. ועי״ע בהרב אהל יעקב [...] בהעלותך:"]}]}, {"title": "פרשת ויקהל", "chapters": [{"id": "s57", "n": 57, "title": "בו יבואר ענין מלאכת שבת וענין הדלקת החשמל ועישון הסיגארא", "paras": ["לא תבערו אש בכל משבתיכם ביום השבת. הנה כל הל״ט מלאכות שבת שאסור לאדם לעשות אותם אין שום חילוק בין אם יש טורח במלאכה ההיא ובין אין שום טורח במלאכה ההיא כגון התולש עשב קטן וכן השופך מעט מים נשתיירו בכוס השתיה שבידו על הזרעים. וכן בעל הבית שהושיט ידו ובה פרוסת לחם והוציאה מרשות היחיד ונתנה ביד העני העומד בחוץ ברשות הרבים וכיוצא אעפ״י שכל אלו אין בהם שום טורח כלל הרי אלו חייבים סקילה בב״ד כעושה מלאכה שיש בה טורח גדול. צא ולמד מהמקושש עצים שהיה בזמן מרע״ה שאעפ״י שהיה עושה מלאכה קלה שאין בה שום טורח אמר ה׳ רגום אותו באבנים. ועל זה ידוו כל הדווים כי יש כמה אנשים ונשים שמדליקין ומכבים את החשמל[?] וכן מחככין את עצי הגפרית לעשן אש הסיגארא ונותנים טעם לפגם באומרם כי לא אסרה תורה כ״א מלאכה שיש בה טורח. יבואו נא אותם הבוערים בעם ויודיעונו מאיזה פסוק למדו חילוק זה. ואיך סומכים על דעתם לעשות חילוק עצום[?] זה מעצמם ומכניסין נפשם בסכנת סקילה מבלי שאול את פי מורה צדק. לו חכמו ישכילו זאת כי הלא כל טעם שמירת שבת הוא משום שבו שבת אלהים מכל מלאכתו והוא לא היה לו שום טורח בבריאת העולם כי בדבר ה׳ שמים נעשו וברוח פיו כל צבאם. וא״כ עיקר צווי השבת הוא על מלאכה שאין בה שום טרחא דוגמת שביתתו ית׳ וכל שכן במלאכה שיש בה טרחא. ואלו האנשים הם עתידים ליתן את הדין ואשם לא תכבה לעת״ל אם אינם שומעים לקול מוריהם ועושים תשובה גמורה:"]}]}, {"title": "פרשת שמיני", "chapters": [{"id": "s58", "n": 58, "title": "בו יבואר ענין מי שמברך לחבירו שצריך להניח את ידו עליו", "paras": ["וישא אהרן את ידיו אל העם ויברכם. מכאן מוכח שראוי להמברך את חבירו להניח את ידו על ראש המתברך. שהרי לא הספיק לאהרן קדוש ה׳ לברך את ישראל בלא נשיאות כפים למעלה מעל ראשי העם. רק מפני שהיה קהל גדול לא היה אפשר להניח ידו על כל א׳ וא׳ מהם. וכן מצינו ביעקב אע״ה כשברך את מנשה ואפרים הוצרך לשכל את ידיו ולא ברך אותם בהיותם רחוקים ממנו. וגדולה מזו מצינו שנאמר בכביכול עצמו אבוא אליך וברכתיך ולא היה די במה שיברך אותו ממכון שבתו. כי בזה יהיה מקום מוכן לחול הברכה ולפעול פעולתה כראוי ולא תהיה ברכה לבטלה.", "וכן ראוי לעשות לאדם החולה להניח את ידו על מקום החולי ושם יתפלל על החולה. שהרי מצינו שהקפיד נעמן על שלא הניח אלישע ידיו עליו כמ״ש ויקצף נעמן וילך ויאמר הנה אמרתי אלי יצא יצוא ועמד וקרא בשם ה׳ אלהיו והניף ידו אל המקום ואסף המצרע. גם מזה מבואר שזה היה מנהג קדום נודע לכל אדם להניח המתפלל את ידו על מקום החולי ומניפה גם על הצדדים של מקום החולי בעת שמתפלל ולכן קצף נעמן והלך. ומה שלא עשה אלישע כן לפי שהיה נעמן מצורע שהוא טמא ולא רצה אלישע ליגע בו פן תסתלק ממנו השכינה. גם אלישע עצמו אמר לגחזי ושמת משענתי על פני הנער ולא היה די לאלישע להתפלל עליו ממקומו בלא שליחות המשענת. ומה שלא הלך אלישע עצמו אצל הילד לפי שהיה מקום רחוק כמו שאמרה השונמית לבעלה שלחה נא לי אחד מן הנערים ואחת האתנות וכו׳. (ומה שאמרה ואחת האתנות לפי ששורת הדרך ארץ לרכוב האשה על האתון והאיש על החמור וכמ״ש באברהם ויחבש את חמרו. וכן אמר מרע״ה לא חמור אחד מהם נשאתי. וכן עני ורכב על חמור. ולפי שהיה בלעם רוכב על האתון ארז״ל שהיה רובע אותה). גם בבוא אלישע לבית השונמית נשתטח על גוף הנער עצמו ולא הספיק לו להתפלל עליו בריחוק מקום לפי שדיבוק אבר המתפלל באבר החולה קונה לו האבר ההוא קדושה ורפואה ולפי שכל אברי הילד היו מתים לכן נשתטח על כל אבריו וכן עשה אליהו ז״ל לבן הצרפית. ולא חששו לטומאת מת כי היו בטוחים שיחיו. וכן כאשר השליכו את המת בקבר אלישע ונגע המת בעצמות אלישע אז חיה ועמד על רגליו ואם לא היה נוגע בו לא היה חי בלי ספק. הרי כי הנגיעה היא דבר גדול וכן ענין השתטחות שעל קברי הצדיקים שעניינה הוא לשכב על הקבר ממש ולכוין איבריו כנגד אברי המת שבקבר פניו כנגד פניו וידיו כנגד ידיו ורגליו כנגד רגליו שימשך כח בעצמות[?] המת ע״י שמות הקודש שמכוין[?] בהם כמבואר בש׳ רוה״ק ד״ט ע״ב ודל״ט[?] ע״ב ואי אפשר בלא השתטחות.", "וכ״ז שאמרנו שצריך המברך להניח [...] על המתברך או על החולה במקום החולי כל זה הוא אם אינו ניזוק. ואין צריך לומר אם הוא ניזוק משדין ורוחין כי אז לא יועיל אם לא יניח[?] ידיו על אבר הניזוק כמו שמצינו בענין מהרח״ו ז״ל כשניזק ונעקם פיו ושפתיו משדין ורוחין. ועוד כתב שם כי מדי עוברו על קבר [...] נגע האר״י ז״ל בפיו ובשפתיו בכוונה ידועה אצלו שלשה ימים בכל בקר ונתרפא. וכן כתב בשער רוה״ק דל״א בענין מי [...] ניזק בכל אבריו והיה כמת והביאוהו לבית האר״י ז״ל והכניסו לחדרו ואח״כ [...] נכנס לחדר הוא לבדו ונגהר עליו (פי׳ שכב עליו כמו ויגהר ארצה הנז׳ במלכים א׳ סי׳ י״ח פסוק מ״ב) ונתרפא יעו״ש. [...] בשער הגלגולים דס״ג ע״ב [...] שנכנס בו רוח רעה [...] שיתפוש בזרוע האיש שיש בו רוח רעה וכו׳ יעו״ש. ומה שלא כתב שיתפוש באבר שהרוח עומד שם [...] שאין הרוח הוא עומד באבר א׳ אלא הוא מדלג מאבר לאבר וממקום למקום יעו״ש ולא הספיק בלא תפישה [...] בחר לו הרב ז״ל לתפוש בדפק האיש ההוא. גם במסכת ברכות אמרינן הב לי ידך יהב ליה ידיה ואתסי. גם בגמרא שבת דס״ז ע״א אמרינן מי שעמד עצם [...] מביא מאותו המין ומניח על קדקדו וכו׳ יעו״ש. מכל זה מבואר שעיקר התפלה על הניזוק או על החולה צריכה להיות יד הלוחש מונחת על מקום החולי. ואל יחוש כשלוחש על הנשים פן יבוא לידי הרהור כי הוא עסוק במלאכתו וכבר ארז״ל התירו[?] למרביעי בהמה להכניס כמכחול בשפופרת ולא חיישינן להרהור מפני שהם עסוקים במלאכתם:"]}]}, {"title": "פרשת תזריע", "chapters": [{"id": "s59", "n": 59, "title": "בו יבואר פי׳ זכר שאמרו רז״ל זה כר. מהו פירוש זה כר", "paras": ["אשה כי תזריע וילדה זכר. אז״ל למה נקרא זכר זה כר. אם כוונת רז״ל לומר שהוא מלשון כרים וכסתות [...] וכן [...] לא יתכן אדרבא האשה היא נעשית כר לבעלה. [...] ונלע״ד שפי׳ זה כר הוא [...] כלו׳ [...] (ישעיה ל׳) [...] ועוד[?] יש לפרש זה כר הוא מלשון כי יכרה איש בור. כי הזכר הוא [...] את הנקבה ועושה אותה כלי בביאה ראשונה [...]"]}, {"id": "s60", "n": 60, "title": "בו יבואר ענין העינוי הנז׳ בתורה שהוא ג׳[?] מיני עינוי", "paras": ["אך בעשור לחדש השביעי הזה יום הכפורים הוא מקרא קודש יהיה לכם ועניתם את נפשותיכם. דקדק לומר נפשותיכם ולא אמר ועניתם את עצמכם. ועוד[?] אמר כי כל הנפש אשר לא תעונה ולא אמר כי כל אדם אשר לא יעונה. כדי שלא[?] נטעה לומר שעינוי זה אינו צום אלא הוא כסברת הקראים שיצטער את עצמו[?] בטלטול אבנים ממקום למקום וכיוצא בזה שהוא עינוי הגוף לזה אמר ועניתם נפשותיכם. ר״ל את הדם שלכם כי הדם הוא הנפש. שעל ידי התענית מתמעט חלבו ודמו. וכן הוא אומר עניתי בצום נפשי. אבל בעינוי הגוף אינו אומר כמו ענה בדרך כחי וכו׳ וכי התענית בכל אשר התענה אבי. ויש עינוי אחר שהוא ענין האונס כמו וישכב אותה ויענה. שר״ל אנס אותה ולא פתה אותה בדברים עד שהיתה נשמעת לו מרצונה. וכן תחת אשר ענה לא יוכל שלחה כל ימיו. וכן אשר ענה את אשת רעהו. וכן לא תתעמר בה תחת אשר עניתה וכו׳. כל אלו הם לשון אונס הוא ובכולם לא הוזכר נפש:"]}]}, {"title": "פרשת אמור", "chapters": [{"id": "s61", "n": 61, "title": "בו יבואר ענין ויקב בן האשה הישראלית. ומה שכתב עליו בזוה׳", "paras": ["ויקב בן האשה הישראלית את השם ויקלל. פי׳ הזכיר בפיו את שם הויה ב״ה וקללו. ועיין בזוהר אמור דק״ו ע״א על פסוק זה שכתב וז״ל אי אינצו (פי׳ נתקוטטו) הכא כחדא. מאי קא בעי הכא שמא קדישא. אלא איש הישראלי אמר מלה מאמיה מגו קטטה. מיד ויקב בן האשה הישראלית. כמה דאת אמר ויקב חור בדלתו. רזא דמלה נטל ה׳ דשמא קדישא ולייט (פי׳ וגדף) לאגנא על אמיה וכו׳ ולמחצדי חקלא אתמר ורזא דמלה כן דרך אשה מנאפת וכו׳. וע״ד כתיב ריבך ריב את רעך וסוד אחר אל תגל. ה׳ בתראה הות נוקבא דינקא בתרין סטרין (חסדים וגבורות) בגין כך נטלא זיינין דמלכא ונקמת נקמתא וכו׳. פי׳ כי בן הישראלית נקב את אות ה׳ האחרונה וגדף שאמר וכי תווהא איהו אם זנתה אמו והלא גם הנחש הוא בא על חוה ואמר כן כדי להגין על אמו. והבין הענין כפשוטו ח״ו ולכן ה׳ בתראה נטלת נוקמא מניה. ומזה נדע כמה חכמים גדולים היו דור המדבר עד שאפילו הרשע הזה כל סתום לא עממוהו אלא שהפושעים יכשלו בם. וראיתי בחלום כי איש המצרי הזה נתגלגל אח״כ בשמשון בן מנוח. ואח״כ בנוצרי שהיה הוגה את השם באותיותיו ואומר על עצמו וממצרים קראתי לבני על שעיקרו היה בן איש מצרי וגם הוא היה בן אשה זונה ולכן גם הוא וגם שמשון שניהם לא מתו מיתת עצמם:"]}]}, {"title": "פרשת חוקת", "chapters": [{"id": "s62", "n": 62, "title": "בו יבואר ענין פרה אדומה לפי פשוטו של מקרא. וענין מטהרת את הטמא ומטמאה את הטהור", "paras": ["דבר אל בני ישראל ויקחו אליך פרה אדומה תמימה אשר אין בה מום וכו׳. לפי פשט הכתוב שאמר פרה אדומה כדי לאפוקי מין השני השחורים שהם פרות הגדולים כמו שאמרו רז״ל שור שחור ביומי ניסן. ואינו ר״ל שלא ימצא בכל גופה שערות לבנות או שחורות וכיוצא בזה. ומ״ש הכתוב תמימה אינו ר״ל תמימה באדמימות [...] חז״ל אלא ר״ל שאין בה מום וכפל הענין במלות שונות [...] בפ׳ אמור שכפל הענין שאמר תמים יהיה לרצון כל מום לא יהיה בו. והנה רבים תמהו על אפר הפרה שהוא עושה שני הפכיים בנושא אחד שמטהרת את הטמא ומטמאה את הטהור המזה את מי החטאת. ונלע״ד לקרב הענין מעט אל השכל והוא כי הבורא ב״ה נתן סגולה באפר הפרה באופן שכל מי שנוגע בשיעור הזאה יהיה טמא טומאת ערב. ולכן היא מטהרת את הנוגע במת ועושה אותו טומאת ערב. וכן מטמאה את הטהור לעשותו טומאת ערב. וכענין זה נמצא גם בסמים של הרופאים שיש סם שאם ישתה אותו הבריא יחלה ואם ישתה אותו החולה יבריא:"]}, {"id": "s63", "n": 63, "title": "בו יבואר אם זכות הצדיקים שנפטרו מעוה״ז יועיל לחיים אם לאו", "paras": ["ותמת שם מרים וכו׳ ולא היה מים לעדה וכו׳. ארז״ל מתה מרים נסתלק הבאר. מת אהרן נסתלקו ענני כבוד וכולם חזרו בזכות משה. מת משה נסתלקו שלשתם. מזה מבואר שאין זכות צדיקים הנפטרים תועיל להגין על הדור אחרי פטירתם. מלבד זכות האבות שתועיל לבניהם אחריהם עד עולם מפני השבועה שנשבע להם. וכמו כן תועיל זכות דוד מלך ישראל לבניו אחריו מפני השבועה שנשבע לו כדכתיב נשבעתי לדוד עבדי עד עולם אכין זרעך וכו׳ [...] לתת לו ניר לבניו כל הימים:"]}]}, {"title": "פרשת בלק", "chapters": [{"id": "s64", "n": 64, "title": "בו יבואר למה בחר בלק לקלל את ישראל ולא בחר שהוא יבורך שיצלח", "paras": ["ועתה לכה נא ארה לי את העם הזה וכו׳ כי ידעתי את אשר תברך מבורך ואשר תאור יואר. יש לדקדק למה לא אמר את אשר תברך יבורך שהוא לשון עתיד כמו ואשר תאור יואר. אמנם היה יודע בלק כי בלעם הוא רע מאד כי בלעם יש לו כח גדול להרע ואין לו כח גדול להטיב. אבל אין כח בברכתו לחול על האדם אם לא שהיה מבורך מכבר מפי אחרים כדי שתמצא ברכתו מקום ויש כח בקללתו שתחול אפילו על אדם שאינו מקולל מכבר. והוצרך בלק להודיע לבלעם חילוק זה כדי שלא יקשה בלעם על [...] בלק [...] למה זה שלח אחריו לקלל את העם כמ״ש ועתה לכה נא ארה לי וכו׳ וכי לא שלח אחריו לברכו שיצליח על מזלו [...] ישראל. משום הכי אמר לו הטעם לפי שידעתי את אשר תברך צריך [...] מבורך מכבר ואני קים לי בעצמי שאין[?] אני מבורך מכבר וא״כ מה הועיל [...]. אבל ואשר תאור יואר מחדש. וא״כ הקללה היא יותר בטוחה לחול מתחלתו. ובלעם התבונן ודקדק בדברי בלק והיו דברי בלק כסכין בלב בלעם וכמס אותם בלבו לעת מצוא [...] להפרע מן בלק על דבריו אלה. ואח״כ [...] הברכה [...]. ולכן [...] בלעם אצל בלק ואמר לו לקלל את ישראל א״ל בלעם מה אקב לא קבה אל [...] מאחר שלא קבה אל [...] שאין אני יכול לקלל את אחרים אם לא שיהיו מקוללים מכבר וא״כ מה אקב [...]. ולכן כאשר ברך בלעם את ישראל היה צער גדול לבלק [...] הלא עם בני ישראל הם מבורכים מפי הגבורה כמ״ש כי ברוך הוא וא״כ בלא ספק[?] תחול ברכת בלעם עליהם:"]}, {"id": "s65", "n": 65, "title": "בו יבואר איך האתון היא מתלוצצת על בלעם שנשברה רגלו", "paras": ["ויפתח ה׳ את פי האתון ותאמר לבלעם מה עשיתי לך כי הכיתני זה שלש רגלים. מה שאמרה האתון זה שלש רגלים ולא אמרה שלש פעמים יש לפרשו בדרך צחות כי הנה ארז״ל שע״י שלחצה האתון את רגל בלעם אל הקיר נעשה חיגר באחת מרגליו ולכן כאשר פתח ה׳ את פי האתון אמרה לבלעם מה עשיתי לך וכו׳ ותיבת כי [...] ר״ל לפי שהכיתני. כמו כי התעללת. [...] רגלים [...] [...] וזהו שאמר לו: זה שלש [?] רגלים, כי המקל שהכיתני בו בתחלה יהיה לך לרגל [?]. [...]", "קשה, כי מאחר שכתוב [בפרשת מטות] וכל אשה יודעת איש למשכב זכר הרוגו, א״כ למה לי למשכב זכר. [...] אפילו שלא כדרכה הרוגו [?]."]}]}, {"title": "פרשת דברים", "chapters": [{"id": "s66", "n": 66, "title": "בו יבואר ענין שאין מענישין ב״ד של מעלה פחות מבן כ׳ שנה", "paras": ["ובניכם אשר לא ידעו היום טוב ורע המה יבאו שמה. [...] וזהו דווקא בחייו, שאין מענישין ב״ד של מעלה פחות מבן כ׳ שנה [?]. אבל אחרי פטירתו מענישין אותו אפי׳ על חטא שחטא בהיותו פחות מי״ג שנים, כנראה מלשון שער הגלגולים סוף הקדמה ל״א בענין יוסף שהביא דבה רעה בהיותו בן י״ז שנה. ועי״ע שם בהקדמה ל״ח דף כ״ב סע״א, שהרב ז״ל נתן תיקון למהרח״ו ז״ל שיתענה ג׳ ימים רצופים לילה ויום לפני השבועות על שהכה את אמו בהיותו קטן."]}]}, {"title": "פרשת ואתחנן", "chapters": [{"id": "s67", "n": 67, "title": "בו יבואר כי מאחר שאמרה התורה לא תוסיפו על הדבר, א״כ איך הוסיפו רבנן כמה מצות על התורה, ואיך העובר על דברי חכמים יהיה חייב מיתה", "paras": ["לא תוסיפו על הדבר אשר אנכי מצוה אתכם ולא תגרעו ממנו. קשה, א״כ איך הוסיפו רבנן כמה מצות הנקראים מצות דרבנן. אך הענין הוא דומה לרופא אחד שכתב כמה מיני סמנים לחולה, וצוה עליו לקנותם ולשחוק אותם ולבשלם ולשתות את מימיהם כף א׳ בבקר וכף א׳ בערב, וצוה עליו שלא יחסר כלום מהסמנים ולא יוסיף עליהם ועל משקלם, כי גורם שיכבד עליו החולי ואפשר שיבוא לידי סכנה. והחולה קנה אותם כאשר צוהו הרופא, ושחקם ובשלם ונתן את מימיהם בקנקן להיות שמורים שלא ישפכו. ושם בבית החולה היה נמצא איש א׳ בעת צוות הרופא את החולה על הסמנים. ויאמר האיש ההוא אל החולה: הלא צוה הרופא שלא להוסיף על הסמים כלל, ואיך נתת אותם בתוך הקנקן. א״ל החולה: הוי פתי, היה לך לתת לב כי אין הקנקן מכללות הסמים, אלא הוא שומר הסמים שלא ישפכו. והרופא לא הוצרך לצוות עלי להניח את הסמים בקנקן, כי הוא יודע שאני מעצמי מוכרח לעשות כן.", "כן הענין במצות התורה, כי לא צוה ה׳ שלא להוסיף ושלא לגרוע כ״א בעיקר הסמים שהם מצות התורה, כגון ד׳ מינים שבלולב וד׳ ציציות שבד׳ כנפות וד׳ בתים שבתפלין, שלא לעשותם ה׳ או ג׳. וכן ז׳ ימי החג וז׳ נקיים, שלא נעשה אותם ח׳ או ו׳, וכיוצא בזה. כי לא הוסיפו רז״ל על גוף המצוה עצמה, רק עשו משמרת למצות כקנקן הזה שהוא שומר להסמנים שלא ישפכו, והם הגדרים והסייגים שעשו רז״ל, כגון שלא יתייחד אדם עם אשת חבירו אם אין הדלת פתוח, ושלא יגע באשתו נדה שמא יבוא לידי איסור, וכיוצא בזה. וסמכו דבריהם על מ״ש בתורה ושמרתם את משמרתי, עשו משמרת למשמרתי.", "ובזה יתורץ מה שיש להקשות, והוא כי אמרו רז״ל כל העובר על דברי חכמים חייב מיתה. דלכאורה קשה, והלא אפילו העובר על דברי תורה עצמה אין בכולם חיוב מיתה כ״א בעוברו על מצות החמורות בלבד, ואיך בעובר על דבריהם, אפילו על הקלות שבהם, יהיה חייב מיתה. אבל למ״ש ניחא, כי העובר על דבריהם הרי הוא כנוקב את הקנקן שהסמים נתונים בתוכו, כי מעתה כל הסמים שבו הם מעותדים לזוב, כי פרץ את גדר המשמרת, ומעתה יבוא לעבור על כל המצות באין מעצור כלל, ולכן הוא חייב מיתה.", "ושמעתי ששאלה זו שאל המלך מהרב יונתן ז״ל המחבר ספר כרתי ופלתי, והשיב למלך: וכי לא יש כזה בחוקי המלכים, והלא ההורג את הנפש אין השופטים פוסקים את דינו להריגה תכף ומיד אלא לאחר כמה בדיקות ויגיעות רבות מאד, ואלו אם יכנס אדם לחצר המלך שלא ברשות שומר הפתח, אז יש רשות לשומר הפתח לחתכו בחרב לשנים, ואיה השופטים שהוציאו את דינו של זה להריגה. אמר לו המלך: אם נמנה שופטים על דבר זה, א״כ צריך להניח את כל עסקי העולם ולעסוק רק בדין הנכנסין שלא ברשות. אמר לו רבי יונתן ז״ל: כן הענין שאמרו החכמים ז״ל, יען כי כל דבריהם אינם כ״א משמרת לדברי התורה, והם כשומר העומד בפתח, ולכן כל העובר על דבריהם הרי זה חייב מיתה."]}, {"id": "s68", "n": 68, "title": "בו יבואר מי היא זו הנקראת עו״הב, ואימתי הוא זמנה, ואם תשלום הגמול של הצדיקים הוא בג״ע או בעו״הב, ומה יתרון יש לגוף הצדיק שבלה את ימיו בעסק התורה והמצות מאחר שגם הוא שוכב בקבר כגוף הרשע באין הפרש, ואימתי הוא זמן מלך המשיח מאחר שלא נשאר משתא אלפי דהוי עלמא רק מעט בשנים, ומה נעשה בנשמות וגופות הצדיקים בזמן שהעולם חרב, ואם עתיד הקב״ה לחדש אח״כ את עולמו", "paras": ["ושמרת את המצוה וכו׳ היום לעשותם. פי׳ רש״י ז״ל: היום לעשותם, ולמחר לעו״הב ליטול שכרם, עכ״ל. כי שכר מצות בהאי עלמא ליכא, כדאמרינן בסוף חולין הרי שאמר לו אביו עלה לבירה וכו׳, יעו״ש.", "ודע כי עו״הב שכתב רש״י ז״ל ששם נוטל שכרם, הוא על זמן תחיית המתים, שהיא הנקראת בשם עו״הב או בשם לעת״ל, כדתנן בפ״ו דאבות: בשכבך תשמור עליך – בקבר, והקיצות היא תשיחך – לעו״הב. מבואר מזה שהקיצה מן השכיבה בקבר, שהיא התחיה, קרי לה עו״הב. והכי נמי אמרינן בסנהדרין ד״צ ע״א: ואלו שאין להם חלק לעו״הב, האומר אין תחיית המתים מן התורה וכו׳. ואמרינן עלה בגמרא: וכל כך למה, תאנא, הוא כפר בתחיית המתים לפיכך לא יהיה לו חלק בתחיית המתים. מבואר מזה דעו״הב הנזכר במשנה מפרש בברייתא שהוא על זמן תחיית המתים. וכן משמע ממ״ש שם בד״צב ע״א: אמר רבא מנין לתחיית המתים מן התורה, שנאמר יחי ראובן ואל ימות וכו׳, יחי בעו״הז ואל ימות בעו״הב. והכי נמי אמרינן על חזקיהו מלך יהודה: כי מת אתה ולא תחיה וכו׳, וארז״ל אמר לו ישעיה: כי מת אתה בעו״הז ולא תחיה לעו״הב וכו׳. מכל מקומות אלו מבואר דעו״הב היא עולם התחיה.", "וכמ״ש רש״י: ולמחר לעו״הב ליטול שכרם, נטילת שכרם של מצות הוא בעו״הב, ושם הוא התשלום הגמול העיקרי, ולא בג״ע. כי ג״ע אינו עשוי כ״א לשמור את נשמות הצדיקים אשר שם עד שובם להחיות ולחזור לגופם אשר עזבו בקבר בעו״הז, כי גם הארץ היא שומרת את עצמות גופם עד אשר ישובו לחיות. ואין בג״ע תשלום גמול ושכר מצות, כי מה שכר יש לגוף הנקבר על מה שטרח כל ימיו בתורה ומצות ביחד עם הנשמה. וכי זהו תשלום הגמול, שנשאר כמה שנים בקבר ואח״כ חוזר לעפר. וכי זו תורה וזו שכרה, והלא גם גופי הרשעים הם שוכבים בקבר באין הפרש. אבל באמת עיקר תשלום השכר והגמול של המצות הוא בעו״הב, שהוא בזמן תחיית המתים, שאז באותו זמן גם הגוף הוא מחובר עם הנשמה, ושניהם הם מקבלים השכר ביחד, כמו שקיימו את המצות ביחד. ומטעם זה אין קיבול השכר אלא בעו״הב, מפני שגם הגוף יטול שכרו.", "ועוד אפשר ליתן טעם אחר על מה שאין קבלת שכר המצות בג״ע, והוא משום דקי״ל אין השכירות משתלמת אלא בסוף. ולכן כל זמן שהתורה והמצות נוהגים בעולם, אין הצדיקים נוטלים שכרם אחרי פטירתם, כי אולי ישובו בגלגול על חיסור איזה מצוה. אבל לעת״ל בזמן תחיית המתים, שאז יתבטלו המצות מכל וכל, כמ״ש במסכת נדה ד״סא ע״ב גבי כלאים בבגד המת שהוא מותר, דקאמר עלה רב יוסף: זאת אומרת מצות בטלות לעת״ל. וכתבו התוספות ז״ל: שאעפ״י שכשיחיה לעתיד יעמוד במלבושו שנקבר בו [?]. וכ״כ רש״י ז״ל במסכת ע״ז ד״ד ע״ב על מאי דאמרינן התם: היום לעשותם, ולא למחר לעשותם וכו׳, ופי׳ רש״י ז״ל דאין מצות לעתיד, עכ״ל. לכן עד זמן התחיה [?] הוא סוף גמר מלאכתם, ואז מתחיל אח״כ תשלום הגמול כדאמרן.", "וטעם שהמצות בטלות לעת״ל נלע״ד, לפי שלא ניתנו התורה והמצות כי אם כדי לצרף בהם את הבריות, כמ״ש רז״ל ע״פ אמרת אלוה צרופה, וכמבואר במ״ח [?] בפ״א דש״כו, ובש׳ הגלגולים ריש הקדמה ד׳, ובהקדמה י״א די״ג ע״ב, יעו״ש. וכיון שנצטרפו הבריות ונבדלו הזוכים לעו״הב ממי שאינם זוכים, כמ״ש במסכת ר״ה ד״טז ע״ב שלשה כתות ליום הדין וכו׳, יעו״ש, תו לא צריכין התורה והמצות. ואעג״ג דקי״ל [?] שהתורה לא תשתנה בשום זמן ח״ו, אין זה מקרי שינוי, כי כבוד תורה במקומו מונח ולא נעשה בה שום שינוי, רק שהצדיקים נעשו חפשים ממנה כיון שמתו, דאמרינן כיון שמת אדם נעשה חפשי מן התורה ומן המצות. ואעג״ג שחזרו וחיו, אינם חייבים עוד, כיון שכבר נצטרפו.", "וזה תשלום הגמול המעותד לצדיקים לעת״ל אינו מושג ונודע כלל, ועליו נאמר עין לא ראתה אלהים זולתך, כי הוא רוחני ואינו גשמי. ועליו אמרו בגמרא ברכות די״ז: עו״הב אין בו לא אכילה ולא שתיה, אלא צדיקים יושבים ועטרותיהם בראשיהם ונהנים מזיו השכינה, יעו״ש. ואעפ״י דאמרינן לעיל שהצדיקים שבעו״הב הם בגוף ונפש, עכ״ז גופם מתקיים מהנאת זיו השכינה, כמו שנתקיים גוף מרע״ה בעומדו בהר סיני מ׳ יום ומ׳ לילה, וכמו שאמר בפ׳ משפטים [?] ויחזו את האלהים ויאכלו וישתו, ותרגם אונקלוס: והוו חדן בקורבנהון דאתקבלו ברעוא כאילו אכלין ושתן [?]. שהרי גם גופם של צדיקים הוא יגע וקיים התורה והמצוה כמו נשמתם, ולכן גם הוא נוטל שכר טוב בעמלו שנהנה מזיו השכינה כמו הנשמה [?].", "[...] וכבר השיג עליו הראב״ד ז״ל [?] בפ״ח מהל׳ תשובה [...] וסבר שגם עו״הב [...] כי מ״ש בגמרא ברכות דעו״הב אין בו [אכילה ושתיה] היא אבל בעו״הב [...] ושם אין גוף רק נשמות לבד [?]. [...]", "יש לשאול, והוא כי מאחר שעו״הב, שהוא תחיית המתים כדאמרן, נעשה קודם אלף הז׳, כדמשמע ממסכת סנהדרין דצ״ב דקאמר [...] שעתיד הקב״ה לחדש בהם את עולמו [?] ולחזור אותם לחדושם הא׳ שהיו תהום ומים (שנאמר ונשגב ה׳ לבדו ביום ההוא), שלא יהיה רק ה׳ לבדו ביום ההוא, כי יומו של הקב״ה הוא אלף שנים, וזהו ביום ההוא. וכדאמר רב קטינא שם בדצ״ז ע״א: שית אלפי שנה הוו עלמא וחד חרוב, שנאמר ונשגב ה׳ לבדו ביום ההוא. (צדיקים מה הם עושים), כלו׳ היכן הם עומדים מאחר שאין ארץ, (הקב״ה עושה להם כנפים כנשרים ושטין ע״פ המים, שנאמר על כן לא נירא בהמיר ארץ וכו׳), יעו״ש. מבואר מזה כי תחיית המתים היא קודמת לאלף הז׳ שהוא בהמיר ארץ, וזמן מלך המשיח הוא קודם לתחיית המתים. כי בזמן מלך המשיח עדין הקרבנות נוהגים, כמו שאנחנו אומרים בתפלת המוספין, ועדין יש אכילה ושתיה, שתוציא הארץ גלוסקאות, כי אין בין עו״הז לימות המשיח רק שעבוד מלכיות בלבד, וכמבואר בש׳ הגלגולים הקדמה י״א, וע״ע בספר בני אהרן שם אות ל״ה. וכן אנחנו אומרים בברכת המזון: הרחמן הוא יחיינו ויזכנו ויקרבנו לימות המשיח ולחיי העו״הב. כי בתחלה יהיו ימות מלך המשיח ואח״כ יהיה עו״הב. ומאחר שחיי עו״הב קודם אלף הז׳ כדאמרן, א״כ כל שכן שיהיה זמן ימות המשיח קודם אלף הז׳.", "ומעתה יש לשאול: והלא בעו״הר עבר עתה מאלף הששי תרצ״ג שנים, ולא נשאר בידינו רק ש״ז שנים, ועדין אפי׳ למשיח לא זכינו, וא״כ אימתי ימלוך מלך המשיח ואימתי יהיו חיי עו״הב. וע״ע בספר הברית ח״ב במאמר י״ב פ״ג [?], שהקשה שם קושיא זו ותירץ ע״פ מ״ש הרב המפרש שעל ספר התמונה, שלעת״ל יתארכו הימים והלילות, כי בכל ז׳ ימים ישנה השמש מהלכו וישהה בכל הקפה [...] מאשר היה בשבוע שלפניו, וכן יוסיף תמיד בסוף ז׳ ימים, יעו״ש.", "ואני בעניותי דחיתי דבריו בספרי בית [?] יהודה שעל עץ החיים בפ״ב דשל״ו [?] בד״ה אמנם הבחי׳ הז׳ וכו׳, ושם כתבנו תירוץ אחר, והוא כי רב קטינא לא אמר שית אלפי שני הוו עלמא וכו׳ כי אם על העו״הז בלבד, ולא על ימות המשיח, וכ״ש שלא אמר על עו״הב, כי שניהם אינם מכלל עו״הז. דהכי מוכח ממימרא דשמואל בברכות ד״לד [?], דאמר: אין בין העו״הז לימות המשיח אלא שעבוד מלכיות בלבד וכו׳. ומדקאמר אין בין העו״הז, ולא קאמר אין בין הזמן הזה לימות המשיח וכו׳, נראה מזה שימות המשיח אינם מכלל עו״הז. והכי נמי מוכח ממאי דאמרינן: וחכמים אומרים ימי חייך – העו״הז, כל ימי חייך – להביא לימות המשיח.", "וטעם שלא הכניסו רבנן ימות המלך המשיח בכלל עו״הז שהוא שתא אלפי שנה, היינו טעמא משום דלא פסיקא להו לרבנן כמה שני הוו זמן מלך המשיח, כי הוא מחלוקת התנאים והאמוראים, כדתנן בסנהדרין דצ״ט ע״א: רבי אליעזר אומר ימות המשיח מ׳ שנה. רבי אלעזר בן עזריה אומר ע׳ שנה. רבי אומר ג׳ דורות. רבי דוסא אומר ת׳ שנה. רבי אומר שס״ה שנה. תני אבימי ימות המשיח ז׳ אלפי שנה. רב יהודה אמר שמואל ימות המשיח כמיום שנברא העולם ועד עכשיו. (פי׳ עד היום שיבוא) [?]. רב נחמן אמר כמימי נח ועד עכשיו, יעו״ש. לכן משו״ה לא הכניסו רז״ל את זמן ימות המשיח בכלל עו״הז, וכ״ש את שנות עו״הב הבאה אחר זמן מלך המשיח. ואמרו שתא אלפי שני הוו עלמא וחד חרוב, כאלו חד החרוב הוא בא סמוך לאחר אלף הששי, ואין ימות המשיח ועו״הב מפסיקין ביניהם.", "ודבר זה הוא דומה לז׳ העולים לס״ת ביום השבת, שהגולל ס״ת הוא נקרא שביעי. כי אעפ״י שיזדמן לפעמים כמה אורחים עולים בין ששי לשביעי, עכ״ז כיון שאינו דבר מסויים וניכר כמה הם, אינם נחשבים לא מכללות הששה ולא מכללות הגולל ס״ת. כן בענין זמן ימות המשיח וחיי עו״הב הבאים בין אלף הששי לאלף השביעי, כיון שאין שנותיהם מסויימין ולא נודעים כמה שנים הם, לא חשבום [?] רז״ל לא עם הו׳ אלפים ולא עם אלף הז׳.", "ועוד, כי לפי פי׳ רש״י ז״ל בסנהדרין ד״צב הנ״ל, צ״ל שיש עו״הב אחריתי והיא באה אחר אלף הז׳ החרוב. וגם יש תחיית המתים אחרת, שאז כל אותם הצדיקים שחיו אחר ימות המשיח כדאמרן, הם חוזרים ומתים בזמן אלף הז׳ החרוב, ונשמתם תהיה נגנזת בשמי מרומים, וגופם יהיה פורח ע״פ המים כל אותו אלף הז׳ החרוב, רק שאינם חוזרים לעפרם כי אין ארץ להקבר בה גופם. ואחר אלף הז׳ יחדש הקב״ה את עולמו, ושם ינוחו גופות אותם הצדיקים, ויחזיר הקב״ה את נשמתם בהם, וחוזרים וחיים. שכן כתב רש״י ז״ל על מאי דאמרינן התם: תנא דבי אליהו, צדיקים שעתיד הקב״ה להחיותן (אחר ימות המשיח) אינם חוזרים לעפרם. ופירש רש״י ז״ל: אינם חוזרים לעפרם בין ימות המשיח לבין עו״הב, אלא הבשר מתקיים עליהם עד שישובו ויחיו לעת״ל, עכ״ל. ור״ל, כי אעפ״י שלאחר שיחיו יחזרו וימותו באלף הז׳ החרוב, מ״מ אינם חוזרים לעפרם באלף הז׳ שהוא בין ימות המשיח לבין עו״הב שהוא באלף הח׳, אלא הבשר מתקיים עליהם כל אותו אלף הז׳, עד שישובו ויחיו לעת״ל באלף הח׳. מבואר מפירושו שיש תחיה אחרת ויש עו״הב אחרת.", "וכן הוא בזוהר שמות ד״ד ע״א [?], וז״ל: עד דיהא שבת לה׳, לאתקטא נפשין בתענוגי קדושה, כל ההוא אלף שביעאה יהא איהו אסערותא [?] דרוחין קדישין דעמא דישראל לאתלבשא [?] ליתר שבת בגופין אחרנין קדישין לאתקדשא [?] וכו׳, יעו״ש. אמנם קצת קשה, דאמאי קאמר בגופין אחרנין וכו׳, והלא גופם הא׳ שהיה שט [?] ע״פ המים הם חוזרים ומתלבשין בו כדאמרן. ואפשר לפי שאז יהיו אותן הגופין מזוככים וקדושים מאד, ויהיה להם כנפים כנשרים, משו״ה קרי להו גופין אחרנין, ע״ד מ״ש הכתוב ולעבדיו יקרא שם אחר."]}]}, {"title": "פרשת עקב", "chapters": [{"id": "s69", "n": 69, "title": "בו יבואר גלגולי הנשמות תוך הלחם והפירות והבשר, וע״י הברכות הם נתקנים. גם יבואר ענין ברכת האילנות, וענין הבירורים, וענין שאלת שמו על התורה היכן היא, וענין עליית ניצוצות הקדושה לרום עולם", "paras": ["למען הודיעך כי לא על הלחם לבדו יחיה האדם כי על כל מוצא פי ה׳ יחיה האדם. כבר ביארנו פסוק זה בפרשת מקץ בקיצור, ועתה נשוב לבארו בארוכה כי כאן הוא מקומו.", "והענין הוא כי כתב האר״י ז״ל בשער הגלגולים הקדמה כ״ב, וז״ל: ודע כי הנה הרשעים אחר מיתתם נכנסים בגיהנם ומקבלים שם עונשם ומתכפר להם, ומשפטם י״ב חודש. ויש רשעים שכתוב בהם ואת נפש אויבך יקלענה בתוך כף הקלע, ואינם זוכים ליכנס לגיהנם אחר פטירתם למרק עונם, אמנם נפשם הולכת מדחי אל דחי בגלגולים משונים, עד שיתמרק עונם קצת ויוכלו ליכנס אח״כ בגיהנם י״ב חודש להתכפר לגמרי. ולאלו אין זמן קצוב, כי לפעמים ילכו בגלגולים ההם כ׳ שנים או ק׳ או אלף, והכל תלוי כפי ערך העונות שעשו בתחלה בעו״הז וכו׳. ונפרעים ממנו על חטאתיו קודם שיכניסוהו בגיהנם בהרבה מציאות של עונש, וכולם נקראים גלגולים, ר״ל כי יתגלגל או בדומם או בצומח או בחי או במדבר. (לפי״ז גם גלגול המדבר הוא קודם שיכנס לגיהנם, והוא ענין הרוחות הנכנסים בבני אדם רח״ל, שזה נקרא גלגול בחי המדבר, כמבואר שם בסמוך וכמבואר בש׳ רוח הקודש ד״לא, יעו״ש.) וכמעט רוב בני אדם לא ימלטו מלהתגלגל בגלגולים אלה וכו׳.", "ופעם א׳ הייתי עם מורי ז״ל, ואמר לי כי היה רואה בעיניו איש א׳ מזמן דור התנאים שמגולגל בעז אחת נקבה, לסיבת שהיה משמש מטתו לאור הנר וכו׳. והנה אלו המתגלגלים בגלגולים אלו יושבים שם זמן קבוע עד שיתמרק עונם שגרם להם להתגלגל שם בצומח, וככלות זמנם הם עולים ומתגלגלים בבעל חי, וככלות זמנם עולים ומתגלגלים באדם ממש.", "ואמנם ענין זה הגלגול שמתגלגל באדם הוא באחד משני פנים. הא׳, ענין אלו הנשמות של הרשעים שלאחר שמתו ולא זכו ליכנס לגיהנם, נכנסים בגופות בני אדם בעו״הז ומדברים ומספרים כל הקורות אותם שם כנודע (וכמו שנכתוב בעזה״ו לקמן ביחזקאל סי׳ ל״ז, יעו״ש) רח״ל. והשני הוא כי מתעברים באדם בסוד עיבור ומתדבקים בו בהסתר גדול, ואז אם אדם ההוא יחטא, מתגברת עליו הנפש ההיא המתעברת בו ומחטיאו ומסיתו לדרך רע וכו׳ עד שיאבדהו מן העולם ח״ו. והנה כשהנפש המתגלגלת באדם באחד משני פנים הנז׳ השלים זמנו הקצוב לו לעמוד שם ונתכפרו עונותיו (אח״כ בגיהנם כדאמרן), אז יוכל לבוא בעו״הז בגלגול [...] ויוולד בגוף [?].", "[...] לענין כי ראוי לדעת [?] כי לא בכל זמן יש כח אל המגולגלים הנז׳ בדומם ובצומח וכו׳ לצאת משם ולהתתקן, כי לכל זמן ועת לכל חפץ. אמנם זהו זמן עלייתם. דע כי מי שנתגלגל בדומם וגזרו עליו זמן קצוב של כך וכך שנים, הנה כאשר יגיע זמן פנייתו מן הדומם להתגלגל במדרגת הצומח, אינו עולה רק בד׳ חדשים האמצעים שבי״ב חדשי השנה, והם אב אלול תשרי חשון. ואם זמן הקצוב להם נשלם בד׳ חדשים אלו, עולים. ואם לאו, צריך להמתין עד שנה האחרת בד׳ חדשים האמצעיים הנז׳ אשר בה. וזמן עלייתם מן הצומח אל החי הוא בד׳ חדשים הראשונים, שהם ניסן אייר סיון תמוז. וזמן עלייתם מן החי אל האדם הוא בד׳ חדשים אחרונים, שהם כסליו טבת שבט אדר. (וסימן לחדשים הראשונים שעולים בהם המגולגלים בדצח״ם: [...] אב – צומח, [...] כסליו – מדבר [?]. ובא בסימן חודש אב מלא, כדי שלא יסתפק האדם אם אות האל״ף הוא רומז לאדר או לאייר או לאלול.)", "ואמנם שסדר עלייתם היא ע״ד הנז״ל, מן הדומם אל הצומח ומן הצומח אל החי ומן החי אל המדבר, הנה לפעמים יעלה המגולגל שתי מדרגות יחד. כמו מי שנתגלגל בתחלה בדומם שהוא העפר, ותבוא איזה בהמה ותאכל עשב ובו מעורב גוש עפר אשר בו היתה מגולגלת הנפש ההיא, והנה עתה נפש זו נתגלגלה בבהמה ההיא ועלתה ב׳ מדרגות ביחד, שהוא מן הדומם אל החי. או באופן אחר, כגון שיהיה מגולגל בצומח שהוא הירקות ופירות האילן ויאכלם האדם, נמצא כי המגולגל ההוא עלה מן הצומח אל האדם, והם ב׳ מדרגות ביחד. ולפעמים יעלה המגולגל כל המדרגות בפעם אחת, שהוא מן הדומם אל האדם, כגון שהאדם אכל מעט עפר שנתערב בתבשיל, ובאותו עפר היה מגולגל א׳, נמצא שעלה מן הדומם לאדם וכו׳, עי״ש.", "וכל זה הוא בענין הנשמות של בני אדם שע״י חטאם גרמו להתגלגל בדצח״ם כנז״ל. אמנם יש עוד במאכל כמה ניצוצות קדושה שנפלו ע״י חטא אד״הר, וכמו כן יש כמה ניצוצות קדושה שהיו מעורבים במאכל מתחלת ברייתם, כנז׳ בשער המצות פ׳ עקב ד״נח ע״א, וז״ל: ונחזור לכוונת האכילה. הנה נתבאר לעיל שני בחינות בענין האכילה. הא׳ היא בירור המאכל בעצמו, הטוב מן הסיגים המעורבים ע״י חטא אד״הר, וגם מה שהיה מעורב בהם מתחלת ברייתן מששת ימי בראשית כנ״ל. והב׳ היא ענין תיקון הנפשות המגולגלים הנמצאות במאכל ובמשקה וכו׳.", "המתבאר מכל דברי האר״י ז״ל אלו, כי בין ניצוצות הקדושה המעורבים במאכל שנפלו ע״י חטא אד״הר, ובין מה שהיו מעורבים במאכל מתחלת ברייתן, ובין ענין תיקון הנשמות המגולגלים שבהם, אינם נתקנים כי אם ע״י האכילה ממש. ואפילו אם ישב אדם בפרדס או בגנה אשר שם נמצאים כמה נשמות מגולגלים, ויעסוק כל היום וכל הלילה בתורה ובתפלה ובמצות, אינו מועיל לתקן את הנשמות אשר בצומח ובדומם אשר שם.", "ושגגו בזה מקצת הלומדים האומרים שצריך האדם לצאת בחודש ניסן לברך על האילנות המוציאים פרח, כדי שעי״כ יתוקנו נשמות המגולגלים אשר שם. ובמחילה מכבודם שגגו בזה, כי אינם נתקנים כ״א ע״י הברכה והאכילה. ועוד קשה לדבריהם, דאמאי בעינן מוציאין פרח, והא אפי׳ בעלין לבד יש כמה נפשות מגולגלים, כמבואר בס׳ הלקוטים בירמיה על פסוק אסוף אסיפם, יעו״ש. ועוד, למה לא נברך גם על הצמחים, רק על האילנות בלבד. ועוד קשה לדבריהם, דא״כ אמאי לא תקנו רז״ל לצאת בחודש כסליו אל מקום עדרי הצאן ולברך עליהם, כדי שיתוקנו גם נפשות המגולגלים בחי בלתי מדבר. ולמה לא תקנו לברך על הארץ בחודש אב, שבו נעתקים הנשמות מן הדומם אל הצומח. ועוד, ברכה זו מה זו עושה, כי לפי דברי האר״י ז״ל הוא שאם הגיע זמן אותה הנשמה לצאת באותם הד׳ חדשים, היא יוצאה משם ונעתקת לחי בלתי מדבר, ואם לא הגיע זמנה לצאת, היא נשארת שם עד שנה הבאה כדאמרן. רק שע״י האכילה ממש אוכל [?] לעלות קודם זמנה, שהרי האכילה היא מעלה את נפש מגולגלת מן הדומם אל חי מדבר בפעם א׳ כדאמרן.", "ואפי׳ הבירור הנעשה ע״י האכילה יש בה חלוקים. אחת, שיהיה האוכלם צדיק ות״ח. אבל אם הוא רשע או עם הארץ (אע״פ שנכנסין נשמות המגולגלים בתוכו והיו בחי מדבר), לא די שאינו מתקן אותם, אלא אדרבא אפשר שע״י מעשיו (שעושה מכאן ולהבא) פוגם ומקלקל את נפשות המגולגלים ההם יותר ממה שהיו פגומים מצד עצמם. ונוסף ע״ז, כי אפשר שגם הם יתגברו עליו ויחטיאוהו עד שיגרמו רעה לנפשו שלא יוכל להרפא. אמנם הת״ח יש בהם כח לתקן ולעלות מדרגה א׳ העליונה, והיא מבעל חי לאדם, בזכות תורתם (הלומדים מכאן ולהבא). ות״ח היודעים בחכמת הזוהר בדרך הסוד יש כח בהם להעלות ב׳ מדרגות, והוא מן הצומח לאדם, וכ״ש מבעלי חיים לאדם. ות״ח המופלאים בחכמת האמת בשלימות [?] יכולים לעלות אפילו מדומם לאדם, וכ״ש מבעלי חיים לאדם, כמבואר כ״ז בש׳ המצות פ׳ עקב, יעו״ש.", "ומעתה ק״ו הוא, שאם ע״י אכילה ממש צריך שיהיה ת״ח וצדיק ויודע בחכמת הזוהר עד שיוכל לתקן את הנשמה המגולגלת במאכל ההוא, א״כ איך אפ״ל שע״י ברכת האילנות יתוקנו הנשמות אשר שם, וכל שכן ע״י ברכת הבורים ועמי הארצות והנשים על האילנות.", "ומעתה נלכה ונשובה על פסוק שהתחלנו בו, והוא כי לא על הלחם לבדו יחיה האדם וכו׳. והפסוק הוא מדבר בענין הנשמות המתגלגלים במאכל, שע״י אכילת אותו המאכל נעתקים הנשמות ונכנסין באותו האדם האוכלם, ונמצא שעלו ב׳ מדרגות ביחד, מן הלחם שהוא צומח אל האדם שהוא חי מדבר. סלקא דעתך אמינא הואיל וזכו לעלות לחי המדבר, די להם בעליה זו בלבד, כי העליה וההעתק היא עצמה בלוי׳ התיקון. לזה אמר כי לא על הלחם לבדו יחיה האדם (המת המגולגל בלחם ההוא), כי (האדם שאוכלו) [...] צריך לטול [?] וכמ״ש בחכמת הזוהר, ואז תתתקן הנפש ההיא מעט מעט עד שתשלים תיקונה לגמרי. כי על כל מוצא פי ה׳ (שהיא התורה והמצות) יחיה האדם. [...] היה להם להזהר בברכות, שלא יאכלו שום מאכל אלא א״כ יברכו עליו תחלה [?]. [...]", "[...] ובליל [...] בחודש כסליו [?] נתנמנמתי, וראיתי בחלום [?] שאני כוברת החטים, ובעוד שאני כוברת מצאתי בחטים תמרה א׳, וברכתי עליה בורא פרי העץ [?] ואכלתיה. ובאשמורת הבקר היה א׳ עומד לנגדי ואמר לי: חן חן לך אשה טובה, ואני נותן לך תודה כי הצלתני מהצער שאני בו, אעפ״י שלא הצלתני לגמרי, ע״כ. ובאה אלי לשאול את פתרון החלום ההוא. והענין מובן הוא, כי בתמר היה מגולגל נפש זקן א׳, וע״י שאכלה אותה אשה את התמר עלה אותו זקן ב׳ מדרגות ביחד מן הצומח אל חי מדבר, וע״י הברכה נתקן, אך לא לגמרי. ואלמלא היתה מברכת עליו [...] אפשר שהיה מתתקן לגמרי. [...] כי אין הנשים חייבים בעסק התורה, ולכן היה די לה לתקן את נפש הזקן ההוא ע״י הברכה לבדה [?].", "[...] כי הם מבררים ניצוצות קדושה ונשמות ממקורם הראשון, שאותן הניצוצות לא יצאו עדין משם כלל ולא נכנסו בעולם [?], ע״י עסק התורה והתפלה והמצות, מלבד ברכת הנהנין [...]. וע״י עסק התורה והתפלה והמצות הם מתבררין ויוצאים מד׳ קליפות דנוגה של ד׳ עולמות אצילות בריאה יצירה עשיה (וסימנם אבי״ע) [...], והמובחר שבהם נעשה ממנו נשמות בני אדם או מלאכים, והגרוע ממנו נעשה בעל חי, והיותר גרוע ממנו נעשה הצומח, והגרוע מכולם נעשה הדומם, כמבואר כ״ז בספר עץ חיים בסוף [?] שער [...] ובראש פ״ב. והן הן אותן הניצוצות שכתבנו לעיל שבאוכל. וגם מתבררין נשמות המגולגלים אשר שם על חטאתם כדאמרן, ע״י האכילה והברכה, כי הם חוזרים ומתבררין פעם ב׳ ונדבקים בדם [האדם], ונעשים עצם מעצמו ובשר מבשרו, והסיגים והפסולת והזוהמא שבהם יוצאים דרך יציאה בני מעיים [?].", "סדר הבירור הנעשה ע״י עסק התורה והתפלה והמצוה כנז״ל, ראיתי [...] בליל ד׳ כ״ג כסליו של שנת התרנ״ט [?] שצדיק א׳ (לא ידעתי מי הוא) [...] הנה נודע כי כאשר יעשה האדם איזה מצוה כתקנה או יברך ברכה א׳, אז אותה המצוה או הברכה, כאשר הם עולים למרום, הנה קודם הכל הם פוגעים [?] במקום הסט״א והקלי׳, והם נכנסין בתוך הקליפות, כי כן הוא דרכם לגלגל [?] לרע. ובהכנסם שם הם מתלבשים תוך פרצוף א׳ מפרצופי הסט״א המיוחס לאותה המצוה [?] ולאותו השורש של האדם העושה המצוה ההיא. ובתחלה היא נכנסת מרגלי הסט״א, כי היא עולה ממטה למעלה, ואח״כ היא עולה מעט מעט עד קדקוד אותו פרצוף. והנה בכל פרצוף ופרצוף מפרצופי הסט״א יש ניצוץ קדוש המחיה אותו, ואותו ניצוץ הוא עשוק שם. ובהכנס המצוה דרך שם, אז מתחבר ניצוץ הקדושה אשר שם עם המצוה ביחד, ואז מאיר אותו הפרצוף הארה גדולה [...]. וכשתתפשט בו אותה המצוה, אז כח אותה המצוה והבל הברכה שבה הוא מגביה הפרצוף ההוא ממקור הקליפות ויפריחהו למעלה בעל כרחם של הקלי׳.", "ובעליית המצוה עם הפרצוף למעלה היא מתגלגלת מעומד ועולה כדמיון [...]. כן הוא סדר עליית כל המצות והברכות והתפלות וכל מעשים טובים שעושה האדם. וא״כ מוכרח הוא שתגלגל עמה גם את פרצוף הסט״א שנתלבשה ונכנסה בתוכו. אמנם היא מתגלגלת בגלגול חזק מאד מאד, כדמיון גלגל מורה השעות שבזמננו [?], שמסלקין ממנו את גלגל העליון המעכב את המרוצה, שאז ימהרו כל הגלגלים להתגלגל במרוצה גדולה מאד. כן הוא גלגול כח המצוה, והיא מגלגלת עמה גם את גוף הסט״א בעת עלייתה לעולם העליון. והנה ע״י גלגול הנז׳ גורם שאותו ניצוץ הקדושה שהיה מובלע מכבר בתוך הגוף של הסט״א כנשמה בתוכו, הוא נעקר מהגוף ונצבר במקום אחד ומתערב ומתקשר עם אותה המצוה בקשר אמיץ, ושניהם הם מכבידים ויורדים מעט מעט בסוף הגוף הסט״א הפורח באויר. כדמיון החטים, שכאשר תכבור אותם בכברה, הנה ע״י תנועת סיבוב הכברה היא גורמת להיות החטים מחוברים למטה בתחתית הכברה מסיבת כובדם, והמוץ שבהם הוא צף ועולה למעלה בעל כרחו. כן הענין בדבר הזה. ואז מתבטל הגוף של אותו פרצוף, כי נעשה כקצף על פני מים. ואז הוא ית׳ מנשב באויר ההוא רוח פסקנית המפריד בין הקדושה לסט״א, ויפריח הקצף ההוא מעל ניצוצי הקדושה ההם, ואותו הקצף יתבטל מן העולם וכל אתר לא אשתכח להון, ונשארים ניצוץ הקדוש והמצוה ככסף מזוקק, ועולים עד עולם העליון בסוד מ״ן, ושם נבררים פעם שניה. כי אעפ״י שנבררו בזמן עלייתם למעלה, עכ״ז לא יבצר שלא ישאר דבוק בהם איזה חלקים מתערובת הקלי׳ [...].", "[...] ומזה הבינותי איך שעסק התורה והמצות והתפלות הם מלאך המות ממש לקליפות. וכמו שאין בני האדם יכולים לעכב את החולה מלמות, כן גם הם אינם יכולין לתפוש את פרצוף הנפקד מהם ולעכב אותו שלא לפרוח. גם בהסתלק א׳ מהם הם בוכים ומספידים עליו, כאשר ספרו לי הרוחות. וגם יש מהם שמתים בעודם קטנים, יען כי יזדמן שאיזה צדיק שהוא משורש אותו ניצוץ יעשה איזה מצוה המיוחסת לאותו ניצוץ, ויפריח לאותו ניצוץ מביניהם. ויש מהם שמזקינים שם, לפי שלא נזדמן להם מי משורשם להפריחם. ובזה יובן מ״ש רז״ל [...] כי ע״י התשובה יהיה מגפה גדולה בקלי׳, ולכן [?] גדולה תשובה שמקרבת את הגאולה.", "ובזה יתורץ [?] ג״כ מה שאמרו רז״ל בגמרא שבת דפ״ט ע״א: ואמר ריב״ל, בשעה שירד משה מלפני הקב״ה בא שטן ואמר לפניו: רבש״ע, תורה היכן היא וכו׳. והלא לא בסתר נתן הקב״ה התורה לישראל, שהרי כל העולם ידעו [?], ופשוטה [...] אצלו. והנה לפי פשט המימרא דריב״ל שאמר בשעה שירד משה מלפני הקב״ה וכו׳, נראה שכוונתו על ירידת משה בסוף המ׳ יום, כמ״ש ויהי ברדת משה מהר סיני ושני לוחות העדות [ביד משה], ובאותה שעה בא סמ׳ ושאל על התורה [?]. ולכן [...] כי שאלת סמ׳ היתה על הלוחות, כי שברי הלוחות [...] מונחים היו [...] ולכן נעלם דבר זה מסמ׳ [?], ושאלת סמ׳ היכן היא וכו׳ [...].", "אמנם לפירוש זה קשה, והלא לעיל מזה אמרינן: ואמר ריב״ל, בשעה שעלה משה למרום אמרו מלאכי השרת לפני הקב״ה: רבש״ע, מה לילוד אשה בינינו. א״ל: לקבל את התורה בא. אמרו לפניו: רבש״ע, חמדה גנוזה וכו׳, עד שחזרו [...] ונצח משה את מלאכי מרום, וגם כל אחד [?] מסר לו דבר, שנאמר ויתן את הקטרת ויכפר על העם וכו׳, ואף סמ׳ [?] מסר לו דבר [...]. וא״כ איך אפשר שהוא שואל על הלוחות, כיון שהיה סמ׳ [נוכח] באותו המעמד של קבלת הלוחות ונתן לו מתנות [?]. ובודאי היה יודע מזה, כי ממעמד הר סיני [...] לאקשויי [?].", "ונלע״ד, כי בסיבת קושיא זו הוצרכו התוספות ז״ל להבין כי שאלת סמ׳ היתה על מתן תורה [?]. וע״ז הקשו: וכי השטן לא ידע במ״ת, ותרצו דאמרינן במדרש ע״פ [...] דהר סיני, שבאותו זמן שהיה הקב״ה נותן התורה טרדו [?] למלאך המות [...] שלא יקטרג [...], יעו״ש. ולפי דבריהם [...] קשה קצת, אמאי המתין לשאול עד אחר מעמד הר סיני [...] ומשה אמנו [?] [...].", "ונלע״ד ליישב, והוא כי בעת מתן תורה יצאו עם [?] הר סיני כל הנשמות שבקליפה, ובאו ועמדו על הר סיני, כמ״ש ואת אשר איננו פה עמנו היום, וכמ״ש רז״ל חירות ממלאך המות. נמצא שסמ׳ וגונדא דיליה, שהם הקליפות כולם, היו כפגר מת, כי לא נשאר בהם [?] ניצוצות קדושה המחיה אותם כ״א ניצוצות השייכים לדומם ולצומח ולחי בלתי מדבר, שכל אלו ניצוצות הם ניצוצות גרועים [...], וא״כ היו הקליפות כאדם המתעלף [?], שאינו מרגיש כלום [...]. ולכן לא שאל קודם לזה [...]. ואילולא [?] חטאו בעגל ע״י היצ״הר, שבטלוהו אח״כ אנשי כנסת הגדולה [...], לא היה מיתה כלל, כי ע״י קבלת הלוחות היו יוצאים מהם [?] גם הניצוצות של הדומם והצומח וחי בלתי מדבר, והיה בטל [היצ״הר] לגמרי. ולכן כאשר [...] את ישראל [?] [לחטוא] בעגל בסוף יום המ׳ [...].", "[...] אז חזרו כל הנשמות למקומם בתוך הקליפות [...] ואז נתעורר סמ׳ מן העילוף [?] והכפיה, ובא לשאול על התורה היכן היא [...]. ובמה שפירשנו נלע״ד ליישב דברי התוספות ז״ל.", "ובזה יתבאר היטב כוונת הפסוק בלע המות לנצח, שלכאורה תיבת לנצח הוא שפת יתר [?]. אך [...] שהנביא מבשר אותנו שלעת״ל יבולע המות לנצח ואינו חוזר עוד, ולא כמו בזמן מתן תורה שנתבטל [?] המות לפי שעה עד מ׳ יום, וחזר אח״כ [...].", "וזה היה ג״כ [?] מ״ש הכתוב לפניו ילך דבר ויצא רשף לרגליו [...] על מתן תורה [?], כי בעת שעמד הקב״ה בהר סיני הלך דבר בתוך הקליפות, וכולם נגפו והיו גוססים קרובים למות. וגם פסוק זה יש לפרשו על גאולתנו העתידה להיות במהרה בב״א [?], שגם היא בעת שילך דבר בסט״א, כי יתבררו כל אותם ניצוצי הקדושה שבהם [...] וכולם ימותו ברגע, ויבולע המות לנצח, ויצא רשף לרגליו [...].", "ונחזור להשלים החלום [?]. [...] וכאשר תכנס אותה המצוה בתוך הסט״א, אינה יכולה לברור [?] רק [...] אז אותה המצוה תהיה מדרגתה וכחה כפי שיעור הנפש שבו, ולא יותר. [...] דרך משל, אם אותו אדם העושה המצוה ההיא לא זכה כ״א לחלק קטן מחלקי הנפש, ועדין לא זכה לקבל את כל ה׳ חלקי הנפש הנקראים נפש רוח נשמה חיה יחידה, דרך משל שלא זכה כ״א לנפש ורוח דנפש או לנר״ן דנפש, הנה כשיעשה [?] איזה מצוה [...] אינה יכולה להפריח כ״א גוף א׳ לבד, אעפ״י שאין הפרש בינו ובין חבירו לא בעשיית המצוה ולא בכונתה [?]. והטעם, כי המצוה שעשה מי שזכה לכל חלקי הנר״ן, הנה היא נעשית ע״י [כל חלק וחלק] כנגד כל חלקי הנר״ן שבו, וכאלו היא נעשית כמה פעמים ברגע א׳, כמ״ש בזוהר כד עטו [?] רגלין ברגלין. ולכן מי שזכה בכל חלקי הנר״ן, הנה הוא יכול להמית כמה גופין מהסט״א בעשיית מצוה א׳, או ג׳ גופים, שיש בכל א׳ מהם חלק א׳ בלבד, ועד״ז בכל החלקים. וחבירו שלא זכה לכל חלקי הנר״ן אינו יכול [...]. והוא על דרך שאמרו רז״ל כל הגדול מחבירו יצרו גדול הימנו [?], כי חלקי הנר״ן הם נפגמים בחטא [...].", "ועתה נשוב להודיעך ההפרש שיש בין העושה המצוה בכונה ובין העושה שלא בכונה. כי העושה בכונה, יהיה כח באותה המצוה שעולה למעלה בחוזק ובמרוצה גדולה, כדמיון כדור היוצא מפי קנה הרובה ומפי כלי התותח, והיא נכנסת מדרך רגלי הקליפה [?] ומפריחתו למעלה בכח חזק ואמיץ מאד, ומגלגלתו באויר גלגול חזק. ולפי [?] חוזק הגלגול של הפרצוף ההוא כך יהיה [?] הזיכוך של ניצוצות הקדושה המבולעים בפרצוף ההוא, כי הגלגול הוא כפי [?] חוזק הכונה ההיא. כי חוזק כונת המצות מסלק תכף את פרצוף הסט״א מבין [...] לפרידת ניצוצות הקדושה מן הקליפה. וזאת המיתה היא נקראת אצלם מיתה פתאומית, עד שאין להם פנאי לדרוש ברופאים ולקטרג על אותה המצוה [?] ולעכב [?] את המצוה אצלם, כי תכף ומיד הוא מתעלם ומסתלק מביניהם.", "אך אם אותה המצוה היא נחה [?] מכח עושיה, היא עולה מעט מעט למעלה ונכנסת תוך הפרצוף ההוא על יד על יד, ותסלקהו לאט לאט, כדמיון החולה המאריך בחליו. ואז כאשר מתגלגל אותו הפרצוף באויר, הוא מתגלגל בנחת ואינו מתברר כראוי. גם אין הבירור יכול לעלות כ״א עד עולם העשיה ולא יותר. והטעם, כי עיקר עליית הבירור הוא נעשה ע״י הגלגול ההוא, וכל זמן שמתגלגל הוא יכול לעלות. ועל כן אם הוא מתגלגל בחוזק, יכול לעלות עד עולם היצירה ולפעמים עד עולם הבריאה וכיוצא. ואם מתגלגל בנחת, אינו יכול לעלות ליצירה, שהרי קודם שיגיע ליצירה הוא נח מגלגולו. ואפי׳ אם יהיה לו כח מעט לעלות למעלה מן העשיה, עכ״ז אינו עולה ליצירה כ״א בתנאי שיוכל להגיע למקום שרשו הראוי לו בעולם היצירה, ולכן אינו עולה אותו המעט, ונשאר במקום שרשו שבעשיה.", "ולפעמים יזדמן שאותה מצוה היא חלושה מאד, וכאשר תתלבש בפרצוף הסט״א לא תוכל להגביהו ולהזיזו ממקומו, וכמשא כבד יכבד עליה, ואז גם המצוה ההיא תשאר בתוך הקלי׳ רח״ל, ונמצא שמוסיף כח בסט״א, ועליו נאמר ולרשע אמר אלהים וכו׳. עד שיזדמן איזה אדם שמאותו השורש ויעשה אותה המצוה עצמה כתקנה, ואז הוא מפריח את הגוף ההוא, והוא זוכה גם במצוה של אותו האיש, כי הוא נוטל חלקו וחלק חבירו, משום דהוה ליה כמציל מזוטו של ים ומשלוליתו של נהר, שהם שלו. עד כאן ראיתי."]}]}, {"title": "פרשת ראה", "chapters": [{"id": "s70", "n": 70, "title": "בו יבואר רמז לשמות ד׳ צדיקים שמתו בעטיו של נחש", "paras": ["ונתת את הברכה על הר גרזים ואת הקללה על הר עיבל. יש לרמוז בפסוק זה את שמות הד׳ צדיקים שמתו בעטיו של נחש, עפ״י האמור בזו׳ בראשית דנ״ז ע״ב, שהם עמרם וישי אבי דוד ובנימין ולוי, יעו״ש. וזה שרמז: ואת הקללה של אד״הר על הר עיבל, ר״ת עמרם ישי בנימין לוי. אבל שאר הצדיקים, אין מיתה בלא חטא, כמ״ש בשבת ד״נה ע״א."]}]}, {"title": "פרשת שופטים", "chapters": [{"id": "s71", "n": 71, "title": "בו יבואר ענין דורש אל המתים באיזה אופן הוא אסור", "paras": ["וחובר חבר ושואל אוב וידעוני ודורש אל המתים. יש לשאול, הואיל ואסרה תורה לדרוש אל המתים, א״כ היכי שאל שמואל מאביו על מעות היתומים, כנז׳ בברכות ד״יח ע״ב. והיאך היה מהרח״ו ז״ל מיחד ומשתטח על קברי הצדיקים ושואל כמה דברים. וכיוצא בזה נזכר ג״כ בזו׳ אחרי מות ד״ע סע״ב, בזמן שהעולם בצער רח״ל, יעו״ש. ואיך [?] ז״ל לשאול את הרוח הנכנס באדם את כל מה שירצה לשאול ממנו, כנז׳ בשער רוח הקודש.", "אך [?] כי מה שאסרה תורה לשאול מן המתים, הוא כמ״ש בסנהדרין ד״סה ע״ב, דתניא: ודורש אל המתים, זה המרעיב עצמו והולך ולן בבית הקברות כדי שתשרה עליו רוח טומאה, יעו״ש. וכן פסק בשלחן ערוך יורה דעה סימן קע״ט סעיף י״ג. ועיין שם בהגהה שכתב: יש מתירין לשאול מן המת אפילו אחר שמת, אם אינו משביע את גופו רק את נפשו."]}]}, {"title": "פרשת כי תצא", "chapters": [{"id": "s72", "n": 72, "title": "בו יבואר טעם איסור לבישת השעטנז לפי שמירת הגוף", "paras": ["לא תלבש שעטנז צמר ופשתים יחדו. לבישת השעטנז הוא חק א׳ מחוקות התורה שאין לה טעם. אמנם שמעתי מפי קדוש החכם ר׳ [?] שמעון אהרן אגסי, המחבר ספר בני אהרן על שער הגלגולים תנצב״ה, שבזמן הזה נתגלה הטעם של איסור השעטנז. והוא כי היה חולי המגפה באחת מערי אירופא, וימת שם עם רב, ומבני ישראל לא מת א׳ באותו חולי. ותמהו הרופאים על זה. ומקצתם אמרו שזה היה מסיבת שהם נימולים, וגם נשיהם הם נולדו מאיש מהול. ומהם אמרו מסיבת שאינם אוכלים בשר החזיר והשקצים. ומהם אמרו לפי שהם מלוכלכים [?] ואינם מנקים את חצריהם וחדריהם מן הזבל. ומהם אמרו לפי שהם אוכלים בשר כשר ושחוט בסכין שאין בה פגם. ועשו הרופאים נסיון והבחנה לאנשי העיר בכל אופנים הנ״ל, ולא פסק חולי המגפה מהם.", "עד שאירע שפעם א׳ קראו לרופא לבקר את חולה א׳ מישראל שהיה חולה בחולי אחר. וכאשר בא הרופא ובקרו, צוה עליו לשכב על מצע של צמר ופשתים, על שהיא אינה חמה כמו הצמר ואינה קרה כמו הפשתן. ואמר החולה לרופא כי השעטנז אסרה לנו התורה, בין ללבוש בין להציע תחתיו. והרגיש הרופא איזה דבר שנוגע למגפה במצוה זו, כי שם היה מנהג כל הנכרים ללבוש ולהציע שעטנז. ויצוו הרופאים לכל אנשי העיר שלא ילבשו ולא יציעו שעטנז, ואז פסקה המגפה מהם. והיו כל הרופאים מהללים ומשבחים את מרע״ה, ואומרים שלא נמצא חכם כמוהו בחכמת אויר העולם, כי שקל את האויר וידע כי אחר ג׳ אלפי שנה ישתנה המזג והטבע של האויר, ולבישת השעטנז תהיה גורמת מגפה בעולם. לפיכך אסר לישראל לבישת השעטנז, ולא אמר להם הטעם, לפי שבזמנו לא היה מוליד מגפה."]}, {"id": "s73", "n": 73, "title": "בו יבואר טעם שאסרה תורה להחזיר גרושתו אחרי היותה לאיש אחר", "paras": ["לא יוכל בעלה הראשון אשר שלחה לשוב לקחתה וכו׳. שמעתי טעם על מה שאסרה התורה להחזיר גרושתו אחרי היותה לאיש אחר. והוא לפי שאם [היתה מותרת לחזור לו], א״כ יוכלו האנשים לעשות קנונייא זה עם זה: ראובן אוהב את אשת שמעון, ושמעון אוהב את אשת ראובן. מה הם עושים, הם מגרשים את נשותיהם, וראובן נושא אשת שמעון ושמעון נושא אשת ראובן, ושוהין עמהם עד זמן שהגבילו, ואח״כ חוזרים ומגרשין שניהם, וכל א׳ חוזר ולוקח את אשתו, וכן עושים [...] בכל חודש וחודש. ולפעמים יזדמן שיש לאיש עני אשה יפ״ת, והוא [...] ויגרש אותה וישא אותה הנואף בשכרו, ואח״כ יגרשנה ותחזור לבעלה [?], והעני משתדל להמציא לו עוד איש אחר להשכירה לו, ומזה תתפרנס אשתו [...]. ונמצא שכל א׳ וא׳ יעשה כן [?], ומלאה הארץ זמה. ולפעמים ימשך מזה גם שפיכות דמים, כי לפעמים תמאס [...] ותאהב את הב׳, וגם הב׳ הוא יאהב אותה ואינם רוצים לגרש כלל [...]."]}, {"id": "s74", "n": 74, "title": "בו יבואר פסוק לא יומתו אבות על בנים וכו׳ שהוא היפך פסוק פוקד עון אבות על בנים", "paras": ["לא יומתו אבות על בנים ובנים לא יומתו על אבות, איש בחטאו יומתו. הנה בעשרת הדברות נאמר פוקד עון אבות על בנים על שלשים ועל רבעים, וזהו היפך פסוק לא יומתו אבות על בנים וכו׳. אך הענין הוא, כי פסוק לא יומתו וכו׳ הוא מצוה אותנו שלא נמית אבות על בנים, והוא אזהרה לב״ד, שאם אדם א׳ נתחייב [מיתה], לא ימיתו גם את בניו עמו, והוא א׳ מתרי״ג מצות השייכים אלינו. ולא כמו שעשה דריוש שהשליך לגוב אריות את האנשים שהלשינו על דניאל, אותם ואת נשיהם ואת בניהם. וכן הוא [...] (מלכים ב׳ סי׳ י״ד): ואת בני המכים לא המית, ככתוב בספר תורת משה אשר צוה ה׳ לאמר לא יומתו אבות על בנים ובנים לא יומתו על אבות וכו׳. מבואר להדיא מפסוק זה כי פסוק לא יומתו אבות וכו׳ הנזכר בתורת משה הוא אזהרה לב״ד, שלא ימיתו האבות עם הבנים והבנים עם האבות.", "אבל פסוק פוקד עון אבות על בנים וכו׳ הוא נאמר על הקב״ה, כמ״ש כי אנכי ה׳ אלהיך אל קנא פוקד עון אבות על בנים וכו׳, ולא על הב״ד של מטה. ואפי׳ פקידה זו לא נאמרה כ״א על עון הע״ז בלבד, כמ״ש בתחלת הפסוק לא תשתחוה להם ולא תעבדם כי אנכי ה׳ אלהיך אל קנא פוקד עון אבות על בנים וכו׳. וכן בעון העגל נאמר: וביום פקדי ופקדתי עליהם חטאתם.", "ועוד יש לתרץ בדרך צחות, והוא כי החטא הוא העון שהוא קל מאד, כי הוא שוגג, ולכן אינו מגיע העונש שלו גם אל הבנים, וזהו אומרו איש בחטאו יומתו, חטאו דייקא. אבל על העון שהוא מזיד, יש בו כח להעניש גם את הבנים, ועל העון אמר הכתוב פוקד עון אבות על בנים.", "וז״ש בדניאל סי׳ ט׳: כי בחטאינו ובעונות אבותינו ירושלים ועמך לחרפה וכו׳. פי׳ כי בחטאת אבותינו אין אנו נענשים, רק בחטאינו ובעונות אבותינו המתוספים עלינו, ירושלים ועמך לחרפה. וז״ש אבותינו חטאו ואינם ואנחנו עונותיהם סבלנו, כי על חטאם אנו נענשים רק [על עונם] [?]. וז״ש: ואף בעונות אבותם אתם ימקו, והתודו את עונם ואת עון אבותם וכו׳. וקרוב לפי׳ זה כתב האר״י ז״ל בשער הפסוקים דניאל סי׳ ט׳, יעו״ש. וכ״ז שאמרנו שהבן הוא נושא בעון האב, זהו דווקא אם הוא הולך בדרך אביו, אבל אם הוא צדיק [?], כבר נאמר ביחזקאל סי׳ י״ח: בן לא ישא בעון האב ואב לא ישא בעון הבן וכו׳."]}]}, {"title": "פרשת כי תבוא", "chapters": [{"id": "s75", "n": 75, "title": "בו יבואר יראת העונש ויראת הרוממות איך הם נזכרים בתורה", "paras": ["אם לא תשמור לעשות וכו׳ ליראה את השם הנכבד והנורא הזה וכו׳ והפלא ה׳ את מכתך. הכוונה היא כמ״ש בתיקונים דרגא חמישאה ביראת ה׳ איהו מאן דדחיל וכו׳ כי יש ב׳ מיני יראה והם יראת העונש שהוא ירא מן הקב״ה והולך בדרך היושר כדי שלא יחלה ולא יעני ושיחיו בניו וכיוצא בזה. ונמצא שאם יהיה בטוח שלא יארע לו שום דבר רע לא היה עובד את ה׳ כלל, אבל עיקר היראה היא יראת הרוממות שיהיה ירא ממנו בגין דאיהו רב ושליט עיקרא ושרשא דכל עלמין והוא עושה רצון בוראו מסיבת גדולתו ית׳ בין לטוב בין לרע באין שום הפרש כלל והיא עיקר היראה. ואם אדם אין לו לא יראת הרוממות ולא יראת העונש והולך שובב בדרך לבו. א״כ מוכרח שישלח לו ה׳ יסורים כדי שלפחות יהיה לו יראת העונש. וז״ש אם לא תשמור לעשות את כל דברי התורה הזאת ליראה את השם הנכבד והנורא הזה וכו׳ שהיא יראת הרוממות לפי שהשם הוא נכבד ונורא. אז מוכרח והפלא ה׳ את מכתך ואת מכות זרעך וכו׳ כדי שלפחות יהיה לו יראת העונש. אמנם גדולה מיראת הרוממות הוא העובד את ה׳ מאהבה שהוא מוסר את נפשו על קדושת שמו ית׳ ואינו חושש אפילו על חייו כמו אברהם שהשליכו נמרוד לכבשן האש. ולכן קראו הקב״ה אברהם אוהבי וכן אמרו על איוב לא עבד איוב את ה׳ אלא מאהבה שנא׳ הן יקטלני לו איחל:"]}]}, {"title": "פרשת וזאת הברכה", "chapters": [{"id": "s76", "n": 76, "title": "בו יבואר מה שאמר במדרש רבה מחציו ולמטה איש ומחציו ולמעלה אלהים", "paras": ["וזאת הברכה אשר ברך משה איש האלהים את בני ישראל וכו׳. במדרש רבה בפרשת וזאת הברכה. אמר מהו איש האלהים א״ר אבין מחציו ולמטה איש ומחציו ולמעלה אלהים עכ״ל. נלע״ד ע״ד מה שאמרו רז״ל לעולם לא ירדה שכינה למטה מעשרה טפחים. א״כ כשירד הקב״ה על הר סיני היה הרקיע גבוה מסיני עשרה טפחים. כי גם הרקיע ירד על ההר דכתיב ויט שמים וירד. וכשעלה[?] משה בהר א״כ חציו התחתון היה עומד בארץ על הר סיני וחציו העליון היה נכנס ברקיע כמו המלאכים. וזה אומרו מחציו ולמטה איש. כי הוא שוכני חלד ומחציו ולמעלה אלהים ר״ל כמלאכים הנקראים אלהים חציו העליון היה ברקיע כמו המלאכים. ואח״כ ראיתי שכן פירש מהרז״ו במדרש רבה הנז׳:"]}]}, {"title": "נביאים", "chapters": [{"id": "s77", "n": 77, "title": "בו יבואר מ״ש רז״ל אשה מזרעת תחלה יולדת זכר איש מזריע תחלה יולדת נקבה", "paras": ["כי לא בכח יגבר איש. בא לרמוז עמ״ש רז״ל נדה ל״א אשה מזרעת תחלה יולדת זכר איש מזריע תחלה יולדת נקבה דכתיב אשה כי תזריע וילדה זכר. והביאו רש״י ז״ל בפ׳ ויגש על פסוק אלה בני לאה יעו״ש. והטעם הוא לפי שהזרע הבא אחרון הוא המתגבר על הטפה שנזרעה בתחלה ומכסה עליה ומצטייר הולד[?] כטפה האחרונה הגוברת. ולפי זה נראה שיכול האדם לעשות כל בניו זכרים אך[?] יזהר שלא ינענע את עצמו כדי שלא יתחמם וימתין עד שישער בדעתו שקדם זרע הנקבה. אמנם רבים עשו כן ולא עלתה בידם כי הכל ברצונו ית׳ שהרי כשאמר הקב״ה לאברהם אבל שרה אשתך יולדת לך בן וכן אלישע שאמר לשונמית את חובקת בן, בהכרח היה שתתגבר טפת הזכר על טפת הנקבה. וכן בהיפך אם רצון הבורא שתלד נקבה לא יוכל להתגבר בכחו על טפת אשתו ולכן כשילדה את שמואל אמרה כי לא בכח יגבר איש על טפת אשתו כדי שתלד זכר. ומה שאמרו[?] רז״ל אשה מזרעת תחלה וכו׳ סדר היצירה הם אומרים ולא שמפני כך יוכל האדם לעשות את בניו זכרים. או אפשר לומר שכוונתם על אותם האנשים שמסר[?] אותם ה׳ ביד הטבע שאם יהיו נזהרים שלא יזרעו תחלה יוכלו לעשות את בניהם זכרים:"], "ref": "שמואל א׳"}, {"id": "s78", "n": 78, "title": "בו יבואר מהו הנימא שקשרה תמר לאמנון", "paras": ["וישנאה אמנון שנאה גדולה מאד ארז״ל נימא קשרה לו ועשאתו כרות שפכה. פי׳ כי קשרה שערות הרחם צד הימין בצד השמאל ודבקה הרחם זה בזה כדי שלא יוכל אמנון לבוא עליה. ולפי שהיה אמנון להוט לבעול [...] השמש בכח נקרעה[?] עטרת[?] הגיד הקישוי ונעשה כרות שפכה:"], "ref": "שמואל ב׳ סי׳ י״ג"}, {"id": "s79", "n": 79, "title": "בו יבואר ענין המגפה איך היא מתהוה בעולם רח״ל", "paras": ["לך עמי בא בחדריך וסגור דלתך בעדך חבי כמעט רגע עד יעבור זעם. כי הנה ה׳ יוצא ממקומו לפקוד עון יושב הארץ עליו וכו׳. בא לרמוז על מה שכתב[?] האר״י ז״ל בשער הכוונות בסוד פיטום הקטורת כי סוד המגפה הוא מצד[?] שבשם הוי״ה ב״ה ארבעה מלויים שהם ע״ב ס״ג מ״ה ב״ן ואותן המלויים יונקים מד׳ אותיות הפשוטים כי הם שורש שלהם וע״י עונות הדור מסתלקין הוי״ה[?] הפשוטים מן המלויים שלהם וישארו המלויים מבלי הארה ועי״ז מתהוה הדבר יעו״ש. ונלע״ד שזה הסוד רמז אותו ישעיה ע״ה במליצתו באומרו לך עמי בא בחדריך וגו׳ שזה הפסוק הוא מדבר על זמן המגפה כמ״ש בגמרא רבא בעידן רתחא סגר כווי שנאמר לך עמי בא בחדריך וסגור דלתך בעדך וקאמר הנביא למה אני מצוך לסגור דלתך בעדך הטעם הוא כי הנה ה׳ שהם ד׳ אותיות הפשוטים יוצא ומסתלק מע״ב ס״ג מ״ה ב״ן העולים רל״ב כמספר ממקומו בדקדוק. וטעם יציאתו משם הוא כדי לפקוד עון יושב הארץ עליו וכו׳ כי ע״י עונות הדור הם מסתלקין כמש״ל. ואולי גם אתם עמי תענשו ח״ו עמהם לכן לך עמי בא בחדריך וכו׳. וזה סוד פ׳ זכור ה׳ לדוד וגו׳ עד אמצא מק״ום לה׳ וכו׳ שהוא בגורן ארונה היבוסי כדי שתעצר המגפה מעל ישראל וז״ס ברוך כבוד ה׳ ממקו״מו. כי בזמן שיהיה במקומו יהיה ברוך ואינו שרוי בכעס. וזהו ממקומ״ו הוא יפן ברחמיו לעמו וכו׳ ועי׳ בתיקונים דק״א סע״א. וזה סוד האמור בזכריה סי׳ י״ד ויצא ה׳ ונלחם בגוים ההם וכו׳ שהוא מדבר על מלחמת גוג ומגוג ושם עתיד להביא ה׳ עליהם דבר ומגפה כמ״ש ונשפטתי אתו בדבר ובדם וכו׳ וכן נאמר וזאת תהיה המגפה אשר יגוף ה׳ את כל העמים אשר צבאו על ירושלים וכו׳ ומאחר שיהיה דבר ומגפה א״כ צריך שיסתלקו ד׳ אותיות הוי״ה מן המלויים שלהם ולכן נאמר ויצא ה׳ ונלחם בגוים ההם וגו׳ והכתוב מבשר אותנו שלא תאונה אלינו שום רעה.", "והואיל ואתאן[?] על ענין המגפה ראיתי לכתוב פה מה שחלמתי בשנת התרע״ה ליל שבת יתרו[?] כ״ג שבט שעה ח׳ ראיתי כאלו אני הולך בצד מזרחה של בגדאד עיר מולדתי אשר בצד מזרח הנז׳ דרים שם עניים ודלים. ונדמה לי שעוד הלאה הרחק מבתי העניים כמאה אמות יש מקום מקורה כדמות האכסדרא ואין לה שום כותל רק היא מועמדת על ד׳[?] עמודים העומדים בארבע פינות האכסדרא. ותחת הגג היו עומדים שם כמו [...] אנשי צבא אשר היו מכבר בתוך העיר ויצאו אל מזרח העיר להנפש שם ומלבושיהם[?] כולם היה צמר שחור מלבד רוחב אצבע המקיף על זרועם ועל חלקת צוארם שהיה צמר אדום תפור[?] על גבי צמר השחור. והיו עומדים ומביטים ומתבוננים[?] העיר. כאלו רוצים לדעת את הנעשה בעיר ואת המעשה אשר הם עושים שם. כי בימים ההם היה מגפה בעיר רח״ל[?]. ואני הייתי רחוק מהם כמו עשרה אמות ולא השגיחו עלי כי לא נפלה הבטתם עלי. ונדמה לי כי אלו אנשי הצבא הם הם אשר היו נוגפים ומכים את אנשי העיר. ואני נתרחקתי מאצלם ונגשתי אצל שער חצר של עני א׳ מאותם הבתים שבצד המזרח הנזכרים לעיל ושם אצל השער היו עומדים ג׳ אנשים יהודים זקנים עניים ואני באתי ועמדתי אצלם. והייתי מתאונן ומצטער על המגפה. ואמרתי לאותם הג׳ זקנים על ענין א׳ אני מצטער מאד. והוא כי בזמן שהיה בהמ״ק קיים היו לנו נביאים וקודם שתבוא איזה צרה יבוא הנביא בדבר ה׳ ויגיד לנו את חטאינו ופשעינו. ויתרה בנו שנשוב אל ה׳ מאותו העון והחטא אשר בידינו ואם לאו יבואו על שונאי ישראל כך וכך רעות. והיו ישראל חוזרים בתשובה מאותו העון והקב״ה קורע את אותו הגזר דין מעליהם ותתבטל הגזרה ההיא. ואפי׳ שפסקו אח״כ הנביאים בבית ב׳ עכ״פ היו לנו בעלי רוח הקודש[?] או משתמשין בבת קול או בעלי חלומות אמתיים המגידים לנו סיבת הצרה ההיא. והן עתה בעוה״ר חסרנו כל ובבוא איזה צרה לא נדע סבתה[?] ועל איזה דרך נפנה לבטל את הגזרה. ונמשלנו כמו הרב הרודה את תלמידו וכמו האב המייסר את בנו ואינו אומר לו שמסבת חטא פלוני הוא לוקה אהה עלינו ועל רוע מזלינו כי נלקה בלא התראה ובלא ידיעת העבירה שאנו לוקין עליה. ועוד קשיא לאלהינו[?] האם איש אחד יחטא ועל כל העדה יקצוף. והעולה על גביהם כי האנשים החטאים עצמם בתיהם שלום מפחד ולא שבט אלוה עליהם. והאנשים אשר הם תמימי דרך הם אשר נלכדים בעונם[?]. מארי דאברהם הטוב לך כי תעשוק. השופט כל הארץ לא יעשה משפט. ועוד אני מדבר עם אותם ג׳ האנשים ומטיח דברים [...] וחזרו לי [...] מגפה [...] האנשים [...] להם לתקן את האכסניא[?] של ישראל. הגידה נא לי האם חזרו למשול גם על האכסניא[?] של גוים [...] איסורים [...] איסורם בלבד [...] לא ילקו רק אותם האנשים האוכלים איסורים בלבד. א״ל דע לך כי אעפ״י שאנחנו קרואים משחיתים עכ״ז יש לנו רחמנות ואנחנו [...] אינם חוטאים [...] ושאר[?] החוטאים אינם נכתבים אצלנו. אבל אם נפגע בהם בדרך יש לנו רשות להכותם [...] כמ״ש עונותיו ילכדנו את הרשע ובחבלי חטאתו יתמך. ועליהם נאמר ויש נספה בלא משפט. והנה אנחנו מכים וממיתים רק לאותם הנכתבים בפנקס שלנו, הלא יספיק להם יום א׳ או יומים להמית את כולם שהרי דינם כבר נגזר[?] ונחתם ואין ב״ד של מעלה צריך עוד לישב ולעיין בדינם. אך אם נעשה כן להמית אותם ביום א׳ או ביומים למען[?] תדע כי רוב אנשי העיר ימותו מן הפחד ומן הבהלה ולא ישיגו אורחות חיים. אבל מרוב חמלתינו שאנחנו מרחמים על הבריות אנחנו מכים גם שאר אנשים שאינם כתובים בפנקס שלנו אלא שרובם הם עונות. אמנם הואיל ולא נגזר עליהם מיתה רק שאנחנו פגענו בהם א״כ צריכים ב״ד העליון לישב ולעיין בדינם האם ראוים למיתה או לאו ובכל המשך הזמן של עיון הדין לא יוכל עוד אותו המשחית להמית את כל חי אפילו מן הנכתבים בפנקסו עד שיגמרו הב״ד את פסק הדין של אותו האיש. ונמצא שבין כך ובין כך לא ימותו כ״כ בני אדם. וגם אותם האנשים הנכתבים למיתה אפשר שחוזרים בתשובה ונקרע גזר דינם ולא ימותו וגם לא ימותו שאר בני אדם מרוב הפחד והחרדה כך הוא דרכינו ומנהגינו לטובת הבריות. והנה בשבוע שעבר ביום ה׳ כ׳ שבט המטיר ה׳ ברד בעיר כי נהפכו אותיות דבר ונעשו צירוף ברד. לכן נתקבצנו אנחנו אלה פה באכסדרא עד אשר נראה מה יהיה תיקון העיר[?]. ואם תסתפק בדברינו אלה ותאמר הלא חלום הוא ואינו מעלה ומוריד. אנחנו נותנים לך סימן ותדע שאמת הוא. והוא כי תדבר אתה וב׳ אנשים עמך עם איש א׳ האוכל נבלות וטרפות ותעשו לו התראה שלא יאכל עוד ואם ימאן ויסרב תאמרו לו הואיל ואתה מסרב לדברינו גוזרים אנחנו עליך שביום פלוני בשעה פלונית תוכה במגפה ובשעה פלונית תפטר. ותראו שכך יהיה בלא תוספת ובלא מגרעת. ובזה תדע שחלום אמת הוא. וראיתי שאחר שגמרו דבריהם עמי הפכו פניהם ויצאו מן העיר הם וכל חבריהם מן שער המזרח של העיר. ובעודם בשער העיר באו עוד ק״כ משחיתים אחרים לסייע למשחיתים הראשונים להכות באנשי העיר. וכשראו כי משחיתים הא׳ עצמם הם יוצאים היו אלו הק״כ מתפלאים ואומרים בלחש א״כ על מה סבלנו טורח הדרך לבוא לעזרת משחיתים הא׳ מאחר שהם יוצאים מהעיר. וראיתי שעמדו כולם בשער המזרחי של העיר ע״כ ראיתי. וביום ה׳ ד׳ לחודש אדר פסקה המגפה מישראל אעפ״י שהיתה עדין נוהגת בנכרים:"], "ref": "ישעיה סי׳ כ״ו"}, {"id": "s80", "n": 80, "title": "בו יבואר ענין גיהנם באיזה פסוק הוא נזכר. וענין תיקון נתן העזתי. ויהי רצון לתיקון נשמות הערטלאין הנקלעים בכף הקלע", "paras": ["כי ערוך מאתמול תפתה גם היא למלך הוכן העמיק הרחיב מדורתה אש ועצים [...] הוכן שאם הת״ח יש בידו איזה עבירה אין תורתו מצלתו מדינה של גיהנם. כי אעפ״י שאמר ריש לקיש ת״ח אין אור של גיהנם שולט בהם וכו׳ לא אמר שאינם יורדים לגיהנם אלא ר״ל אעפ״י שיורדים אין אור של גיהנם שולט בהם. שהרי אפילו על המרצה מעות מידו לידה כדי להסתכל בה ארז״ל לא ינקה מדינה של גיהנם וכ״ש בעונות היותר חמורים. וכמו שמצינו בדואג ואחיתופל שאפי׳ היו ת״ח עכ״ז ירדו לגיהנם כמ״ש דוד המע״ה ואתה אלהים תורידם לבאר שחת וכו׳ וכן ירבעם בן נבט שהיה שונה ק״ג פנים בתורה וכן אותו ת״ח הנז׳ בזוהר שלח לך דקס״ז ע״א שגזרו עליו שיהיה שעתא ופלגא בגיהנם וכן אלישע אחר שעלה עשן מקברו וכן נתן העזתי המחבר ספר חמדת ימים כמ״ש בסמוך הרי שגם הת״ח יורדים בגיהנם. וא״כ איך יתכן שיאמר ריש לקיש שאין הת״ח יורדים לגיהנם ואפשר שגם אור של גיהנם שולט בהם ומה שאמר ריש לקיש שאין אור של גיהנם שולט בת״ח נלע״ד שזה לא נאמר כ״א על העוסקים בתורה לשמה וכמ״ש בדברינו לקמן בתהלים סי׳ י״ט יעו״ש. ומפרש הכתוב נשמת ה׳ כנחל גפרית בוערה בה. י״ל כי לא גופם הוא נשרף בתפתה אלא נשמתם. וז״ש נשמת ה׳ שהיא הנשמה שנפח ה׳ באפם כמ״ש ויפח באפיו נשמת חיים כנחל גפרית בוערה בה בנשמה ההיא.", "ונלע״ד כי שם העיקרי של גיהנם הוא היה נקרא בפי כל הנביאים בשם תפתה על שם שכל המתפתה ביצרו הוא נופל בו כמ״ש בגמרא. ואיוב קראו בסי׳ י״ז בשם תופת כמ״ש ותופת לפנים אהיה. כי תופת ותפתה הם שמות קרובים זל״ז. וצדיקים הראשונים שהיו בבית א׳ בזמן מנשה מלך יהודה קראו להתפתה בשם גיהנם על שם איש א׳ שהיה בימים ההם הנקרא בן הנום שהיה[?] לו מחוץ לירושלים גיא גדולה מאד והיתה נקראת על שמו גי בן הנום או גי הנום. ושם היה מועמד צלם גדול הנקרא מולך. והוא נעשה מנחשת ותוכו חלול ותואר פניו כמו העגל וידיו פתוחות כאדם הפותח ידו לקבל מחבירו. והכומרים היו מסיקין אש בחללו עד שהיו ניצוצות ניתזין ממנו. וישראל היו מביאין בניהם ובנותיהם לעבודת המולך והכומרים היו נוטלים את התינוק מיד אביו ומשליכין אותו בתוך יד המולך והתינוק היה נשרף מיד וזה גי הנום נקרא בשם תופת ג״כ. לפי שהיו עושים שם במות לעמוד עליהם לתופף בתופים בעת העברת התינוק למולך כדי שלא ישמעו האב והאם צעקתו של התינוק ויכמרו רחמיהם עליו ויחזקו ויקחוהו מיד הכומרים. וז״ש במלכים ב׳ סי׳ כ״ג וטמא את התופת אשר בגי בני הנום לבלתי להעביר איש את בנו ואת בתו באש למולך וכמבואר שם ברד״ק יעו״ש. וצדיקים הראשונים שהיו בדור בן הנום קראו את התפתה בשם גי הנום. יען כי גם [...] סיבה[?] להחטיא בה בני ישראל והיא כדמיון התפתה שנאמר בה מדורתה וגו׳ רק שבתפתה שורפים נשמות ובגי הנום שורפים גופות. ולא עוד אלא שגם גי הנום נקרא תופת כמ״ש במלכים ב׳ הנז״ל וטמא את התופת וכו׳ וכן קראו ירמיה[?] בשם תופת כנז״ל. ומשם ואילך נעלם[?] שם התפתה מפיהם והיו קורין להתפתה הנביאים בשם גי הנום. וכענין שינוי שם זה מצינו בשמואל א׳ סי׳ ט׳ שאמר כי לנביא היום יקרא לפנים הרואה.", "ודע כי עיקר שם גיהנם הוא ב׳ תיבות כמו[?] שנכתב במלכים ב׳ סי׳ כ״ג ובירמיה סי׳ ז׳ וי״ט ול״ב ובדברי הימים ב׳ סי׳ כ״ח ול״ג יעו״ש אלא לפי שתיבת ״גי״ היא תיבה קטנה נתחברה עם תיבת ״הנם״ ונעשת גיהנם וראיה לדברינו הוא ממ״ש בזוהר נח דס״ב ע״ב וז״ל כמה חבילי טריקין מתכנשן עלייהו. בארבע סטרין אשא מלהטא בגי בן הנם. תלת זמני ביומא מתוקדן ולא עוד אלא בזמנא דישראל מתיבין בקול רם אמן יהא שמיה רבא מברך קב״ה מתמלי רחמין וחייס על כלא ורמיז למלאכא דממנא על תרעי דגיהנם סמרי״אל שמיה וכו׳ יעו״ש. הרי שבתחלה קרא לגיהנם בשם גי בן הנם בב׳ תיבות כמו שכתוב בנביאים ואח״כ קראו גיהנם בתיבה א׳. גם דע כי תיבת גיהנם אות הנו״ן הוא בניקוד חולם אלא שהוא חסר ו׳ וכמו שכתוב במלכים ובירמיה ובדברי הימים במקומות שזכרנו למעלה. אבל לפי שנכתב גם בדברי רז״ל גיהנם חסר ו׳ כמו המקרא טעו הלומדים וקראו אותו גיהנם בניקוד קמץ תחת הנו״ן. ועי׳ במדרש שמואל בפ״ה דאבות ששם כתוב אבל תלמידיו של בלעם הרשע יורשים גיהנם וכו׳ וכן עז פנים לגיהנם וכו׳ שניהם כתוב חסר ו׳ ומנוקדים בחולם. וזה ראיה לדברינו.", "ונחזור על מה שכתבנו למעלה שגם נתן העזתי שאעפ״י שהיה ת״ח ולמדן גדול ובקי בנגלה ובנסתר כנודע מספרו הנקרא חמדת ימים עכ״ז לא ניצול מדינה של גיהנם. וחדשות אני מגיד כי בשנת תרע״א ליל ב׳ כ״ה כסליו בהיותי מספר לפני בני ביתי סיפור מעשה הנס של חנוכה הנכתב בספר חמ״י הנז׳. נתנמנמתי מעט באמצע הלימוד וראיתי איש א׳ בן מ״ה שנה שמן ובעל בשר ויפה תואר ויפה מראה והוא איש חלק ואין לו זקן כ״א כשלשה וד׳ שערות אחת הנה ואחת הנה בפניו רחוקים זה מזה והוא עומד באחורי צד שמאלי והגיש פניו אצל אזני ולחש לי אני הוא המחבר ספר חמדת ימים ועתה שמע בקולי ונהוג כמנהגי (ר״ל שאהיה מאמין בשבתאי צבי שר״י שהוא משיח ה׳ ח״ו) ואני אלמדך כל ד׳ חלקי חמדת ימים ברגע א׳. אמרתי לו איך אפשר להיות דבר זה שאלמוד ד׳ חלקי חמ״י ברגע א׳ (אעפ״י שלא היה דעתי בחלום לנהוג כמנהגו ח״ו) א״ל דע כי כאשר חברתי ספר חמ״י כבר הייתי נצמד לשבתאי צבי ונוהג בצנעה כמנהגו ולפי שהיה רצוני למשוך גם את לבות בני ישראל אחריו עלה[?] בדעתי שבודאי לא ישמעו לדברי. ולכן עשיתי תחבולה גדולה וחברתי את ספר חמ״י שכולו מלא מוסר וחסידות ויראת ה׳ כדי שאם אח״כ אפתה את ישראל שימשכו אחרי שבתאי צבי יקבלו את דברי באין אומר ודברים באומרם שאיך איש חסיד וקדוש בקי בנגלה ובנסתר כזה יעשה מדחה לישראל ח״ו אם לא [...] ששבתאי צבי הוא משיח ה׳ באמת ועי״כ יבטלו דעתם מפני דעתי. וזהו מה שאמרתי אליך שאם תעשה כמנהגי אלמדך ברגע א׳ כל ד׳ חלקי חמ״י יען כי כל עיקר חיבור הד׳ חלקי חמ״י אינו כי אם למען שיסכימו הלומדים בו להמשך אחרי דעתי ורצוני. ואם רצונך להסכים א״כ הרי אתה כאלו למדת כל הד׳ חלקים כי למה לך עוד ללמוד אותם מאחר שנעשת בקשתי בלא לימוד ונמצא כאלו למדת ברגע א׳ כל מגמת חיבור חמ״י. ע״כ ראיתי ונתעוררתי:", "בליל ד׳ כ״ז כסליו הנז׳ ראיתי כאלו זמן מנחת שבת ואני מעוטף בגלימה של צמר מסיבת הקור ויושב על מצעות של צמר בחדר מיוחד ויושב ולומד בספר עץ החיים וכמו עשרים ספרים אחרים כמו שמונה שערים וספרי המפרשים פתוחים ומונחים מלפני ומשני צדדי כדי לעיין בהם על איזה דבר נחוץ[?] קשה ההבנה שנולד לי באותה סוגייא ולבי היה טרוד מאד ונבוך בהבנת הענין ההוא. ובתוך כך ראיתי עורב א׳ גדול מאד כפלים משאר העורבים שהיה מבולבל מאד ומתהפך בעפיפתו כאלו היה מוכה בראשו מן הרודפים אחריו ובא ונחבא לו תחת גלימתי מרוב הפחד. ואני חזרתי את פני לאחורי כדי להביט מי הוא זה הרודף אחריו וארא והנה ג׳ אנשים ובידם מקלות חובלים שהיו מכים בהם את העורב ההוא מכות אכזריות אכן לא ידעו אנה נמלט העורב מידם. והיו מביטים בכעס וזעם אנה ואנה לדעת את המקום אשר ברח שם העורב כדי לרדוף עוד אחריו ולהכות אותו. והנה נראה לעיני איש א׳ שהוא פקיד על אותן הג׳ האנשים ואמר להם בנוסח זה ״הנה נתן בא לאמי לעזתים[?]״ והראה להם באצבעו על העורב הנחבא תחת גלימתי. (ומזה הבינותי כי עורב זה הוא נתן העזתי) וכאשר שמע העורב שידעו הפקידים מקום מחבואו. קדם ויצא לו מתחת הגלימה וברח לו והאנשים רדפו מהר אחריו וכולם נעלמו מעיני ואיקץ. ואחלום שנית. והנה הוא יום חול ואני מתפלל שחרית בבית הכנסת הנקראת ״בית אל מצרי״ ומקום ישיבתי הוא כמקום שאני רגיל לישב שם שהוא מכוון נגד פתח בהכ״נ. ונתן העזתי בא ופרש כפיו אלי והיה מתחנן ואומר ולך תהיה צדקה לפני [...]", "[...] לשנת התרע״א קבצתי מן הישיבה שלי י״ב בחורים אשר הגדול שבהם היה בן י״ח שנים כי אמרתי שהם הבל שאין בו חטא מדאורייתא והבאתים[?] וישבנו בבהכ״נ בהיכל הקודש כדי לעשות תיקון לנר״ן של נתן העזתי. וקודם כל דבר עשינו לו התרה בצירוף השכינה מן הקללות והנדויים והחרמות והשמתות שעשו בו חכמי ורבני דורו זי״ע. ואח״כ התחלנו ללמוד ספר ראשון של תהלים מלה במלה עד תומו. ואח״כ הקפנו את התיבה שבה ס״ת. ובעת ההקפה אמרנו מזמור יושב בסתר עליון וכו׳ יענך ה׳ ביום צרה וכו׳ אנא בכח וכו׳. ועמדנו נגד ההיכל שגם שם היה ס״ת אחר. ואמרנו הפזמון של אברהם אע״ה הנוהגים לאומרו בליל הושע״ר. שמע ישראל וכו׳ ה׳ הוא האלהים וכו׳ ה׳ מלך וכו׳ חסד לאברהם וכו׳ ואח״כ אמרנו תפלה זו לתיקון הנר״ן של נתן העזתי. וזה נוסחה:", "יהי[?] רצון מלפניך ה׳ או״א אב הרחמים והסליחות. המרחם על כל העולמות[?] שתרחם על עמך ישראל ועל כל נפשות רוחות ונשמות הרשעים הנדונים בגיהנם ובגלגולים[?] בדומם ובצומח ובחי בלתי מדבר ובחי מדבר. ועל כל נפשות רוחות ונשמות הערטלאין המשוטטים בעולם והולכים מדחי אל דחי ביד מלאכי חבלה ונקלעים בכף הקלע. ובכללם תרחם על נפש ורוח ונשמה של פב״פ (ופב״פ) אל מלא רחמים יהמו נא רחמיך עליהם. והקל את העונש המוטל עליהם. כי אתה בעל הרחמים והסליחות. ואעפ״י שחטאו ועוו ופשעו [...] נפשם רוחם ונשמתם [...] שלהם ברחמיך הרבים ובחסדיך הפשוטים[?] ומחוק את שטרי חובם מעליהם והשלך במצולות ים. יהי רצון מלפניך ה׳ או״א שתקבל ברחמים וברצון את התפלות[?] שאנחנו מתפללים לפניך על נפש ורוח ונשמה של עבדך (אמתך) פב״פ. נא אב הרחמים והסליחות סלח נא לחטאיו ולעונו ומחה והעבר את כל פשעיו מנגד עיניך כגודל חסדיך. ואעפ״י שיש עדין עליו דין וחשבון להיות מחויב להענש בעונשים קלים או חמורים. הלא לך ה׳ החסד לתת עליו חסד של חנם וקרע את רוע גזר דינו מעליו. ויעלה ויבוא ויגיע ויראה וירצה לפניך שיח שפתותינו לזכור בזכרון טוב את כל המצות והזכיות והמעשים טובים שעשה פב״פ בהיותו בחיים ולצרפם עם תפלתינו שאנחנו מתפללים לפניך להמשיך ולהשפיע חסד וחמלה וחנינה לנפשו ורוחו ונשמתו להושיעם ולהרגיעם מכל מחבלים ומשחיתים ומקטרגים הממונים עליו לדונו כפי העונשים אשר הונחו עליו ולא יזכרו לו עוד חטאתיו ועונותיו ופשעיו אשר חטא ופשע לפניך. ושא נא לחטאים ולעונות ולפשעים שעשה הן על ידי עצמו והן שגרם לאחרים לחטוא. ותתקן לו חלוק ומלבוש להתלבש ולהתכסות בו נפשו רוחו ונשמתו ולא יהיה עוד עירום ועריה ויהיה לו מנוחה ושלוה והשקט יבוא שלום ינוחו על משכבותם לאור באור פני מלך עולם. ותהיה מנוחתו כבוד בעולם העליון עם הצדיקים והחסידים שבגן עדן. ותהיה חשובה ורצויה ומקובלת לפניך תפלתינו כריח קטורת הסמים הנקטר בהיכלך על מזבח הזהב ומלפניך מלכינו ריקם אל תשיבנו. חננו מלכינו ועננו למען שמך הקדוש (יכוין בשם אריארת״א[?]) הרמוז בר״ת אנא רחמיך יכבשו את רוגזך תעביר אשמותינו. כי אל שומע תפלות ותחנונים אתה. ויגולו רחמיך על מדותיך בזכרינו לפניך י״ג מדות הכתובים על ידי משה עבדך כאמור וירד ה׳ בענן ויתיצב עמו שם ויקרא בשם ה׳. ויעבור ה׳ על פניו וכו׳ ושמע את תפלתינו כי אתה שומע תפלת כל פה. ברוך שומע תפלת עמו ישראל ברחמים:", "ותקענו ג״פ תשר״ת. ואח״כ אמרו כל הציבור ביחד מי אל כמוך וכו׳. ואח״כ הפרשנו צדקה על הנר״ן של נתן [...] ואח״כ אמרנו רבי חנניא בן עקשיא וכו׳ [...] התהלים [...] ז׳ הקפות [...] ואמרנו ספר ב׳ של תהלים. וכאשר גמרנו ספר ב׳ חזרנו להקיף את התיבה ועשינו [...] א׳ לכבוד אברהם אבינו ע״ה. ואח״כ חזרנו לישב בהיכל [...] ע״כ.", "ובליל[?] ב׳ שבט הנז׳ ראיתי בחלום איש א׳ שבא אלי [...] צדקות [...] והבינותי כוונתו כאלו [...] שלא הגיעו את נתן העזתי כשהיה [...] אומר אלי שכבר נכנס נתן לגיהנם ולא היה אפשר לו לבוא להחזיק לכם טובה ופגע[?] לשליחות [...] העזתי ואמר לי פסוק זה שרפה באש כסוחה. [...] לשם במדבר הגדול והנורא [...] חמשים אנשים[?] [...] מגיהנם [...] כדי לטרדו [...] ובהגיעו בהליכתו לבדו לשער גיהנם [...] העזתי ומתפתל [...] וכשהביטו בפניו וראו שברשות הוא נכנס אעפ״י שאינו ראוי לגיהנם [...] ואמרו לו כמה קשה ורב מעללים אתה שגם פה מצאת עילה ליכנס לגיהנם. והוא[?] צחק ושחק בלבו על עילה זו שהמציא בחכמתו ולא חש להשיבם כלום. ואמר[?] לי אותו השליח כי מרוב הפצרתכם במקום ב״ה לא השיב פניכם ריקם. הנה באותה שנה שעשינו תיקון הנז׳ מלאוני צרות רבות ורעות [...] אכן תהלות לאל יה שמו לעד שגבה ממני ממון ויסורים ולא גבה [...] הכותב. הודו לה׳ כי טוב כי לעולם חסדו.", "והתימה על הרב ח״ר [...] מנחם [...] הי״ו המחבר הגהות וביאורים על ספר עץ החיים שכתב חדשות בהגהות נהר שלום כי המחבר ספר חמדת ימים אינו נתן העזתי והאריך בדבריו להצדיק את הרשע והביא כמה ראיות לדבריו והם כהררים התלויים בשערה עד שאין מן הראוי להטפל בהם יעו״ש. וספר חמ״י הוא עצמו מכחישו. והוא כי בחלק א׳ שעל שבת כתב בד״מ ע״ד וז״ל ובימי גרושי כי גרשוני מהסתפח בנחלת ה׳ וכו׳ יעו״ש. [...] בכמה מקומות צועק ואומר כי הוא [...] נתן העזתי [...] וזהו בזמן שגרשוהו [...] ארץ ישראל [...] לקבל שבת [...] השדה [...]. ועוד בפזמון דליל שבת כתב בד״ס סע״ב וז״ל ונהגתי לשורר השיר הזה [...] אחריו כנז׳ [...] שמואל [...] יעו״ש. ואחר שכתב תואר השיר שם וז״ל כי השיר הזה יסדו החכם הגדול הרב מנחם לונזאנו ע״ה ובחרתי בו לסיבות הכמוסות [...] ערב ובקר וצהרים וזה תוארו וכו׳ [...] הולך רכיל מגלה סוד [...] יעו״ש. ויש בו עוד י״ב פסוקים יתרים [...]. והר״ת[?] של הפזמון הוא מנחם לונזאנו. [...] ר״ת של אותם הי״ב פסוקים הם בגי׳ תתט״ו כמנין שבתאי צבי בדקדוק. ואותם הי״ב פסוקים הם בגי׳ שע״ט כמנין משיח אהיה בדקדוק. ולפי שנתן העזתי נצמד לבעל סטור[?] לשבתאי צבי לכן בחר לו בזה הפיוט. גם [...] בסיום חלק א׳ של שבת כתב שש ומאורות נתן סביבות עוזו. [...] ראיה גדולה שסמן את שמו בסוף הספר כי הוא נתן העזתי. כי מאורות נתן רמז לשמו נתן ותיבת עוזו רמז לעזתי. ואפשר אם יחפש האדם בשאר הג׳ חלקיו ימצא עוד בכמה מקומות שהמחבר ספר חמ״י הוא נתן העזתי:"], "ref": "ישעיה סי׳ ל׳"}, {"id": "s81", "n": 81, "title": "בו יבואר ענין הצדיקים המתים בקצרות שנים", "paras": ["ויעפו נערים ויגעו ובחורים כשול יכשלו. וקוי ה׳ יחליפו כח וכו׳ כתב רבינו האר״י ז״ל בש׳ הגלגולים הקדמה ג׳ כי יש צדיקים מתים בקצור שנים רח״ל מסיבת שהשלימו תיקון נפשם ואינם יודעים להעלות את נפשם בסוד פסוק נפשי אויתיך בלילה ולהניח נפשם בבאר העליון ולהמשיך את רוחם בגופם[?] במקום נפשם ולכן צריכים שימותו ולחזור אח״כ בגלגול כדי לתקן את רוחם. וכן יש צדיקים שמתים בקצרות שנים על שזכו לתקן את רוחם ולא ידעו להמשיך נשמתם במקום רוחם בסוד ימותו ולא בחכמה. ועל הקדמה זו פירשתי[?] בחלום בחול המועד דסוכות של שנת התרס״ב שזה סוד הפסוק ויעפו נערים ויגעו. ר״ל שיש נערים שהם בבחינת נפש לבד. ואם יעפו בנעוריהם ר״ל בכמה[?] גלגולים עד שיתקנו אותה. מסיבה זו צריך שיגעו כלו׳ שימותו כדי לקבל את הרוח. יען כי לא זכו לתקן את נפשם בתחלת ביאתם בפעם ראשונה לעולם אלא עד שנתגלגלו בכמה גלגולים. לכן אעפ״י שתקנו עתה את נפשם אי אפשר לקבל את רוחם אלא אחר שנפטרים וחוזרים לבוא בגלגול. כי איך ישכון הרוח שאינו מתוקן על נפש המתוקנת. וכן ובחורים שהם גדולים מן הנערים כי הם במדרגת הרוח הנה גם הם כשול יכשלו. ר״ל צריך שימותו כדי לקבל את הנשמה. ואמר כשול יכשלו ולא אמר ובחורים יכשלו. לרמוז שעתה מתו ב׳ פעמים. מיתה א׳ אחרי תיקון נפשם. ומיתה שניה אחרי תיקון רוחם. וקרא למיתה השניה בלשון כשלון לרמוז שהוא מדבר על תיקון הרוח והוא ע״ד שאמר הכתוב ולפני כשלון גובה רוח. שר״ל ולפני המיתה הנקראת כשלון כבר היה לו גובה רוח. שנתקן הרוח וגבה. אכן וקוי ה׳ שהם החכמים היודעים לכוין בפסוק נפשי אויתיך בלילה אינם צריכים למות אלא בחיי חיותם. יחליפו כח. ר״ל יחליפו את נפשם ברוחם ואת רוחם בנשמתם. ומפרש הכתוב איך הם מחליפין אותם. ואמר יעלו אבר כנשרים. תיבת אבר הם אותיות באר. ר״ל שמעלים את נפשם או רוחם בבאר העליון בסוד נפשי אויתיך ב״לילה א״ף ר״וחי וכו׳ ר״ת באר ולכן ירוצו באורך[?] ימים ולא יגעו וכו׳ ע״כ ראיתי:"], "ref": "ישעיה סי׳ מ׳"}, {"id": "s82", "n": 82, "title": "בו יבואר מש״ה ולעבדיו יקרא שם אחר. מה הוא זה שם האחר", "paras": ["ולעבדיו יקרא שם אחר. פי׳ כי עתה בזמן הזה אין גם אחד מבני ישראל שיקרא את שם בנו הנולד לו בשם סמא״ל כי הוא אל אחר. אך לעת״ל שיבולע המות לנצח מן העולם שהוא ס״ם הנקרא אל אחר. אז ולעבדיו יקרא שם אחר שהוא סמאל שאינו שם מיתה הלא הוא שם חיים:"], "ref": "ישעיה סי׳ ס״ה"}, {"id": "s83", "n": 83, "title": "בו יבואר סוד גלגולי לבן בבלעם ובלעם בנבל הכרמלי", "paras": ["קורא דגר ולא ילד עושה עושר ולא במשפט בחצי ימיו יעזבנו ובאחריתו יהיה נבל. כתב האר״י ז״ל בשער הגלגולים הקדמה ל״ו דמ״ה ע״א וז״ל גם לענין לבן נתגלגל בג׳ גלגולים בסדר אותיות שמו ל״בן ב״לעם נ״בל ושלשתם נרמזו בפסוק א׳ והוא פסוק זה קורא דגר ולא ילד וכו׳ כי דגר הוא לבן שקבץ אבנים ועשה יגר שהדותא כי תרגומו של גל הוא דגורא. גם ארז״ל שלא היו לו בנים עד שבא יעקב לביתו וז״ש הכתוב ולא ילד ואח״כ נתגלגל בבלעם שהיתה לו נפש רחבה כמ״ש רז״ל ע״פ אם יתן לי בלק מלא ביתו כסף וזהב וכו׳ ועליו נאמר עושה עושר ולא במשפט אלא לקלל את הבריות. ולפי שמת בחצי ימיו כמ״ש בפרק חלק דק״ו ע״ב לדידי חזי לי פנקסיה דבלעם והוה כתיב ביה בר ל״ג שנין הוה בלעם חגירא כד קטיל יתיה פינחס ליסטאה. לזה אמר הכתוב בחצי ימיו יעזבנו עכ״ל. ובזה פירש ראובן אחי הי״ו כי תיבת ימיו הם בגי׳ ס״ו וחצי ימיו הם ל״ג וזהו בחצי ימיו יעזבנו. ודברי פי חכם חן:"], "ref": "ירמיה סי׳ י״ז"}, {"id": "s84", "n": 84, "title": "בו יבואר שכל א׳ מישראל מחוייב לעסוק בד׳ חלקי התורה שהם פשט רמז דרש סוד שסימנם פרד״ס", "paras": ["אל תבכו למת ואל תנודו לו, בכו בכו להלך כי לא ישוב עוד וראה את ארץ מולדתו. הנביא מדבר עם הציבור המתקבצים להספיד על הצדיק שנפטר ובוכים[?] על שנחסר צדיק א׳ מן העולם שהיה מגין בזכותו על הדור. וקאמר הנביא לציבור אל תבכו למת. והטעם לפי שרובם של צדיקים אינם זוכים לעסוק בכל ד׳ חלקי הפרדס וא״כ מוכרחים הם לחזור ולבוא בגלגול כדי להשלים לימודם בד׳ חלקים. אפילו אם עסק האדם בג׳ חלקים מן הפרד״ס לא יצא ידי חובתו ועליו רמז הכתוב[?] אל תהיו כסוס כפר״ד אין הבין. ועליו נאמר הן כל אלה יפעל אל פעמים שלוש עם גבר להחזירו בגלגול. וא״כ הויא לה פסידא דהדרא לעוה״ז ואין הדור ההוא מפסיד לגמרי ואפשר שביום ההוא יחזור בגלגול כנז׳ בזוהר פ׳ [...] יעו״ש. אמנם בכו בכו להלך. לאותו צדיק שכבר עסק בד׳ חלקי הפרד״ס. וזהו [...] תיבת להלך היא חסר ו׳ ואם תחשוב ד׳ פעמים להלך עם ד׳ הכוללים שהם [...] ארבעה חלקי הפרדס הם בגי׳ שמ״ד כמנין פרדס. [...] שזה הצדיק עסק בד׳ חלקי הפרדס לא ישוב עוד וראה את ארץ מולדתו שזהו באמת פסידא דלא הדרא לעוה״ז ועליו נאמר יבוא שלום ינוחו על משכבותם:"], "ref": "ירמיה סי׳ כ״ב"}, {"id": "s85", "n": 85, "title": "בו יבואר למה נתן ה׳ בכסא כבודו דמות חיה טמאה ועוף טמא שהם אריה ונשר", "paras": ["ודמות פניהם פני אדם ופני אריה אל הימין לארבעתם ופני שור מהשמאול לארבעתן ופני נשר לארבעתן. טעם שקבע הקב״ה את דמות [...] אלו בחיות נושאי כסא כבודו. לפי שכולם הם מלכים. כי האריה הוא מלך בחיות והנשר הוא מלך בעופות. והשור שהוא הראם הנקרא שור הבר כנזכר באיוב סי׳ מ׳ [...]. הרי דימה הכתוב את הקב״ה לד׳ מלכים אלו. אריה שאג מי לא יירא ה״א דבר מי לא ינבא וכתיב כנשר יעיר קנו וכו׳ וכתיב אל מוציאם ממצרים כתועפות ראם לו."], "ref": "יחזקאל סי׳ א׳"}, {"id": "s86", "n": 86, "title": "בו יבואר ענין חיבוט הקבר. ומה ענין כף הקלע. וענין המלבוש. ומה שסיפרו לי הרוחות את הנעשה[?] [...] ששואלים את שמו בקבר. וסיפור כמה רוחות אחרים שנכנסו בבני אדם רח״ל [...] בהם אחרי פטירתם, ובכללם יבואר ענין תיקון שבתאי צבי [...] לנפש ורוח ונשמה של האדם. וגודל מעלת התשובה אשר [...] הרוחות [...] על הפקידים הממונים [...] ונוסח הודוי בלשון [...] קרוביו וקריאת שם הילד על שם הנפטר. וענין הצדקות שעושים היורשים למנוחת הנפטר. [...] יזכה האדם לשוב מאשר חטא על הנפש. וענין המת הבא בחלום אל [...] ודברים רבים כאלה [...] המועיל לכל אדם", "paras": [], "ref": "יחזקאל סי׳ ל״ז"}]}]}</script>
<script>
const BOOK = JSON.parse(document.getElementById('book').textContent);
const store = {
  get(k, d) { try { const v = localStorage.getItem('my:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('my:' + k, JSON.stringify(v)); } catch {} }
};
function gem(n) {
  const u = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], t = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], h = ['', 'ק', 'ר', 'ש', 'ת'];
  let s = h[Math.floor(n / 100)] || ''; n %= 100;
  if (n === 15) s += 'טו'; else if (n === 16) s += 'טז'; else s += t[Math.floor(n / 10)] + u[n % 10];
  return s.length > 1 ? s.slice(0, -1) + '״' + s.slice(-1) : s + '׳';
}
// רשימה שטוחה של כל הסימנים
const flat = [];
BOOK.sections.forEach((sec, si) => sec.chapters.forEach((ch, ci) => flat.push({ sec, ch, id: ch.id })));
let learned = new Set(store.get('learned', []));
let cur = store.get('last', flat[0].id);
let fs = store.get('fs', 1.22);
document.documentElement.style.setProperty('--fs', fs + 'rem');
let theme = store.get('theme', null);
if (theme) document.documentElement.dataset.theme = theme;

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const fmt = s => esc(s).replace(/\[\?\]/g, '<span class="q" title="קריאה משוערת">[?]</span>').replace(/\[\.\.\.\]/g, '<span class="gap" title="קטע שאינו קריא במקור">[…]</span>');

function renderToc() {
  const list = document.getElementById('list');
  list.innerHTML = BOOK.sections.map(sec => `<h3>${esc(sec.title)}</h3><ol>` + sec.chapters.map(ch =>
    `<li><a href="#${ch.id}" data-id="${ch.id}"${ch.id === cur ? ' aria-current="true"' : ''}><span class="n">${ch.n ? gem(ch.n) : ''}</span><span class="t">${ch.ref ? '<b>' + esc(ch.ref) + ':</b> ' : ''}${esc(ch.title)}</span><span class="done">${learned.has(ch.id) ? '✓' : ''}</span></a></li>`).join('') + '</ol>').join('');
  const total = flat.filter(f => f.ch.n).length, done = flat.filter(f => f.ch.n && learned.has(f.id)).length;
  document.getElementById('progText').textContent = `נלמדו ${done} מתוך ${total} סימנים`;
  document.getElementById('progBar').style.width = (100 * done / Math.max(total, 1)) + '%';
}
function show(id, scroll = true) {
  const i = Math.max(0, flat.findIndex(f => f.id === id));
  const { sec, ch } = flat[i]; cur = ch.id; store.set('last', cur);
  const prev = flat[i - 1], next = flat[i + 1];
  const term = document.getElementById('q').value.trim();
  let body = ch.paras.map(p => `<p>${fmt(p)}</p>`).join('');
  if (term.length > 1) body = body.replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), m => `<mark>${m}</mark>`);
  document.getElementById('page').innerHTML = `
    <div class="crumb"><span>${esc(sec.title)}${ch.ref ? ' · ' + esc(ch.ref) : ''}</span>${ch.n ? `<span class="siman">סימן ${gem(ch.n)}</span>` : ''}</div>
    <h1>${esc(ch.title)}</h1>
    <div class="text">${body}</div>
    <div class="actions">
      ${ch.n ? `<button class="learn" id="learn" aria-pressed="${learned.has(ch.id)}">${learned.has(ch.id) ? '✓ נלמד' : 'סימון כנלמד'}</button>` : ''}
      <div class="nav">
        <button id="prev" ${prev ? '' : 'disabled'} title="${prev ? esc(prev.ch.title) : ''}">→ ${prev ? (prev.ch.n ? 'סימן ' + gem(prev.ch.n) : esc(prev.ch.title)) : 'הקודם'}</button>
        <button id="next" ${next ? '' : 'disabled'} title="${next ? esc(next.ch.title) : ''}">${next ? (next.ch.n ? 'סימן ' + gem(next.ch.n) : esc(next.ch.title)) : 'הבא'} ←</button>
      </div>
    </div>
    <p class="note">הטקסט שוחזר מסריקת הספר (HebrewBooks מס׳ 33796) והוגה בעזרת מחשב. [?] מסמן מילה שקריאתה משוערת, ו-[…] מסמן קטע שלא היה קריא במקור.</p>`;
  if (prev) document.getElementById('prev').onclick = () => go(prev.id);
  if (next) document.getElementById('next').onclick = () => go(next.id);
  const lb = document.getElementById('learn');
  if (lb) lb.onclick = () => { learned.has(cur) ? learned.delete(cur) : learned.add(cur); store.set('learned', [...learned]); renderToc(); show(cur, false); };
  renderToc();
  if (scroll) window.scrollTo(0, 0);
  document.getElementById('toc').classList.remove('open');
}
function go(id) { if (location.hash !== '#' + id) location.hash = id; else show(id); }
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.getElementById('list').addEventListener('click', e => { const a = e.target.closest('a'); if (a) { e.preventDefault(); go(a.dataset.id); } });

document.getElementById('q').addEventListener('input', e => {
  const term = e.target.value.trim(), hits = document.getElementById('hits'), list = document.getElementById('list');
  if (term.length < 2) { hits.hidden = true; list.hidden = false; return; }
  const res = [];
  for (const f of flat) for (const p of f.ch.paras) {
    const k = p.indexOf(term);
    if (k >= 0) { res.push({ f, snip: p.slice(Math.max(0, k - 40), k + term.length + 50) }); if (res.length > 60) break; }
  }
  hits.hidden = false; list.hidden = true;
  hits.innerHTML = `<div>${res.length ? res.length + (res.length > 60 ? '+' : '') + ' תוצאות' : 'לא נמצאו תוצאות'}</div>` +
    res.map(r => `<a class="hit" href="#${r.f.id}" data-id="${r.f.id}"><small>${r.f.ch.n ? 'סימן ' + gem(r.f.ch.n) + ' · ' : ''}${esc(r.f.sec.title)}</small>…${esc(r.snip).replace(term, '<mark>' + esc(term) + '</mark>')}…</a>`).join('');
});
document.getElementById('hits').addEventListener('click', e => { const a = e.target.closest('a'); if (a) { e.preventDefault(); go(a.dataset.id); } });
document.getElementById('openToc').onclick = () => document.getElementById('toc').classList.add('open');
document.getElementById('closeToc').onclick = () => document.getElementById('toc').classList.remove('open');
const setFs = d => { fs = Math.min(1.8, Math.max(.95, +(fs + d).toFixed(2))); document.documentElement.style.setProperty('--fs', fs + 'rem'); store.set('fs', fs); };
document.getElementById('bigger').onclick = () => setFs(.08);
document.getElementById('smaller').onclick = () => setFs(-.08);
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; store.set('theme', theme);
};
show(location.hash.length > 1 && flat.some(f => f.id === location.hash.slice(1)) ? location.hash.slice(1) : cur, false);
</script>

</body></html>
